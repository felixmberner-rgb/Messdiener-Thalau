<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messdiener Planer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { macBg: '#ececec', macSidebar: '#f5f5f5', macActive: '#007aff', macText: '#1d1d1f' }, fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { overflow: hidden; margin: 0; background-color: #ececec; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
        input:focus, select:focus, textarea:focus, button:focus { outline: none; }
        .ios-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef } = React;

        // ==========================================
        // 1. HILFSFUNKTIONEN & PROVIDER
        // ==========================================
        function useAppStorage(key, initialValue) {
            const [state, setState] = useState(() => {
                try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; } 
                catch (error) { return initialValue; }
            });
            useEffect(() => { window.localStorage.setItem(key, JSON.stringify(state)); }, [key, state]);
            return [state, setState];
        }

        function AutocompleteField({ value, onChange, suggestions, placeholder, className }) {
            const [isOpen, setIsOpen] = useState(false);
            const wrapperRef = useRef(null);
            const filtered = suggestions.filter(s => s.toLowerCase().includes(value.toLowerCase()) && s.toLowerCase() !== value.toLowerCase());

            useEffect(() => {
                function handleClickOutside(event) { if (wrapperRef.current && !wrapperRef.current.contains(event.target)) setIsOpen(false); }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div ref={wrapperRef} className="relative w-full">
                    <input type="text" value={value} onChange={e => { onChange(e.target.value); setIsOpen(true); }} onFocus={() => setIsOpen(true)} placeholder={placeholder} className={className || "w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"} />
                    {isOpen && filtered.length > 0 && (
                        <ul className="absolute z-50 w-full bg-white border border-gray-200 shadow-lg rounded-lg mt-1 max-h-40 overflow-y-auto">
                            {filtered.map(s => <li key={s} onClick={() => { onChange(s); setIsOpen(false); }} className="px-4 py-2 hover:bg-blue-50 cursor-pointer text-gray-800 border-b border-gray-50 last:border-0">{s}</li>)}
                        </ul>
                    )}
                </div>
            );
        }

        const ViewModelContext = createContext();

       function ViewModelProvider({ children }) { ... }

            // Auto-Login über URL-Parameter (?id=...)
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const projectId = urlParams.get('id');
                if (projectId && projectId.length > 5) {
                    setFirebaseProjectId(projectId.trim());
                }
            }, []);

            const getFbUrl = (docName) => `https://firestore.googleapis.com/v1/projects/${firebaseProjectId.trim()}/databases/(default)/documents/messdiener/${docName}`;

            const fetchAllData = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const fetchDoc = async (docName, setter, parser) => {
                        try { const res = await fetch(getFbUrl(docName)); const data = await res.json(); if(data.fields) setter(parser(data.fields)); } catch(e){}
                    };
                    await fetchDoc('config', f => { if(f.adminPassword) setCloudAdminPassword(f.adminPassword.stringValue); if(f.planGeneriertBis) setPlanGeneriertBis(f.planGeneriertBis.stringValue); }, f=>f);
                    await fetchDoc('statistik', setStatistik, f => { let s={}; for(const [k,v] of Object.entries(f)) s[k]=parseInt(v.integerValue); return s; });
                    await fetchDoc('gruppen', f => { if(f.gruppenJson) setGruppen(JSON.parse(f.gruppenJson.stringValue)); if(f.neueMessdienerJson) setNeueMessdiener(JSON.parse(f.neueMessdienerJson.stringValue)); }, f=>f);
                    await fetchDoc('vormerkungen', f => { if(f.vormerkungenJson) setVormerkungen(JSON.parse(f.vormerkungenJson.stringValue)); }, f=>f);
                    await fetchDoc('wochenAbwesenheiten', f => { if(f.abwesenheitenJson) setRegelmaessigeAbwesenheiten(JSON.parse(f.abwesenheitenJson.stringValue)); }, f=>f);
                    await fetchDoc('urlaubsAbwesenheiten', f => { if(f.dataJson) setAbwesenheiten(JSON.parse(f.dataJson.stringValue)); }, f=>f);
                    await fetchDoc('events', f => { if(f.eventsJson) setEvents(JSON.parse(f.eventsJson.stringValue)); }, f=>f);
                    await fetchDoc('prozessionen', f => { if(f.prozessionenJson) setProzessionen(JSON.parse(f.prozessionenJson.stringValue)); }, f=>f);
                    await fetchDoc('notizen', f => { if(f.notizenJson) setNotizen(JSON.parse(f.notizenJson.stringValue)); }, f=>f);
                } catch(e) {}
            };

            useEffect(() => {
                if(firebaseProjectId) fetchAllData().then(() => setIsAppLoading(false)); 
                else setTimeout(() => setIsAppLoading(false), 500); 
            }, [firebaseProjectId]);

            const syncDoc = async (docName, fields) => {
                if (!firebaseProjectId.trim()) return;
                await fetch(getFbUrl(docName), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) });
            };

            useEffect(() => { const t = setTimeout(() => syncDoc('gruppen', { gruppenJson: { stringValue: JSON.stringify(gruppen) }, neueMessdienerJson: { stringValue: JSON.stringify(neueMessdiener) } }), 1000); return () => clearTimeout(t); }, [gruppen, neueMessdiener]);
            useEffect(() => { const t = setTimeout(() => syncDoc('vormerkungen', { vormerkungenJson: { stringValue: JSON.stringify(vormerkungen) } }), 1000); return () => clearTimeout(t); }, [vormerkungen]);
            useEffect(() => { const t = setTimeout(() => syncDoc('wochenAbwesenheiten', { abwesenheitenJson: { stringValue: JSON.stringify(regelmaessigeAbwesenheiten) } }), 1000); return () => clearTimeout(t); }, [regelmaessigeAbwesenheiten]);
            useEffect(() => { const t = setTimeout(() => syncDoc('urlaubsAbwesenheiten', { dataJson: { stringValue: JSON.stringify(abwesenheiten) } }), 1000); return () => clearTimeout(t); }, [abwesenheiten]);
            useEffect(() => { const t = setTimeout(() => syncDoc('config', { planGeneriertBis: { stringValue: planGeneriertBis }, adminPassword: { stringValue: cloudAdminPassword } }), 1000); return () => clearTimeout(t); }, [planGeneriertBis, cloudAdminPassword]);

            const parseDateStr = (str) => {
                if (!str) return null; const parts = str.match(/\d+/g); if (!parts || parts.length < 2) return null;
                return new Date(parts.length >= 3 ? parseInt(parts[2]) : new Date().getFullYear(), parseInt(parts[1]) - 1, parseInt(parts[0]));
            };

            const normalizeTime = (time) => {
                if(!time) return ""; let clean = time.replace(/h/gi, '').replace(/uhr/gi, '').trim(); let parts = clean.split(/[:.]/);
                if (parts.length === 2) return `${parts[0].length === 1 ? `0${parts[0]}` : parts[0]}.${parts[1].length === 1 ? `${parts[1]}0` : (parts[1] === "" ? "00" : parts[1])}`;
                else if (parts.length === 1 && parts[0] !== "") return `${parts[0].length === 1 ? `0${parts[0]}` : parts[0]}.00`;
                return time;
            };

            const alleMinis = gruppen.flatMap(g => g.mitglieder).sort();

            const value = {
                route, setRoute, activeTab, setActiveTab, isAppLoading, laedt, setLaedt, ladeStatusText, setLadeStatusText, fehlerMeldung, setFehlerMeldung, appState, setAppState,
                apiKey, setApiKey, adminPassword, setAdminPassword, cloudAdminPassword, setCloudAdminPassword, geminiModel, setGeminiModel, firebaseProjectId, setFirebaseProjectId,
                planGeneriertBis, setPlanGeneriertBis, anzahlSonntags, setAnzahlSonntags, anzahlWerktags, setAnzahlWerktags,
                gruppen, setGruppen, neueMessdiener, setNeueMessdiener, statistik, setStatistik, dienste, setDienste,
                vormerkungen, setVormerkungen, regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten, abwesenheiten, setAbwesenheiten, notizen, setNotizen, events, setEvents, prozessionen, setProzessionen,
                pdfFile, setPdfFile, alleMinis, syncDoc, parseDateStr, normalizeTime
            };
            return <ViewModelContext.Provider value={value}>{children}</ViewModelContext.Provider>;
        }
        const useViewModel = () => useContext(ViewModelContext);

        // ==========================================
        // 2. LANDING PAGE & SETUP
        // ==========================================
        function LandingPage() {
            const vm = useViewModel();
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [showPbLogin, setShowPbLogin] = useState(false);
            const [pwdInput, setPwdInput] = useState("");
            const [pbPwdInput, setPbPwdInput] = useState("");

            const handleAdminLogin = () => {
                if (!vm.cloudAdminPassword) {
                    if(pwdInput.length > 3) { vm.setCloudAdminPassword(pwdInput); vm.setAdminPassword(pwdInput); vm.setRoute('admin'); } 
                    else alert("Passwort muss mindestens 4 Zeichen lang sein.");
                } else {
                    if (pwdInput === vm.cloudAdminPassword) { vm.setAdminPassword(pwdInput); vm.setRoute('admin'); } 
                    else alert("Falsches Passwort!");
                }
            };

            const handlePbLogin = () => {
                if (pbPwdInput === vm.cloudPfarrbueroPassword) { vm.setPfarrbueroPassword(pbPwdInput); vm.setRoute('pfarrbuero'); } 
                else alert("Falsches Passwort für das Pfarrbüro!");
            };

            if (showAdminLogin) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#ececec] p-4">
                        <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center relative">
                            <button onClick={() => setShowAdminLogin(false)} className="absolute top-6 left-6 text-gray-400 hover:text-gray-800"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                            <i className="fa-solid fa-lock text-5xl text-gray-800 mb-6 mt-4"></i>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Admin-Bereich</h2>
                            <p className="text-gray-500 mb-8">{!vm.cloudAdminPassword ? "Erstelle jetzt dein Admin-Passwort:" : "Bitte gib dein Admin-Passwort ein:"}</p>
                            <input type="password" placeholder="Passwort..." value={pwdInput} onChange={e => setPwdInput(e.target.value)} onKeyDown={e => e.key==='Enter' && handleAdminLogin()} className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-6 outline-none focus:border-gray-800 text-center" />
                            <button onClick={handleAdminLogin} className="w-full bg-gray-900 hover:bg-black text-white font-bold text-lg py-3 rounded-xl transition">Einloggen</button>
                        </div>
                    </div>
                );
            }

            if (showPbLogin) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#ececec] p-4">
                        <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center relative">
                            <button onClick={() => setShowPbLogin(false)} className="absolute top-6 left-6 text-gray-400 hover:text-blue-800"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                            <i className="fa-solid fa-calendar-check text-5xl text-blue-600 mb-6 mt-4"></i>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Pfarrbüro Zugang</h2>
                            <p className="text-gray-500 mb-8">Dieser Bereich ist passwortgeschützt.</p>
                            <input type="password" placeholder="Passwort..." value={pbPwdInput} onChange={e => setPbPwdInput(e.target.value)} onKeyDown={e => e.key==='Enter' && handlePbLogin()} className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-6 outline-none focus:border-blue-500 text-center" />
                            <button onClick={handlePbLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-3 rounded-xl transition">Entsperren</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen w-full flex flex-col bg-white overflow-hidden">
                    <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center">
                        <div className="max-w-lg w-full text-center flex flex-col items-center py-10">
                            <img src="Messdiener.png" alt="Logo" className="w-40 h-40 md:w-48 md:h-48 object-contain mb-6 drop-shadow-md rounded-3xl" onError={(e) => { e.target.style.display='none'; }} />
                            <h1 className="text-4xl md:text-5xl font-black text-gray-900 mb-2 tracking-tight">Messdienerplan</h1>
                            <h2 className="text-2xl font-bold text-blue-600 mb-12">Thalau</h2>
                            
                            <div className="w-full space-y-4 px-2 md:px-4">
                                <button onClick={() => { if(vm.adminPassword && vm.adminPassword === vm.cloudAdminPassword) vm.setRoute('admin'); else setShowAdminLogin(true); }} className="w-full bg-gray-900 hover:bg-black text-white font-bold text-lg md:text-xl py-4 rounded-2xl shadow-lg transition flex items-center justify-center">
                                    <i className="fa-solid fa-desktop mr-3"></i>Planer öffnen
                                </button>
                                
                                <button onClick={() => { if(vm.cloudPfarrbueroPassword && vm.pfarrbueroPassword !== vm.cloudPfarrbueroPassword) setShowPbLogin(true); else vm.setRoute('pfarrbuero'); }} className="w-full bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold text-lg md:text-xl py-4 rounded-2xl transition flex items-center justify-center">
                                    <i className="fa-solid fa-calendar-check mr-3"></i>Messdiener Vormerken
                                </button>

                                <button onClick={() => vm.setRoute('abwesenheiten')} className="w-full bg-red-100 hover:bg-red-200 text-red-800 font-bold text-lg md:text-xl py-4 rounded-2xl transition flex items-center justify-center">
                                    <i className="fa-solid fa-user-clock mr-3"></i>Abwesenheiten eintragen
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- ABWESENHEITEN PORTAL (Scroll Fix) ---
        function AbwesenheitenPortal() {
            const vm = useViewModel();
            const [step, setStep] = useState(1);
            const [name, setName] = useState("");
            const [neueEintraege, setNeueEintraege] = useState([{ id: crypto.randomUUID(), type: 'single', start: '', end: '' }]);
            const [showExisting, setShowExisting] = useState(false);

            const handleNameSubmit = () => { if(!vm.alleMinis.includes(name.trim())) { alert("Name nicht in der Datenbank gefunden! Bitte wähle deinen Namen aus der Vorschlagsliste aus."); return; } setStep(2); };
            const handleSubmitFinal = () => { const valide = neueEintraege.filter(e => e.start !== ""); if (valide.length === 0) { alert("Bitte mindestens ein gültiges Datum eintragen!"); return; } const neueAbwesenheiten = valide.map(e => ({ id: crypto.randomUUID(), name: name.trim(), start: e.start, end: e.type === 'period' ? e.end : e.start, type: e.type })); vm.setAbwesenheiten([...vm.abwesenheiten, ...neueAbwesenheiten]); setStep(3); };

            const formatDate = (isoStr) => { if (!isoStr) return ""; const p = isoStr.split('-'); return `${p[2]}.${p[1]}.${p[0]}`; };
            const isLocked = (dateStr) => { if (!vm.planGeneriertBis || !dateStr) return false; return new Date(dateStr) <= new Date(vm.planGeneriertBis); };
            const existingEntries = vm.abwesenheiten.filter(a => a.name === name.trim() && new Date(a.start) >= new Date(new Date().setHours(0,0,0,0))).sort((a, b) => new Date(a.start) - new Date(b.start));

            if (step === 3) {
                return (
                    <div className="h-screen w-full bg-gray-50 flex flex-col items-center justify-center p-4">
                        <div className="max-w-2xl w-full text-center bg-white rounded-2xl shadow-sm border border-gray-200 p-8 overflow-y-auto max-h-full">
                            <i className="fa-solid fa-circle-check text-6xl text-green-500 mb-4"></i><h1 className="text-3xl font-bold text-gray-900 mb-2">Erfolgreich gesendet!</h1>
                            <p className="text-gray-600 mb-8">Deine Abwesenheiten wurden gespeichert.</p>
                            <button onClick={() => { setStep(2); setNeueEintraege([{ id: crypto.randomUUID(), type: 'single', start: '', end: '' }]); }} className="text-blue-600 font-bold hover:underline block w-full mb-4">Weitere eintragen</button>
                            <button onClick={() => vm.setRoute('landing')} className="text-gray-500 font-medium">Zurück zur Startseite</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen w-full flex flex-col bg-[#f0ebf8] overflow-hidden">
                    <div className="flex-1 overflow-y-auto py-8 px-4">
                        <div className="max-w-2xl mx-auto w-full pb-10">
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                                <div className="h-3 bg-red-500 w-full"></div>
                                <div className="p-6 md:p-8"><h1 className="text-3xl font-bold text-gray-900 mb-4">Abwesenheiten eintragen</h1><p className="text-gray-600 mb-4 leading-relaxed">Bitte nur eintragen, wenn ihr wirklich verhindert seid!</p><hr className="my-4 border-gray-200" /><p className="text-red-500 text-sm font-medium">* Gibt eine erforderliche Frage an</p></div>
                            </div>
                            {step === 1 && (
                                <>
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-6"><label className="block text-lg font-medium text-gray-800 mb-6">Vor- und Nachname <span className="text-red-500">*</span></label><AutocompleteField value={name} onChange={setName} suggestions={vm.alleMinis} placeholder="Meine Antwort" className="w-full border-b border-gray-300 focus:border-red-500 pb-2 text-lg outline-none bg-transparent transition-colors" /></div>
                                    <div className="flex justify-between items-center mt-8"><button onClick={() => vm.setRoute('landing')} className="text-gray-500 font-bold hover:bg-gray-100 px-4 py-2 rounded-lg transition">Abbrechen</button><button onClick={handleNameSubmit} disabled={!name.trim()} className="bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white font-bold px-8 py-3 rounded-xl transition shadow-md">Weiter</button></div>
                                </>
                            )}
                            {step === 2 && (
                                <div className="space-y-6">
                                    {existingEntries.length > 0 && (
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden"><button onClick={() => setShowExisting(!showExisting)} className="w-full p-6 text-left flex justify-between items-center hover:bg-gray-50 transition"><span className="font-bold text-gray-800 text-lg">Aktuelle Abwesenheiten ansehen</span><i className={`fa-solid fa-chevron-${showExisting ? 'up' : 'down'} text-gray-400`}></i></button>{showExisting && (<div className="p-6 border-t border-gray-100 bg-gray-50 space-y-3">{existingEntries.map(a => (<div key={a.id} className="flex justify-between items-center bg-white p-4 rounded-xl border border-gray-200"><div><div className="font-bold text-gray-800">{a.type === 'single' ? formatDate(a.start) : `${formatDate(a.start)} - ${formatDate(a.end)}`}</div>{isLocked(a.start) && <div className="text-xs text-red-500 font-bold mt-1"><i className="fa-solid fa-lock mr-1"></i>Plan bereits erstellt</div>}</div>{!isLocked(a.start) && <button onClick={() => { if(confirm("Eintrag löschen?")) vm.setAbwesenheiten(vm.abwesenheiten.filter(x => x.id !== a.id)); }} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button>}</div>))}</div>)}</div>
                                    )}
                                    {neueEintraege.map((eintrag, idx) => (
                                        <div key={eintrag.id} className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 relative">{neueEintraege.length > 1 && <button onClick={() => setNeueEintraege(neueEintraege.filter(e=>e.id!==eintrag.id))} className="absolute top-6 right-6 text-gray-400 hover:text-red-500"><i className="fa-solid fa-xmark text-xl"></i></button>}<label className="block text-lg font-medium text-gray-800 mb-6">Start der Abwesenheit <span className="text-red-500">*</span></label><input type="date" value={eintrag.start} onChange={e => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,start:e.target.value}:x))} min={new Date().toISOString().split('T')[0]} className="w-full md:w-1/2 border-b border-gray-300 focus:border-red-500 pb-2 text-lg outline-none bg-transparent mb-8" /><label className="block text-lg font-medium text-gray-800 mb-4">Nur an diesem Tag oder längerer Zeitraum? <span className="text-red-500">*</span></label><div className="space-y-3 mb-8"><label className="flex items-center space-x-3 cursor-pointer p-2 rounded-lg hover:bg-gray-50"><input type="radio" checked={eintrag.type === 'single'} onChange={() => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,type:'single'}:x))} className="w-5 h-5 accent-red-500" /><span className="text-gray-800 text-lg">Nur dieser Tag</span></label><label className="flex items-center space-x-3 cursor-pointer p-2 rounded-lg hover:bg-gray-50"><input type="radio" checked={eintrag.type === 'period'} onChange={() => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,type:'period'}:x))} className="w-5 h-5 accent-red-500" /><span className="text-gray-800 text-lg">Mehrere Tage</span></label></div>{eintrag.type === 'period' && (<div className="bg-red-50 p-6 rounded-xl border border-red-100"><label className="block text-lg font-medium text-gray-800 mb-2">Bis wann?</label><input type="date" value={eintrag.end} onChange={e => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,end:e.target.value}:x))} min={eintrag.start || new Date().toISOString().split('T')[0]} className="w-full md:w-1/2 border-b border-gray-300 focus:border-red-500 pb-2 text-lg outline-none bg-transparent" /></div>)}</div>
                                    ))}
                                    <div className="flex justify-center mb-8"><button onClick={() => setNeueEintraege([...neueEintraege, { id: crypto.randomUUID(), type: 'single', start: '', end: '' }])} className="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold px-6 py-3 rounded-full shadow-sm flex items-center"><i className="fa-solid fa-plus mr-2"></i>Weiteres Datum</button></div>
                                    <div className="flex justify-between items-center mt-8 pb-10"><button onClick={() => setStep(1)} className="text-gray-500 font-bold hover:bg-gray-100 px-4 py-2 rounded-lg transition">Zurück</button><button onClick={handleSubmitFinal} className="bg-red-500 hover:bg-red-600 text-white font-bold px-8 py-3 rounded-xl transition shadow-md">Senden</button></div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PFARRBÜRO VIEW (Scroll Fix) ---
        function PfarrbueroView() {
            const vm = useViewModel();
            const [datum, setDatum] = useState(''); const [anlass, setAnlass] = useState(''); const [uhrzeit, setUhrzeit] = useState(''); const [minis, setMinis] = useState([""]);
            const handleSave = () => {
                if(!datum) { alert("Bitte ein Datum eingeben!"); return; }
                const parts = datum.split('-'); let wt = "Sonntag";
                if(parts.length === 3) { const d = new Date(parts[0], parts[1]-1, parts[2]); const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag']; wt = days[d.getDay()]; }
                const formattedDate = parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : datum;
                vm.setVormerkungen([...vm.vormerkungen, { id: crypto.randomUUID(), datum: formattedDate, wochentag: wt, uhrzeit: uhrzeit, anlass: anlass || "Gottesdienst", minis: minis.filter(m => m.trim() !== "" && vm.alleMinis.includes(m.trim())) }]);
                alert("Erfolgreich vorgemerkt!"); setDatum(''); setAnlass(''); setUhrzeit(''); setMinis([""]); vm.setRoute('landing');
            };

            return (
                <div className="h-screen w-full flex flex-col bg-gray-50 overflow-hidden">
                    <div className="bg-blue-600 text-white p-4 pt-10 flex items-center shadow-md shrink-0 z-10">
                        <button onClick={() => vm.setRoute('landing')} className="text-white hover:text-blue-200 p-2"><i className="fa-solid fa-chevron-left text-xl"></i></button>
                        <h1 className="text-xl font-bold ml-4 flex-1">Vormerken (Pfarrbüro)</h1>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 md:p-6">
                        <div className="max-w-2xl mx-auto w-full pb-10">
                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl mb-8 text-sm leading-relaxed border border-blue-100"><i className="fa-solid fa-circle-info mr-2"></i>Hier können Sie Messdiener eintragen, die sich bereits gemeldet haben.</div>
                            <div className="space-y-6">
                                <div className="ios-card p-5 border border-gray-100"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Datum *</label><input type="date" value={datum} onChange={e => setDatum(e.target.value)} className="w-full text-lg border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent" /></div>
                                <div className="ios-card p-5 border border-gray-100 flex flex-col md:flex-row gap-4"><div className="flex-1"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Uhrzeit</label><input type="text" placeholder="z.B. 09.30" value={uhrzeit} onChange={e => setUhrzeit(e.target.value)} className="w-full text-lg border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent" /></div><div className="flex-1"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Anlass</label><input type="text" placeholder="z.B. Taufe" value={anlass} onChange={e => setAnlass(e.target.value)} className="w-full text-lg border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent" /></div></div>
                                <div className="ios-card p-5 border border-gray-100"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-4">Fest eingeteilte Personen</label>{minis.map((m, i) => <div key={i} className="flex items-center mb-3"><span className="text-gray-400 font-medium mr-3 w-4 text-right">{i+1}.</span><AutocompleteField value={m} onChange={val => { let nm = [...minis]; nm[i] = val; setMinis(nm); }} suggestions={vm.alleMinis} placeholder="Name suchen..." className="flex-1 border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent text-lg" /></div>)}<button onClick={() => setMinis([...minis, ""])} className="mt-4 text-blue-600 font-bold flex items-center"><i className="fa-solid fa-circle-plus mr-2"></i>Weitere Person</button></div>
                                <button onClick={handleSave} className="w-full bg-blue-600 active:bg-blue-700 text-white font-bold text-xl py-4 rounded-xl shadow-lg mt-8 mb-10 transition">Vormerkung Speichern</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function WerkzeugeView() {
            const vm = useViewModel();
            const exportiereGruppenPDF = () => {
                const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' }); let currentY_mm = 20;
                doc.setFontSize(20); doc.setFont("helvetica", "bold"); doc.text("Übersicht: Alle Messdiener-Gruppen", 105, currentY_mm, { align: "center" }); currentY_mm += 15;
                for (const gruppe of vm.gruppen) {
                    if (currentY_mm + 15 > 280) { doc.addPage(); currentY_mm = 20; }
                    doc.setFontSize(16); doc.setFont("helvetica", "bold"); doc.text(`Gruppe ${gruppe.name}`, 20, currentY_mm); currentY_mm += 8;
                    doc.setFontSize(12); doc.setFont("helvetica", "normal");
                    for (const mini of gruppe.mitglieder) {
                        if (currentY_mm + 6 > 280) { doc.addPage(); currentY_mm = 20; }
                        const prefix = vm.neueMessdiener.includes(mini) ? "* " : "• ";
                        doc.text(`${prefix}${mini}`, 25, currentY_mm); currentY_mm += 6;
                    }
                    currentY_mm += 8;
                }
                doc.save("Gruppenliste.pdf");
            };
            return (
                <div className="h-full flex flex-col">
                    <MobileTopBar title="Werkzeuge" />
                    <div className="flex-1 overflow-y-auto p-6 md:p-10 bg-gray-50/50">
                        <div className="max-w-3xl mx-auto md:mx-0">
                            <div className="hidden md:block mb-8"><h1 className="text-3xl font-bold text-gray-900">Werkzeuge</h1></div>
                            <div className="bg-white rounded-xl border border-gray-200 p-5 md:p-6 shadow-sm mb-4 md:mb-6">
                                <div className="flex items-center space-x-3 mb-2"><i className="fa-solid fa-file-pdf text-orange-500 text-2xl w-8 text-center"></i><h2 className="text-lg md:text-xl font-bold text-gray-800">Gruppen-Liste (PDF)</h2></div>
                                <p className="text-sm md:text-base text-gray-500 mb-5 ml-11">Erstellt ein druckfertiges PDF mit allen angelegten Gruppen.</p>
                                <div className="ml-11"><button onClick={exportiereGruppenPDF} className="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm w-full md:w-auto">PDF herunterladen</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

            const vm = useViewModel();
            const SectionBox = ({ icon, title, children }) => (
                <div className="mb-8"><div className="flex items-center space-x-3 mb-4"><div className="w-8 flex justify-center"><i className={`${icon} text-2xl`}></i></div><h2 className="text-xl font-bold text-gray-800">{title}</h2></div><div className="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">{children}</div></div>
            );
            return (
                <div className="h-full flex flex-col">
                    <MobileTopBar title="Einstellungen" />
                    <div className="flex-1 overflow-y-auto p-6 md:p-10 bg-gray-50/50">
                        <div className="max-w-3xl mx-auto md:mx-0 pb-12">
                            <div className="hidden md:block mb-8"><h1 className="text-3xl font-bold text-gray-900">Einstellungen</h1></div>
                            
                            <SectionBox icon="fa-solid fa-cloud text-blue-500" title="Cloud Synchronisation">
                                <input type="text" placeholder="Firebase Projekt-ID..." className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 mb-4 outline-none" value={vm.firebaseProjectId} onChange={e => vm.setFirebaseProjectId(e.target.value)} />
                                <button onClick={vm.syncStatistikToFirebase} className="bg-gray-100 px-4 py-2 rounded-lg text-sm font-bold border border-gray-300"><i className="fa-solid fa-arrow-rotate-right mr-2"></i>Jetzt manuell synchronisieren</button>
                            </SectionBox>

                            <SectionBox icon="fa-solid fa-lock text-purple-500" title="Passwörter & Sicherheit">
                                <div className="grid grid-cols-1 gap-4 mb-4">
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Passwort: Pfarrbüro (Vormerken)</label>
                                        <input type="password" placeholder={vm.cloudPfarrbueroPassword ? "Bereits hinterlegt (Tippen zum Ändern)" : "Kein Passwort vergeben"} className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none" onChange={e => { vm.setCloudPfarrbueroPassword(e.target.value.trim()); vm.setPfarrbueroPassword(e.target.value.trim()); }} />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Gemini API Key</label>
                                        <input type="password" placeholder={vm.apiKey ? "Bereits hinterlegt (Tippen zum Ändern)" : "API Key..."} className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none" onChange={e => { if (e.target.value.trim() !== '') { vm.setApiKey(e.target.value.trim()); } }} />
                                    </div>
                                </div>
                            </SectionBox>

                            <SectionBox icon="fa-solid fa-users text-orange-500" title="Einteilungs-Mengen">
                                <div className="flex flex-col md:flex-row md:space-x-12 space-y-4 md:space-y-0">
                                    <div className="flex items-center justify-between md:justify-start space-x-4 w-full md:w-auto"><span className="text-sm font-medium">Sonntage: {vm.anzahlSonntags}</span><div className="flex border border-gray-300 rounded-lg overflow-hidden"><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlSonntags(Math.max(1, vm.anzahlSonntags - 1))}>-</button><div className="w-px bg-gray-300"></div><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlSonntags(Math.min(10, vm.anzahlSonntags + 1))}>+</button></div></div>
                                    <div className="flex items-center justify-between md:justify-start space-x-4 w-full md:w-auto"><span className="text-sm font-medium">Werktage: {vm.anzahlWerktags}</span><div className="flex border border-gray-300 rounded-lg overflow-hidden"><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlWerktags(Math.max(1, vm.anzahlWerktags - 1))}>-</button><div className="w-px bg-gray-300"></div><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlWerktags(Math.min(10, vm.anzahlWerktags + 1))}>+</button></div></div>
                                </div>
                            </SectionBox>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 7. ADMIN APP & DASHBOARD
        // ==========================================
        function AdminDashboard() {
            const vm = useViewModel();
            const tiles = [
                { id: 'planer', label: 'Planer', icon: 'fa-regular fa-file-lines', color: 'bg-blue-500' },
                { id: 'prozessionen', label: 'Prozessionen', icon: 'fa-solid fa-person-walking', color: 'bg-purple-500' },
                { id: 'events', label: 'Events', icon: 'fa-solid fa-champagne-glasses', color: 'bg-pink-500' },
                { id: 'vormerken', label: 'Vormerken', icon: 'fa-regular fa-calendar-check', color: 'bg-green-500' },
                { id: 'statistik', label: 'Statistik', icon: 'fa-solid fa-chart-column', color: 'bg-orange-500' },
                { id: 'notizen', label: 'Notizen', icon: 'fa-regular fa-note-sticky', color: 'bg-yellow-500' },
                { id: 'messdiener', label: 'Gruppen', icon: 'fa-solid fa-user-group', color: 'bg-indigo-500' },
                { id: 'einstellungen', label: 'Optionen', icon: 'fa-solid fa-gear', color: 'bg-gray-500' },
                { id: 'werkzeuge', label: 'Tools', icon: 'fa-solid fa-screwdriver-wrench', color: 'bg-teal-500' }
            ];

            return (
                <div className="min-h-screen bg-[#f2f2f7] p-6 pb-12 flex flex-col antialiased">
                    <div className="flex justify-between items-end mb-8 pt-8">
                        <h1 className="text-4xl font-black text-gray-900 tracking-tight">Übersicht</h1>
                        <button onClick={() => { vm.setRoute('landing'); vm.setAdminPassword(''); }} className="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-bold text-red-500 border border-gray-200"><i className="fa-solid fa-power-off mr-2"></i>Abmelden</button>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {tiles.map(t => (
                            <div key={t.id} onClick={() => vm.setActiveTab(t.id)} className="ios-card p-6 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
                                <div className={`w-14 h-14 ${t.color} text-white rounded-full flex items-center justify-center text-2xl mb-3 shadow-md`}><i className={t.icon}></i></div>
                                <span className="font-bold text-gray-800 text-[15px]">{t.label}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AdminApp() {
            const vm = useViewModel();
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            if (isMobile && (!vm.activeTab || vm.activeTab === 'menu')) return <AdminDashboard />;

            return (
                <div className="flex h-screen w-full bg-macBg text-[#1d1d1f] antialiased">
                    {!isMobile && <Sidebar/>}
                    <div className="flex-1 flex flex-col bg-white overflow-hidden shadow-[-4px_0_15px_rgba(0,0,0,0.05)] z-10 relative">
                        {vm.activeTab === 'planer' && <PlanerView/>}
                        {vm.activeTab === 'prozessionen' && <ProzessionenView/>}
                        {vm.activeTab === 'events' && <EventsView/>}
                        {vm.activeTab === 'vormerken' && <VormerkenView/>}
                        {vm.activeTab === 'statistik' && <StatistikView/>}
                        {vm.activeTab === 'notizen' && <NotizenView/>}
                        {vm.activeTab === 'werkzeuge' && <WerkzeugeView/>}
                        {vm.activeTab === 'messdiener' && <MessdienerView/>}
                        {vm.activeTab === 'einstellungen' && <EinstellungenView/>}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 8. MAIN APP ROUTER
        // ==========================================
        function App() {
            const vm = useViewModel();

            if (vm.isAppLoading) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-white flex-col space-y-6">
                        <i className="fa-solid fa-cloud text-blue-500 text-7xl animate-bounce"></i>
                        <h2 className="text-3xl font-bold text-gray-800">Lade Daten...</h2>
                    </div>
                );
            }

            if (vm.route === 'admin') {
                if (!vm.apiKey || !vm.firebaseProjectId) return <AdminSetupOverlay />;
                return <AdminApp />;
            }

            if (vm.route === 'pfarrbuero') return <PfarrbueroView />;
            if (vm.route === 'abwesenheiten') return <AbwesenheitenPortal />;
            
            return <LandingPage />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ViewModelProvider><App/></ViewModelProvider>);
    </script>
</body>
</html>
