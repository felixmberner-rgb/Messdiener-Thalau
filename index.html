<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messdiener Planer</title>
    
    <!-- Tailwind CSS für das Mac-Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macBg: '#ececec',
                        macSidebar: '#f5f5f5',
                        macActive: '#007aff',
                        macText: '#1d1d1f'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- jsPDF für PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { 
            overflow: hidden; 
            margin: 0; 
            background-color: #ececec; 
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
        input:focus, select:focus, textarea:focus, button:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // --- HILFSFUNKTIONEN (@AppStorage) ---
        function useAppStorage(key, initialValue) {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            useEffect(() => {
                window.localStorage.setItem(key, JSON.stringify(state));
            }, [key, state]);

            return [state, setState];
        }

        // --- VIEWMODEL PROVIDER ---
        const ViewModelContext = createContext();

        function ViewModelProvider({ children }) {
            const [activeTab, setActiveTab] = useState('planer');
            const [isAppLoading, setIsAppLoading] = useState(true);
            const [appState, setAppState] = useAppStorage('appStateRaw', 'upload'); 
            const [laedt, setLaedt] = useState(false);
            const [ladeStatusText, setLadeStatusText] = useState("");
            const [fehlerMeldung, setFehlerMeldung] = useState(null);
            
            const [apiKey, setApiKey] = useAppStorage('geminiApiKey', '');
            const [geminiModel, setGeminiModel] = useAppStorage('geminiModel', 'gemini-3.6-flash');
            const [firebaseProjectId, setFirebaseProjectId] = useAppStorage('firebaseProjectId', '');
            const [csvTabelleUrl, setCsvTabelleUrl] = useAppStorage('csvTabelleUrl', '');
            const [iCalUrl, setICalUrl] = useAppStorage('iCalUrl', '');
            
            const [anzahlSonntags, setAnzahlSonntags] = useAppStorage('anzahlSonntags', 4);
            const [anzahlWerktags, setAnzahlWerktags] = useAppStorage('anzahlWerktags', 2);
            const [openWhatsAppOnExport, setOpenWhatsAppOnExport] = useAppStorage('openWhatsAppOnExport', false);
            
            const [pdfGrauerText, setPdfGrauerText] = useAppStorage('pdfGrauerText', 'Wer eingeteilt ist und nicht dienen kann, sucht sich bitte selbstständig eine Vertretung!');
            const [pdfFooterUeberschrift, setPdfFooterUeberschrift] = useAppStorage('pdfFooterUeberschrift', 'Abwesenheiten eintragen');
            const [pdfFooterTextSuffix, setPdfFooterTextSuffix] = useAppStorage('pdfFooterTextV2', 'Wenn Abwesenheiten jetzt schon bekannt sind, trage sie ganz einfach online ein.');
            const [pdfLinkUrl, setPdfLinkUrl] = useAppStorage('pdfLinkUrl', 'https://forms.gle/nSzhoDgeAhUS4QG16');

            const [gruppen, setGruppen] = useAppStorage('gruppenDaten', [
                { id: crypto.randomUUID(), name: "A", mitglieder: [] },
                { id: crypto.randomUUID(), name: "B", mitglieder: [] },
                { id: crypto.randomUUID(), name: "C", mitglieder: [] }
            ]);
            const [neueMessdiener, setNeueMessdiener] = useAppStorage('neueMessdienerData', []);
            const [immerZusammen, setImmerZusammen] = useAppStorage('immerZusammenData', []);
            const [nieZusammen, setNieZusammen] = useAppStorage('nieZusammenData', []);
            const [statistik, setStatistik] = useAppStorage('statistikDaten', {});
            
            const [dienste, setDienste] = useAppStorage('diensteData', []);
            const [vormerkungen, setVormerkungen] = useAppStorage('vormerkungenData', []);
            const [regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten] = useAppStorage('regelmaessigeAbwesenheitenData', []);
            const [newsItems, setNewsItems] = useAppStorage('newsItemsData', []);
            const [notizen, setNotizen] = useAppStorage('notizenData', []);
            const [customGroupDateRanges, setCustomGroupDateRanges] = useAppStorage('customGroupDateRangesData', {});
            const [nextGroup1, setNextGroup1] = useAppStorage('nextGroup1', '');
            const [nextGroup2, setNextGroup2] = useAppStorage('nextGroup2', '');

            const [pdfFile, setPdfFile] = useState(null);

            useEffect(() => {
                setTimeout(() => setIsAppLoading(false), 800); 
            }, []);

            const toggleNeu = (name) => {
                setNeueMessdiener(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            };
            const removeMitglied = (groupId, name) => {
                setGruppen(prev => prev.map(g => g.id === groupId ? { ...g, mitglieder: g.mitglieder.filter(m => m !== name) } : g));
                setNeueMessdiener(prev => prev.filter(n => n !== name));
            };
            const addMitglied = (groupId, name) => {
                const clean = name.trim();
                if (!clean) return;
                setGruppen(prev => prev.map(g => (g.id === groupId && !g.mitglieder.includes(clean)) ? { ...g, mitglieder: [...g.mitglieder, clean] } : g));
                if (statistik[clean] === undefined) setStatistik(prev => ({ ...prev, [clean]: 0 }));
            };

            const normalizeTime = (time) => {
                let clean = time.replace(/h/gi, '').replace(/uhr/gi, '').trim();
                let parts = clean.split(/[:.]/);
                if (parts.length === 2) {
                    let h = parts[0].length === 1 ? `0${parts[0]}` : parts[0];
                    let m = parts[1].length === 1 ? `${parts[1]}0` : (parts[1] === "" ? "00" : parts[1]);
                    return `${h}.${m}`;
                } else if (parts.length === 1 && parts[0] !== "") {
                    let h = parts[0].length === 1 ? `0${parts[0]}` : parts[0];
                    return `${h}.00`;
                }
                return time;
            };

            const parseDateStr = (str) => {
                if (!str) return null;
                const parts = str.match(/\d+/g);
                if (!parts || parts.length < 2) return null;
                const d = parseInt(parts[0]);
                const m = parseInt(parts[1]) - 1;
                const y = parts.length >= 3 ? parseInt(parts[2]) : new Date().getFullYear();
                return new Date(y, m, d);
            };

            const getWeekIdentifier = (dateStr) => {
                const d = parseDateStr(dateStr);
                if (!d) return crypto.randomUUID();
                const dCopy = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
                const dayNum = dCopy.getUTCDay() || 7;
                dCopy.setUTCDate(dCopy.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(dCopy.getUTCFullYear(),0,1));
                const weekNo = Math.ceil((((dCopy - yearStart) / 86400000) + 1)/7);
                return `${dCopy.getUTCFullYear()}-${weekNo.toString().padStart(2, '0')}`;
            };

            const getChronologischeBloecke = () => {
                let bloecke = [];
                let currentWeek = null;
                let currentDienste = [];
                
                const sorted = [...dienste].sort((a, b) => {
                    const d1 = parseDateStr(a.datum) || new Date(0);
                    const d2 = parseDateStr(b.datum) || new Date(0);
                    if (d1.getTime() === d2.getTime()) return normalizeTime(a.uhrzeit).localeCompare(normalizeTime(b.uhrzeit));
                    return d1 - d2;
                });

                for (let dienst of sorted) {
                    const w = getWeekIdentifier(dienst.datum);
                    if (w !== currentWeek) {
                        if (currentWeek !== null) {
                            let counts = {};
                            currentDienste.forEach(d => { if (d.gruppe) counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; });
                            let domGroup = Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : "Ohne Gruppe";
                            bloecke.push({ id: currentWeek, gruppe: domGroup, dienste: currentDienste });
                        }
                        currentWeek = w;
                        currentDienste = [dienst];
                    } else {
                        currentDienste.push(dienst);
                    }
                }
                if (currentWeek !== null) {
                    let counts = {};
                    currentDienste.forEach(d => { if (d.gruppe) counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; });
                    let domGroup = Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : "Ohne Gruppe";
                    bloecke.push({ id: currentWeek, gruppe: domGroup, dienste: currentDienste });
                }
                return bloecke;
            };

            // KI Parser
            const leseGottesdienste = async () => {
                if (!apiKey) { setFehlerMeldung("Bitte hinterlege deinen Gemini API-Key in den Einstellungen."); return; }
                if (!pdfFile) { setFehlerMeldung("Bitte wähle eine PDF aus."); return; }

                setLaedt(true); setFehlerMeldung(null); setLadeStatusText("Lese Datei aus...");

                try {
                    const base64String = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(pdfFile);
                    });

                    setLadeStatusText("KI analysiert Pfarrbrief...");

                    const systemInstruction = `Du bist ein präziser Parser für Pfarrbrief-Daten. WICHTIGE REGELN:
1. ORT: Extrahiere AUSSCHLIESSLICH Gottesdienste, die im Ort "Thalau" stattfinden! Ignoriere alles aus "Schmalnau" oder anderen Orten.
2. ANLASS: Akzeptiere "Hl. Messe", "Taufe", "Hochzeit", "Trauung", "Beerdigung", "Osternacht", "Christmette" sowie alle Termine, die das Wort "Gottesdienst" enthalten. Ignoriere strikt Dinge wie "Rosenkranz", "Andacht", "Krankenkommunion".
3. GRUPPEN: Suche im Text nach der Gruppeneinteilung für Thalau (z.B. "Thalau Gruppe C") und weise diesen Buchstaben dem Feld 'gruppe' zu.
4. Gib das Ergebnis strikt im geforderten JSON-Format zurück. Fasse lange Anlässe kurz zusammen.`;

                    const body = {
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        contents: [{
                            parts: [
                                { text: "Analysiere das angehängte Dokument und extrahiere Gottesdienste gemäß den Regeln." },
                                { inlineData: { mimeType: "application/pdf", data: base64String } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        datum: { type: "STRING" },
                                        wochentag: { type: "STRING" },
                                        uhrzeit: { type: "STRING" },
                                        anlass: { type: "STRING" },
                                        gruppe: { type: "STRING" },
                                        minis: { type: "ARRAY", items: { type: "STRING" } }
                                    },
                                    required: ["datum", "wochentag", "uhrzeit", "anlass", "minis"]
                                }
                            }
                        }
                    };

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`, {
                        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
                    });

                    const json = await response.json();
                    if (json.error) throw new Error(json.error.message);

                    const textResponse = json.candidates[0].content.parts[0].text;
                    let cleanJsonString = textResponse.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();

                    let rawDienste = JSON.parse(cleanJsonString);
                    
                    let wochenGruppen = {};
                    rawDienste.forEach(d => {
                        if (d.gruppe) wochenGruppen[getWeekIdentifier(d.datum)] = d.gruppe.replace(/Gruppe/i, '').trim();
                    });

                    let alleWochen = [...new Set(rawDienste.map(d => getWeekIdentifier(d.datum)))].sort();
                    let aktuelleGruppe = nextGroup1 || (gruppen[0]?.name || "A");
                    if (alleWochen.length > 0 && wochenGruppen[alleWochen[0]]) aktuelleGruppe = wochenGruppen[alleWochen[0]];
                    
                    const gruppenNamen = gruppen.map(g => g.name);

                    alleWochen.forEach(woche => {
                        if (wochenGruppen[woche]) aktuelleGruppe = wochenGruppen[woche];
                        wochenGruppen[woche] = aktuelleGruppe;
                        let nextIdx = (gruppenNamen.indexOf(aktuelleGruppe) + 1) % gruppenNamen.length;
                        aktuelleGruppe = gruppenNamen[nextIdx];
                    });

                    const erlaubteAnlaesse = ["Hl. Messe", "Taufe", "Hochzeit", "Beerdigung", "Osternacht", "Christmette"];
                    let bereinigteDienste = [];

                    rawDienste.forEach(raw => {
                        let d = { ...raw, id: crypto.randomUUID(), minis: [], uhrzeit: normalizeTime(raw.uhrzeit || "") };
                        let currentAnlass = d.anlass || "Hl. Messe";
                        let isValid = false;

                        if (erlaubteAnlaesse.includes(currentAnlass)) isValid = true;
                        else {
                            let lower = currentAnlass.toLowerCase();
                            if (lower.includes("taufe")) { currentAnlass = "Taufe"; isValid = true; }
                            else if (lower.includes("hochzeit") || lower.includes("trauung")) { currentAnlass = "Hochzeit"; isValid = true; }
                            else if (lower.includes("beerdigung")) { currentAnlass = "Beerdigung"; isValid = true; }
                            else if (lower.includes("messe") || lower.includes("eucharistie") || lower.includes("hochamt")) { currentAnlass = "Hl. Messe"; isValid = true; }
                            else if (lower.includes("osternacht")) { currentAnlass = "Osternacht"; isValid = true; }
                            else if (lower.includes("christmette")) { currentAnlass = "Christmette"; isValid = true; }
                            else if (lower.includes("gottesdienst")) isValid = true;
                        }

                        if (isValid) {
                            d.anlass = currentAnlass;
                            let wId = getWeekIdentifier(d.datum);
                            if (wochenGruppen[wId]) d.gruppe = wochenGruppen[wId];
                            bereinigteDienste.push(d);
                        }
                    });

                    setDienste(bereinigteDienste);
                    setAppState('review');

                } catch (e) {
                    setFehlerMeldung("KI Fehler: " + e.message);
                } finally {
                    setLaedt(false);
                }
            };

            const teileEin = async () => {
                setLaedt(true); setLadeStatusText("Berechne faire Einteilung...");
                setTimeout(() => {
                    let neueDienste = [...dienste];
                    neueDienste.forEach(d => {
                        if(d.minis.length === 0 && !d.manuellerBedarf && !d.manuellerText) {
                            let woche = d.wochentag.toLowerCase();
                            let count = (woche.includes('sonntag') || woche.includes('feiertag')) ? anzahlSonntags : anzahlWerktags;
                            
                            let g = gruppen.find(gr => gr.name === d.gruppe);
                            if (g && g.mitglieder.length > 0) {
                                d.minis = [...g.mitglieder].sort(() => 0.5 - Math.random()).slice(0, count);
                            } else {
                                d.minis = [];
                            }
                        }
                    });
                    setDienste(neueDienste);
                    setAppState('assigned');
                    setLaedt(false);
                }, 1500);
            };

            const resetApp = () => {
                setAppState('upload');
                setDienste([]);
                setPdfFile(null);
            };

            const value = {
                activeTab, setActiveTab,
                isAppLoading, laedt, ladeStatusText, fehlerMeldung, setFehlerMeldung,
                appState, setAppState,
                apiKey, setApiKey, geminiModel, setGeminiModel, firebaseProjectId, setFirebaseProjectId, csvTabelleUrl, setCsvTabelleUrl, iCalUrl, setICalUrl,
                anzahlSonntags, setAnzahlSonntags, anzahlWerktags, setAnzahlWerktags, openWhatsAppOnExport, setOpenWhatsAppOnExport,
                pdfGrauerText, setPdfGrauerText, pdfFooterUeberschrift, setPdfFooterUeberschrift, pdfFooterTextSuffix, setPdfFooterTextSuffix, pdfLinkUrl, setPdfLinkUrl,
                gruppen, setGruppen, toggleNeu, neueMessdiener, removeMitglied, addMitglied, immerZusammen, setImmerZusammen, nieZusammen, setNieZusammen, statistik, setStatistik,
                dienste, setDienste, vormerkungen, setVormerkungen, regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten, newsItems, setNewsItems, notizen, setNotizen,
                customGroupDateRanges, setCustomGroupDateRanges, nextGroup1, setNextGroup1, nextGroup2, setNextGroup2,
                pdfFile, setPdfFile, leseGottesdienste, teileEin, resetApp, getChronologischeBloecke
            };

            return <ViewModelContext.Provider value={value}>{children}</ViewModelContext.Provider>;
        }

        const useViewModel = () => useContext(ViewModelContext);

        // MARK: - UI COMPONENTS (Sidebar)
        function Sidebar() {
            const { activeTab, setActiveTab } = useViewModel();
            const menuItems = [
                { section: "Arbeitsbereich", items: [
                    { id: 'planer', label: 'Planer', icon: 'fa-regular fa-file-lines' },
                    { id: 'prozessionen', label: 'Prozessionen', icon: 'fa-solid fa-person-walking' },
                    { id: 'events', label: 'Events & Aktionen', icon: 'fa-solid fa-champagne-glasses' },
                    { id: 'vormerken', label: 'Vormerken', icon: 'fa-regular fa-calendar-check' },
                    { id: 'statistik', label: 'Statistik', icon: 'fa-solid fa-chart-column' },
                    { id: 'notizen', label: 'Notizen', icon: 'fa-regular fa-note-sticky' },
                    { id: 'werkzeuge', label: 'Werkzeuge', icon: 'fa-solid fa-screwdriver-wrench' }
                ]},
                { section: "Konfiguration", items: [
                    { id: 'messdiener', label: 'Messdiener & Gruppen', icon: 'fa-solid fa-user-group' },
                    { id: 'einstellungen', label: 'Einstellungen', icon: 'fa-solid fa-gear' }
                ]}
            ];

            return (
                <div className="w-[260px] h-full bg-[#f5f5f5] border-r border-gray-300 flex flex-col select-none z-20">
                    <div className="p-4 pt-10 pb-6 text-xl font-bold text-gray-800 ml-2">
                        Messdiener Planer
                    </div>
                    <div className="flex-1 overflow-y-auto px-3">
                        {menuItems.map((section, sIdx) => (
                            <div key={sIdx} className="mb-6">
                                <h3 className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2 ml-2">
                                    {section.section}
                                </h3>
                                <ul className="space-y-1">
                                    {section.items.map(item => (
                                        <li key={item.id}>
                                            <button 
                                                onClick={() => setActiveTab(item.id)}
                                                className={`w-full flex items-center px-3 py-2 rounded-lg transition text-[14px] font-medium
                                                    ${activeTab === item.id 
                                                        ? 'bg-[#007aff] text-white shadow-sm' 
                                                        : 'text-gray-700 hover:bg-gray-200'}`}
                                            >
                                                <i className={`${item.icon} w-5 text-center ${activeTab === item.id ? 'text-white' : 'text-blue-500'}`}></i>
                                                <span className="ml-2">{item.label}</span>
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- VIEWS ---
        function EinstellungenView() {
            const vm = useViewModel();
            const SectionBox = ({ icon, title, children }) => (
                <div className="mb-8">
                    <div className="flex items-center space-x-3 mb-4">
                        <div className="w-8 flex justify-center"><i className={`${icon} text-2xl`}></i></div>
                        <h2 className="text-xl font-bold text-gray-800">{title}</h2>
                    </div>
                    <div className="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">{children}</div>
                </div>
            );
            return (
                <div className="h-full overflow-y-auto p-10 bg-gray-50/50">
                    <div className="max-w-3xl">
                        <div className="mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">Einstellungen</h1>
                            <p className="text-gray-500 text-lg mt-1">Konfiguriere Schnittstellen, Layouts und Regeln.</p>
                        </div>
                        <SectionBox icon="fa-solid fa-cloud text-blue-500" title="Cloud Synchronisation (Firebase)">
                            <p className="text-sm text-gray-500 mb-3">Trage hier deine Firestore Projekt-ID ein, um die Statistik live zu synchronisieren.</p>
                            <input type="text" placeholder="Firebase Projekt-ID (z.B. messdienerplan-b8c62)" className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500" value={vm.firebaseProjectId} onChange={e => vm.setFirebaseProjectId(e.target.value)} />
                        </SectionBox>
                        <SectionBox icon="fa-solid fa-brain text-purple-500" title="Künstliche Intelligenz & Datenbanken">
                            <div className="grid grid-cols-2 gap-6 mb-4">
                                <div>
                                    <label className="block text-sm text-gray-500 mb-1">Gemini API Key</label>
                                    <input type="password" placeholder="API Key" className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm" value={vm.apiKey} onChange={e => vm.setApiKey(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-500 mb-1">KI Modell</label>
                                    <select className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm bg-white" value={vm.geminiModel} onChange={e => vm.setGeminiModel(e.target.value)}>
                                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                                        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                                        <option value="gemini-3.6-flash">Gemini 3.6 Flash (Standard)</option>
                                        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                                    </select>
                                </div>
                            </div>
                        </SectionBox>
                        <SectionBox icon="fa-solid fa-users text-orange-500" title="Einteilungs-Mengen">
                            <div className="flex space-x-12">
                                <div className="flex items-center space-x-4">
                                    <span className="text-sm font-medium">Sonntage & Feiertage: {vm.anzahlSonntags} Minis</span>
                                    <div className="flex border border-gray-300 rounded-lg overflow-hidden">
                                        <button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlSonntags(Math.max(1, vm.anzahlSonntags - 1))}>-</button>
                                        <div className="w-px bg-gray-300"></div>

                                <i className="fa-regular fa-calendar-check text-6xl mb-4 opacity-50"></i>
                                <h3 className="text-xl font-bold text-gray-600">Keine Vormerkungen vorhanden.</h3>
                                <p className="mt-2 max-w-md">Sobald du hier Gottesdienste anlegst, werden die eingetragenen Personen beim Berechnen des Plans automatisch fest eingeteilt.</p>
                            </div>
                        )}

                        <hr className="my-10 border-gray-200" />

                        {/* Wöchentliche Abwesenheiten (Mo-So Checkboxen) */}
                        <div className="flex justify-between items-end mb-6">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-900">Wöchentliche Abwesenheiten</h2>
                                <p className="text-gray-500 mt-1">Personen, die an bestimmten Wochentagen nie können.</p>
                            </div>
                            <button onClick={() => vm.setRegelmaessigeAbwesenheiten([...vm.regelmaessigeAbwesenheiten, { id: crypto.randomUUID(), name: '', wochentage: [] }])}
                                className="bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                                <i className="fa-solid fa-plus mr-2"></i>Person hinzufügen
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-10">
                            {vm.regelmaessigeAbwesenheiten.map(regel => (
                                <div key={regel.id} className="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <input type="text" placeholder="Name der Person..." value={regel.name}
                                            onChange={e => vm.setRegelmaessigeAbwesenheiten(vm.regelmaessigeAbwesenheiten.map(r => r.id === regel.id ? {...r, name: e.target.value} : r))}
                                            className="font-bold text-lg border-b border-gray-300 focus:border-blue-500 outline-none w-2/3 bg-transparent pb-1" />
                                        <button onClick={() => vm.setRegelmaessigeAbwesenheiten(vm.regelmaessigeAbwesenheiten.filter(r => r.id !== regel.id))} className="text-gray-400 hover:text-red-500 transition">
                                            <i className="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                    <div className="flex justify-between space-x-1">
                                        {wochentage.map(tag => {
                                            const isActive = regel.wochentage.includes(tag.id);
                                            return (
                                                <button key={tag.id}
                                                    onClick={() => {
                                                        const newTage = isActive ? regel.wochentage.filter(t => t !== tag.id) : [...regel.wochentage, tag.id];
                                                        vm.setRegelmaessigeAbwesenheiten(vm.regelmaessigeAbwesenheiten.map(r => r.id === regel.id ? {...r, wochentage: newTage} : r));
                                                    }}
                                                    className={`w-10 h-10 rounded-lg font-bold text-sm transition-all duration-200 shadow-sm ${isActive ? 'bg-orange-500 text-white scale-105' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
                                                    {tag.n}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const { activeTab, isAppLoading } = useViewModel();

            if (isAppLoading) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-white flex-col space-y-6">
                        <i className="fa-solid fa-cloud text-blue-500 text-7xl animate-bounce"></i>
                        <div className="text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Lade Arbeitsbereich...</h2>
                            <p className="text-gray-500 text-lg">Initialisiere App-Daten und UI</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-macBg text-[#1d1d1f] antialiased">
                    <Sidebar/>
                    
                    <div className="flex-1 flex flex-col bg-white overflow-hidden shadow-[-4px_0_15px_rgba(0,0,0,0.05)] z-10 relative">
                        {/* AKTIVES ROUTING */}
                        {(!activeTab || activeTab === 'planer') && <PlanerView/>}
                        {activeTab === 'einstellungen' && <EinstellungenView/>}
                        {activeTab === 'messdiener' && <MessdienerView/>}
                        {activeTab === 'statistik' && <StatistikView/>}
                        {activeTab === 'notizen' && <NotizenView/>}
                        {activeTab === 'werkzeuge' && <WerkzeugeView/>}
                        {activeTab === 'vormerken' && <VormerkenView/>}
                        
                        {/* Platzhalter für restliche, noch kommende Tabs (Prozessionen, Events) */}
                        {!['planer', 'einstellungen', 'messdiener', 'statistik', 'notizen', 'werkzeuge', 'vormerken'].includes(activeTab) && (
                            <div className="flex-1 flex flex-col items-center justify-center p-10 text-center bg-gray-50/50">
                                <i className="fa-solid fa-person-digging text-7xl text-gray-300 mb-6"></i>
                                <h1 className="text-4xl font-bold mb-3 capitalize text-gray-800">{activeTab.replace('-', ' ')}</h1>
                                <p className="text-gray-500 text-lg max-w-md">
                                    Dieser Bereich folgt im allerletzten Schritt (inkl. PDF Export Engine)!
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ViewModelProvider><App/></ViewModelProvider>);
    </script>
</body>
</html>
