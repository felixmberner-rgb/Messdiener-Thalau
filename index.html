            );
        }

        function EinstellungenView() {
            const vm = useViewModel();
            const SectionBox = ({ icon, title, children }) => (
                <div className="mb-8"><div className="flex items-center space-x-3 mb-4"><div className="w-8 flex justify-center"><i className={`${icon} text-2xl`}></i></div><h2 className="text-xl font-bold text-gray-800">{title}</h2></div><div className="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">{children}</div></div>
            );
            return (
                <div className="h-full flex flex-col">
                    <MobileTopBar title="Einstellungen" />
                    <div className="flex-1 overflow-y-auto p-6 md:p-10 bg-gray-50/50">
                        <div className="max-w-3xl mx-auto md:mx-0 pb-12">
                            <div className="hidden md:block mb-8"><h1 className="text-3xl font-bold text-gray-900">Einstellungen</h1></div>
                            
                            <SectionBox icon="fa-solid fa-cloud text-blue-500" title="Cloud Synchronisation">
                                <input type="text" placeholder="Firebase Projekt-ID..." className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 mb-4 outline-none" value={vm.firebaseProjectId} onChange={e => vm.setFirebaseProjectId(e.target.value)} />
                            </SectionBox>

                            <SectionBox icon="fa-solid fa-lock text-purple-500" title="Passwörter & Sicherheit">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Passwort: Pfarrbüro</label>
                                        <input type="password" placeholder={vm.cloudPfarrbueroPassword ? "Hinterlegt (Tippen zum Ändern)" : "Kein Passwort vergeben"} className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none" onChange={e => { vm.setCloudPfarrbueroPassword(e.target.value.trim()); vm.setPfarrbueroPassword(e.target.value.trim()); }} />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Gemini API Key</label>
                                        <input type="password" placeholder={vm.apiKey ? "Hinterlegt (Tippen zum Ändern)" : "API Key..."} className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none" onChange={e => { if (e.target.value.trim() !== '') { vm.setApiKey(e.target.value.trim()); } }} />
                                    </div>
                                </div>
                            </SectionBox>

                            <SectionBox icon="fa-solid fa-users text-orange-500" title="Einteilungs-Mengen">
                                <div className="flex flex-col md:flex-row md:space-x-12 space-y-4 md:space-y-0">
                                    <div className="flex items-center justify-between md:justify-start space-x-4 w-full md:w-auto"><span className="text-sm font-medium">Sonntage: {vm.anzahlSonntags}</span><div className="flex border border-gray-300 rounded-lg overflow-hidden"><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlSonntags(Math.max(1, vm.anzahlSonntags - 1))}>-</button><div className="w-px bg-gray-300"></div><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlSonntags(Math.min(10, vm.anzahlSonntags + 1))}>+</button></div></div>
                                    <div className="flex items-center justify-between md:justify-start space-x-4 w-full md:w-auto"><span className="text-sm font-medium">Werktage: {vm.anzahlWerktags}</span><div className="flex border border-gray-300 rounded-lg overflow-hidden"><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlWerktags(Math.max(1, vm.anzahlWerktags - 1))}>-</button><div className="w-px bg-gray-300"></div><button className="px-3 py-1 bg-gray-100 hover:bg-gray-200" onClick={() => vm.setAnzahlWerktags(Math.min(10, vm.anzahlWerktags + 1))}>+</button></div></div>
                                </div>
                            </SectionBox>

                            <SectionBox icon="fa-solid fa-scale-balanced text-emerald-500" title="Rechtliches & Links">
                                <p className="text-xs text-gray-400 mb-4">Hinterlegte Links werden dezent am Fuß der Seiten sowie im Menü eingeblendet.</p>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Impressum URL</label>
                                        <input type="url" placeholder="https://beispiel-pfarrei.de/impressum" className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none" value={vm.impressumUrl} onChange={e => vm.setImpressumUrl(e.target.value.trim())} />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-500 mb-1">Datenschutz URL</label>
                                        <input type="url" placeholder="https://beispiel-pfarrei.de/datenschutz" className="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none" value={vm.datenschutzUrl} onChange={e => vm.setDatenschutzUrl(e.target.value.trim())} />
                                    </div>
                                </div>
                            </SectionBox>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 6. APP ROUTING & VIEWS
        // ==========================================
        function AdminDashboard() {
            const vm = useViewModel();
            const tiles = [
                { id: 'planer', label: 'Planer', icon: 'fa-regular fa-file-lines', color: 'bg-blue-500' }, 
                { id: 'prozessionen', label: 'Prozessionen', icon: 'fa-solid fa-person-walking', color: 'bg-purple-500' }, 
                { id: 'events', label: 'Events', icon: 'fa-solid fa-champagne-glasses', color: 'bg-pink-500' }, 
                { id: 'vormerken', label: 'Vormerken', icon: 'fa-regular fa-calendar-check', color: 'bg-green-500' }, 
                { id: 'abwesenheiten_admin', label: 'Urlaube', icon: 'fa-solid fa-user-clock', color: 'bg-red-500' }, 
                { id: 'statistik', label: 'Statistik', icon: 'fa-solid fa-chart-column', color: 'bg-orange-500' }, 
                { id: 'notizen', label: 'Notizen', icon: 'fa-regular fa-note-sticky', color: 'bg-yellow-500' }, 
                { id: 'messdiener', label: 'Gruppen', icon: 'fa-solid fa-user-group', color: 'bg-indigo-500' }, 
                { id: 'einstellungen', label: 'Optionen', icon: 'fa-solid fa-gear', color: 'bg-gray-500' }, 
                { id: 'werkzeuge', label: 'Tools', icon: 'fa-solid fa-screwdriver-wrench', color: 'bg-teal-500' }
            ];
            
            return (
                <div className="min-h-screen w-full bg-[#f2f2f7] p-6 pb-12 flex flex-col antialiased overflow-y-auto justify-between">
                    <div>
                        <div className="flex justify-between items-end mb-8 pt-8 max-w-lg mx-auto w-full">
                            <div>
                                <h1 className="text-3xl font-black text-gray-900 tracking-tight">Übersicht</h1>
                                <p className="text-gray-500 text-sm">Messdiener Planer</p>
                            </div>
                            <button onClick={() => { vm.setAdminPassword(''); vm.setRoute('landing'); }} className="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-bold text-red-500 border border-gray-200 hover:bg-red-50 transition">
                                <i className="fa-solid fa-power-off mr-2"></i>Abmelden
                            </button>
                        </div>
                        <div className="grid grid-cols-2 gap-4 max-w-lg mx-auto w-full">
                            {tiles.map(t => (
                                <div key={t.id} onClick={() => vm.setActiveTab(t.id)} className="ios-card p-6 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
                                    <div className={`w-14 h-14 ${t.color} text-white rounded-full flex items-center justify-center text-2xl mb-3 shadow-md`}>
                                        <i className={t.icon}></i>
                                    </div>
                                    <span className="font-bold text-gray-800 text-[15px] text-center">{t.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                    <LegalFooter className="mt-8" />
                </div>
            );
        }

        function AdminApp() {
            const vm = useViewModel();
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            useEffect(() => { const handleResize = () => setIsMobile(window.innerWidth < 768); window.addEventListener('resize', handleResize); return () => window.removeEventListener('resize', handleResize); }, []);
            
            if (isMobile) {
                if (vm.activeTab === 'menu') {
                    return <AdminDashboard />;
                }
                return (
                    <div className="flex h-screen w-full bg-white text-[#1d1d1f] antialiased overflow-hidden">
                        <div className="flex-1 flex flex-col bg-white overflow-hidden relative">
                            {vm.activeTab === 'planer' && <PlanerView/>}
                            {vm.activeTab === 'prozessionen' && <ProzessionenView/>}
                            {vm.activeTab === 'events' && <EventsView/>}
                            {vm.activeTab === 'vormerken' && <VormerkenView/>}
                            {vm.activeTab === 'abwesenheiten_admin' && <AbwesenheitenAdminView/>}
                            {vm.activeTab === 'statistik' && <StatistikView/>}
                            {vm.activeTab === 'notizen' && <NotizenView/>}
                            {vm.activeTab === 'werkzeuge' && <WerkzeugeView/>}
                            {vm.activeTab === 'messdiener' && <MessdienerView/>}
                            {vm.activeTab === 'einstellungen' && <EinstellungenView/>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-macBg text-[#1d1d1f] antialiased">
                    <Sidebar/>
                    <div className="flex-1 flex flex-col bg-white overflow-hidden shadow-[-4px_0_15px_rgba(0,0,0,0.05)] z-10 relative">
                        {(vm.activeTab === 'planer' || vm.activeTab === 'menu') && <PlanerView/>}
                        {vm.activeTab === 'prozessionen' && <ProzessionenView/>}
                        {vm.activeTab === 'events' && <EventsView/>}
                        {vm.activeTab === 'vormerken' && <VormerkenView/>}
                        {vm.activeTab === 'abwesenheiten_admin' && <AbwesenheitenAdminView/>}
                        {vm.activeTab === 'statistik' && <StatistikView/>}
                        {vm.activeTab === 'notizen' && <NotizenView/>}
                        {vm.activeTab === 'werkzeuge' && <WerkzeugeView/>}
                        {vm.activeTab === 'messdiener' && <MessdienerView/>}
                        {vm.activeTab === 'einstellungen' && <EinstellungenView/>}
                    </div>
                </div>
            );
        }

        function App() {
            const vm = useViewModel();
            if (vm.isAppLoading) return <div className="flex h-screen w-full items-center justify-center bg-white flex-col space-y-6"><i className="fa-solid fa-cloud text-blue-500 text-7xl animate-bounce"></i><h2 className="text-3xl font-bold text-gray-800 mb-2">Lade Daten...</h2></div>;
            if (vm.route === 'admin') { if (!vm.apiKey || !vm.firebaseProjectId) return <AdminSetupOverlay />; return <AdminApp />; }
            if (vm.route === 'pfarrbuero') return <PfarrbueroView />;
            if (vm.route === 'abwesenheiten') return <AbwesenheitenPortal />;
            return <LandingPage />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ViewModelProvider><App/></ViewModelProvider>);
    </script>
</body>
</html>
