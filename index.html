<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Messdiener">
    <meta name="application-name" content="Messdiener">
    <meta name="theme-color" content="#F2F2F7">
    
    <link rel="apple-touch-icon" href="icon.png?v=3">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png?v=3">
    <link rel="shortcut icon" href="icon.png?v=3">

    <title>Messdiener Planer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { macBg: '#ececec', macSidebar: '#f5f5f5', macActive: '#007aff', macText: '#1d1d1f' }, fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { margin: 0; background-color: #ececec; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
        input:focus, select:focus, textarea:focus, button:focus { outline: none; }
        .ios-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef } = React;

        // ==========================================
        // 1. HILFSFUNKTIONEN & PROVIDER
        // ==========================================
        function useAppStorage(key, initialValue) {
            const [state, setState] = useState(() => { try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; } catch (error) { return initialValue; } });
            useEffect(() => { window.localStorage.setItem(key, JSON.stringify(state)); }, [key, state]); return [state, setState];
        }

        function AutocompleteField({ value, onChange, suggestions, placeholder, className }) {
            const [isOpen, setIsOpen] = useState(false); const wrapperRef = useRef(null);
            const filtered = (suggestions || []).filter(s => s.toLowerCase().includes((value||'').toLowerCase()) && s.toLowerCase() !== (value||'').toLowerCase());
            useEffect(() => { function handleClickOutside(e) { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setIsOpen(false); } document.addEventListener("mousedown", handleClickOutside); return () => document.removeEventListener("mousedown", handleClickOutside); }, []);
            return (
                <div ref={wrapperRef} className="relative w-full">
                    <input type="text" value={value} onChange={e => { onChange(e.target.value); setIsOpen(true); }} onFocus={() => setIsOpen(true)} placeholder={placeholder} className={className || "w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"} />
                    {isOpen && filtered.length > 0 && (<ul className="absolute z-50 w-full bg-white border border-gray-200 shadow-lg rounded-lg mt-1 max-h-40 overflow-y-auto">{filtered.map(s => <li key={s} onClick={() => { onChange(s); setIsOpen(false); }} className="px-4 py-2 hover:bg-blue-50 cursor-pointer text-gray-800 border-b border-gray-50 last:border-0">{s}</li>)}</ul>)}
                </div>
            );
        }

        function DraggableMini({ name }) {
            return (
                <div 
                    draggable
                    onDragStart={(e) => e.dataTransfer.setData("text/plain", name)}
                    className="bg-white border border-gray-200 shadow-sm rounded-lg px-3 py-2 text-sm font-semibold text-gray-800 cursor-grab active:cursor-grabbing hover:bg-blue-50 transition shrink-0 select-none"
                >
                    <i className="fa-solid fa-grip-vertical text-gray-300 mr-2"></i>{name}
                </div>
            );
        }

        function DropSlot({ title, value, onDrop, onRemove }) {
            const [isOver, setIsOver] = useState(false);
            return (
                <div 
                    onDragOver={(e) => { e.preventDefault(); setIsOver(true); }}
                    onDragLeave={() => setIsOver(false)}
                    onDrop={(e) => { e.preventDefault(); setIsOver(false); const data = e.dataTransfer.getData("text/plain"); if(data) onDrop(data); }}
                    className={`p-3 rounded-xl border-2 border-dashed transition flex flex-col items-center justify-center min-h-[70px] ${isOver ? 'border-blue-500 bg-blue-50' : value ? 'border-gray-300 bg-white' : 'border-gray-200 bg-white/50'}`}
                >
                    <span className="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1">{title}</span>
                    {value ? (
                        <div className="flex items-center space-x-2 bg-blue-50 text-blue-800 px-3 py-1 rounded-lg font-bold text-sm">
                            <span>{value}</span>
                            <button type="button" onClick={onRemove} className="text-red-400 hover:text-red-600"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                    ) : (
                        <span className="text-xs text-gray-400 italic">Hierhin ziehen</span>
                    )}
                </div>
            );
        }

        function LegalFooter({ className = "" }) {
            const { impressumUrl, datenschutzUrl } = useViewModel();
            if (!impressumUrl && !datenschutzUrl) return null;
            return (
                <div className={`flex items-center justify-center space-x-4 py-4 text-xs text-gray-400 font-medium select-none ${className}`}>
                    {impressumUrl && (
                        <a href={impressumUrl} target="_blank" rel="noopener noreferrer" className="hover:text-gray-600 transition underline underline-offset-2">
                            Impressum
                        </a>
                    )}
                    {impressumUrl && datenschutzUrl && <span>•</span>}
                    {datenschutzUrl && (
                        <a href={datenschutzUrl} target="_blank" rel="noopener noreferrer" className="hover:text-gray-600 transition underline underline-offset-2">
                            Datenschutz
                        </a>
                    )}
                </div>
            );
        }

        const ViewModelContext = createContext();

        function ViewModelProvider({ children }) {
            const [route, setRoute] = useState('landing'); 
            const [activeTab, setActiveTab] = useState(window.innerWidth < 768 ? 'menu' : 'planer'); 
            const [isAppLoading, setIsAppLoading] = useState(true);
            const [appState, setAppState] = useAppStorage('appStateRaw', 'upload'); 
            const [laedt, setLaedt] = useState(false);
            const [ladeStatusText, setLadeStatusText] = useState("");
            const [fehlerMeldung, setFehlerMeldung] = useState(null);
            
            const [apiKey, setApiKey] = useAppStorage('geminiApiKey', '');
            const [adminPassword, setAdminPassword] = useAppStorage('adminPasswordLocal', ''); 
            const [cloudAdminPassword, setCloudAdminPassword] = useState(''); 
            const [pfarrbueroPassword, setPfarrbueroPassword] = useAppStorage('pfarrbueroPasswordLocal', '');
            const [cloudPfarrbueroPassword, setCloudPfarrbueroPassword] = useState('');
            const [geminiModel, setGeminiModel] = useAppStorage('geminiModel', 'gemini-3.6-flash');
            const [firebaseProjectId, setFirebaseProjectId] = useAppStorage('firebaseProjectId', '');
            const [planGeneriertBis, setPlanGeneriertBis] = useAppStorage('planGeneriertBis', ''); 
            const [impressumUrl, setImpressumUrl] = useAppStorage('impressumUrl', '');
            const [datenschutzUrl, setDatenschutzUrl] = useAppStorage('datenschutzUrl', '');
            
            const [anzahlSonntags, setAnzahlSonntags] = useAppStorage('anzahlSonntags', 4);
            const [anzahlWerktags, setAnzahlWerktags] = useAppStorage('anzahlWerktags', 2);
            
            const [gruppen, setGruppen] = useAppStorage('gruppenDaten', [{ id: crypto.randomUUID(), name: "A", mitglieder: [] }]);
            const [neueMessdiener, setNeueMessdiener] = useAppStorage('neueMessdienerData', []);
            const [statistik, setStatistik] = useAppStorage('statistikDaten', {});
            const [dienste, setDienste] = useAppStorage('diensteData', []);
            const [vormerkungen, setVormerkungen] = useAppStorage('vormerkungenData', []);
            const [regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten] = useAppStorage('regelmaessigeAbwesenheitenData', []);
            const [abwesenheiten, setAbwesenheiten] = useAppStorage('abwesenheitenData', []); 
            const [notizen, setNotizen] = useAppStorage('notizenData', []);
            const [events, setEvents] = useAppStorage('eventsData', []);
            const [prozessionen, setProzessionen] = useAppStorage('prozessionenData', []);
            const [pdfFile, setPdfFile] = useState(null);

            useEffect(() => { const urlParams = new URLSearchParams(window.location.search); const projectId = urlParams.get('id'); if (projectId && projectId.length > 5) setFirebaseProjectId(projectId.trim()); }, []);

            const getFbUrl = (docName) => `https://firestore.googleapis.com/v1/projects/${firebaseProjectId.trim()}/databases/(default)/documents/messdiener/${docName}`;

            const fetchAllData = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const fetchDoc = async (docName, setter, parser) => { try { const res = await fetch(getFbUrl(docName)); const data = await res.json(); if(data.fields) setter(parser(data.fields)); } catch(e){} };
                    await fetchDoc('config', f => { 
                        let cAdmin = '';
                        let cPb = '';
                        if(f.adminPassword) { cAdmin = f.adminPassword.stringValue; setCloudAdminPassword(cAdmin); } 
                        if(f.pfarrbueroPassword) { cPb = f.pfarrbueroPassword.stringValue; setCloudPfarrbueroPassword(cPb); } 
                        if(f.planGeneriertBis) setPlanGeneriertBis(f.planGeneriertBis.stringValue);
                        if(f.impressumUrl) setImpressumUrl(f.impressumUrl.stringValue);
                        if(f.datenschutzUrl) setDatenschutzUrl(f.datenschutzUrl.stringValue);

                        try {
                            const localPwd = window.localStorage.getItem('adminPasswordLocal') ? JSON.parse(window.localStorage.getItem('adminPasswordLocal')) : '';
                            if (localPwd && cAdmin && localPwd === cAdmin) {
                                setRoute('admin');
                                if (window.innerWidth < 768) {
                                    setActiveTab('menu');
                                }
                            }
                        } catch(err) {}
                    }, f=>f);
                    await fetchDoc('statistik', setStatistik, f => { let s={}; for(const [k,v] of Object.entries(f)) s[k]=parseInt(v.integerValue); return s; });
                    await fetchDoc('gruppen', f => { if(f.gruppenJson) setGruppen(JSON.parse(f.gruppenJson.stringValue)); if(f.neueMessdienerJson) setNeueMessdiener(JSON.parse(f.neueMessdienerJson.stringValue)); }, f=>f);
                    await fetchDoc('vormerkungen', f => { if(f.vormerkungenJson) setVormerkungen(JSON.parse(f.vormerkungenJson.stringValue)); }, f=>f);
                    await fetchDoc('wochenAbwesenheiten', f => { if(f.abwesenheitenJson) setRegelmaessigeAbwesenheiten(JSON.parse(f.abwesenheitenJson.stringValue)); }, f=>f);
                    await fetchDoc('urlaubsAbwesenheiten', f => { if(f.dataJson) setAbwesenheiten(JSON.parse(f.dataJson.stringValue)); }, f=>f);
                    await fetchDoc('events', f => { if(f.eventsJson) setEvents(JSON.parse(f.eventsJson.stringValue)); }, f=>f);
                    await fetchDoc('prozessionen', f => { if(f.prozessionenJson) setProzessionen(JSON.parse(f.prozessionenJson.stringValue)); }, f=>f);
                    await fetchDoc('notizen', f => { if(f.notizenJson) setNotizen(JSON.parse(f.notizenJson.stringValue)); }, f=>f);
                    
                    await fetchDoc('aktuellerPlan', f => { 
                        if(f.planDataJson) { 
                            const parsed = JSON.parse(f.planDataJson.stringValue);
                            if(parsed && parsed.length > 0) {
                                const nurGottesdienste = parsed.filter(item => item.art === 'gottesdienst').map(d => ({
                                    id: crypto.randomUUID(), 
                                    datum: d.datum || "", 
                                    wochentag: d.wochentag || "", 
                                    uhrzeit: d.uhrzeit || "",
                                    anlass: d.typ || d.anlass || "Hl. Messe", 
                                    gruppe: d.gruppe && d.gruppe !== "Z" && d.gruppe !== "" ? d.gruppe : "Ohne Gruppe", 
                                    minis: d.messdiener && d.messdiener !== "-" ? d.messdiener.split(',').map(n=>n.trim()) : (d.minis || []),
                                    manuellerBedarf: d.manuellerBedarf || null, 
                                    manuellerText: d.manuellerText || null, 
                                    isFromPfarrbuero: false
                                }));
                                if (nurGottesdienste.length > 0 && appState === 'upload') {
                                    setDienste(nurGottesdienste); setAppState('assigned');
                                }
                            }
                        } 
                    }, f=>f);
                } catch(e) {}
            };

            useEffect(() => { if(firebaseProjectId) fetchAllData().then(() => setIsAppLoading(false)); else setTimeout(() => setIsAppLoading(false), 500); }, [firebaseProjectId]);

            const syncDoc = async (docName, fields) => { if (!firebaseProjectId.trim()) return; await fetch(getFbUrl(docName), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) }); };
            const syncStatistikToFirebase = async () => { let fields = {}; for (const [key, val] of Object.entries(statistik)) fields[key] = { integerValue: String(val) }; await syncDoc('statistik', fields); };

            useEffect(() => { const t = setTimeout(() => syncDoc('gruppen', { gruppenJson: { stringValue: JSON.stringify(gruppen) }, neueMessdienerJson: { stringValue: JSON.stringify(neueMessdiener) } }), 1000); return () => clearTimeout(t); }, [gruppen, neueMessdiener]);
            useEffect(() => { const t = setTimeout(() => syncDoc('vormerkungen', { vormerkungenJson: { stringValue: JSON.stringify(vormerkungen) } }), 1000); return () => clearTimeout(t); }, [vormerkungen]);
            useEffect(() => { const t = setTimeout(() => syncDoc('wochenAbwesenheiten', { abwesenheitenJson: { stringValue: JSON.stringify(regelmaessigeAbwesenheiten) } }), 1000); return () => clearTimeout(t); }, [regelmaessigeAbwesenheiten]);
            useEffect(() => { const t = setTimeout(() => syncDoc('urlaubsAbwesenheiten', { dataJson: { stringValue: JSON.stringify(abwesenheiten) } }), 1000); return () => clearTimeout(t); }, [abwesenheiten]);
            useEffect(() => { const t = setTimeout(() => syncDoc('events', { eventsJson: { stringValue: JSON.stringify(events) } }), 1000); return () => clearTimeout(t); }, [events]);
            useEffect(() => { const t = setTimeout(() => syncDoc('prozessionen', { prozessionenJson: { stringValue: JSON.stringify(prozessionen) } }), 1000); return () => clearTimeout(t); }, [prozessionen]);
            useEffect(() => { const t = setTimeout(() => syncDoc('notizen', { notizenJson: { stringValue: JSON.stringify(notizen) } }), 1000); return () => clearTimeout(t); }, [notizen]);
            useEffect(() => { const t = setTimeout(() => syncDoc('config', { planGeneriertBis: { stringValue: planGeneriertBis }, adminPassword: { stringValue: cloudAdminPassword }, pfarrbueroPassword: { stringValue: cloudPfarrbueroPassword }, impressumUrl: { stringValue: impressumUrl }, datenschutzUrl: { stringValue: datenschutzUrl } }), 1000); return () => clearTimeout(t); }, [planGeneriertBis, cloudAdminPassword, cloudPfarrbueroPassword, impressumUrl, datenschutzUrl]);

            const alleMinis = gruppen.flatMap(g => g.mitglieder).sort();

            const parseDateStr = (str) => { if (!str) return null; const parts = str.match(/\d+/g); if (!parts || parts.length < 2) return null; return new Date(parts.length >= 3 ? parseInt(parts[2]) : new Date().getFullYear(), parseInt(parts[1]) - 1, parseInt(parts[0])); };
            const normalizeTime = (time) => { if(!time) return ""; let clean = time.replace(/h/gi, '').replace(/uhr/gi, '').trim(); let parts = clean.split(/[:.]/); if (parts.length === 2) return `${parts[0].length === 1 ? `0${parts[0]}` : parts[0]}.${parts[1].length === 1 ? `${parts[1]}0` : (parts[1] === "" ? "00" : parts[1])}`; else if (parts.length === 1 && parts[0] !== "") return `${parts[0].length === 1 ? `0${parts[0]}` : parts[0]}.00`; return time; };

            const value = {
                route, setRoute, activeTab, setActiveTab, isAppLoading, laedt, setLaedt, ladeStatusText, setLadeStatusText, fehlerMeldung, setFehlerMeldung, appState, setAppState,
                apiKey, setApiKey, adminPassword, setAdminPassword, cloudAdminPassword, setCloudAdminPassword, pfarrbueroPassword, setPfarrbueroPassword, cloudPfarrbueroPassword, setCloudPfarrbueroPassword,
                geminiModel, setGeminiModel, firebaseProjectId, setFirebaseProjectId, planGeneriertBis, setPlanGeneriertBis, impressumUrl, setImpressumUrl, datenschutzUrl, setDatenschutzUrl,
                anzahlSonntags, setAnzahlSonntags, anzahlWerktags, setAnzahlWerktags,
                gruppen, setGruppen, neueMessdiener, setNeueMessdiener, statistik, setStatistik, dienste, setDienste,
                vormerkungen, setVormerkungen, regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten,
                abwesenheiten, setAbwesenheiten, notizen, setNotizen, events, setEvents, prozessionen, setProzessionen,
                pdfFile, setPdfFile, alleMinis, syncDoc, syncStatistikToFirebase,
                parseDateStr, normalizeTime
            };
            return <ViewModelContext.Provider value={value}>{children}</ViewModelContext.Provider>;
        }
        const useViewModel = () => useContext(ViewModelContext);

        // ==========================================
        // 2. LANDING PAGE & SETUP
        // ==========================================
        function AdminSetupOverlay() {
            const vm = useViewModel();
            const [proj, setProj] = useState("");
            const [key, setKey] = useState("");
            return (
                <div className="fixed inset-0 z-[100] bg-[#ececec] flex items-center justify-center p-4">
                    <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center relative">
                        <button onClick={() => vm.setRoute('landing')} className="absolute top-6 left-6 text-gray-400 hover:text-gray-800"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                        <i className="fa-solid fa-database text-5xl text-blue-500 mb-6 mt-4"></i>
                        <h2 className="text-2xl font-bold text-gray-900 mb-2">Ersteinrichtung</h2>
                        <p className="text-gray-500 mb-6">Bitte gib die Zugangsdaten für die Datenbank ein.</p>
                        <input type="text" value={proj} onChange={e=>setProj(e.target.value)} placeholder="Firebase Projekt ID..." className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-4 outline-none focus:border-blue-500 text-center" />
                        <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="Gemini API Key..." className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-6 outline-none focus:border-blue-500 text-center" />
                        <button disabled={!proj.trim() || !key.trim()} onClick={() => { vm.setFirebaseProjectId(proj.trim()); vm.setApiKey(key.trim()); }} className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold text-lg py-3 rounded-xl transition">Speichern & Starten</button>
                    </div>
                </div>
            );
        }

        function LandingPage() {
            const vm = useViewModel();
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [showPbLogin, setShowPbLogin] = useState(false);
            const [pwdInput, setPwdInput] = useState("");
            const [pbPwdInput, setPbPwdInput] = useState("");

            const handleAdminLogin = () => {
                if (!vm.cloudAdminPassword) {
                    if(pwdInput.length > 3) { 
                        vm.setCloudAdminPassword(pwdInput); 
                        vm.setAdminPassword(pwdInput); 
                        vm.setRoute('admin'); 
                        if (window.innerWidth < 768) vm.setActiveTab('menu');
                    } 
                    else alert("Passwort muss mindestens 4 Zeichen lang sein.");
                } else {
                    if (pwdInput === vm.cloudAdminPassword) { 
                        vm.setAdminPassword(pwdInput); 
                        vm.setRoute('admin'); 
                        if (window.innerWidth < 768) vm.setActiveTab('menu');
                    } 
                    else alert("Falsches Passwort!");
                }
            };

            const handlePbLogin = () => {
                if (pbPwdInput === vm.cloudPfarrbueroPassword) { vm.setPfarrbueroPassword(pbPwdInput); vm.setRoute('pfarrbuero'); } 
                else alert("Falsches Passwort für das Pfarrbüro!");
            };

            if (showAdminLogin) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#ececec] p-4">
                        <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center relative">
                            <button onClick={() => setShowAdminLogin(false)} className="absolute top-6 left-6 text-gray-400 hover:text-gray-800"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                            <i className="fa-solid fa-lock text-5xl text-gray-800 mb-6 mt-4"></i>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Admin-Bereich</h2>
                            <p className="text-gray-500 mb-8">{!vm.cloudAdminPassword ? "Erstelle jetzt dein Admin-Passwort:" : "Bitte gib dein Admin-Passwort ein:"}</p>
                            <input type="password" placeholder="Passwort..." value={pwdInput} onChange={e => setPwdInput(e.target.value)} onKeyDown={e => e.key==='Enter' && handleAdminLogin()} className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-6 outline-none focus:border-gray-800 text-center" />
                            <button onClick={handleAdminLogin} className="w-full bg-gray-900 hover:bg-black text-white font-bold text-lg py-3 rounded-xl transition">Einloggen</button>
                        </div>
                    </div>
                );
            }

            if (showPbLogin) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#ececec] p-4">
                        <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center relative">
                            <button onClick={() => setShowPbLogin(false)} className="absolute top-6 left-6 text-gray-400 hover:text-blue-800"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                            <i className="fa-solid fa-calendar-check text-5xl text-blue-600 mb-6 mt-4"></i>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Pfarrbüro Zugang</h2>
                            <p className="text-gray-500 mb-8">Dieser Bereich ist passwortgeschützt.</p>
                            <input type="password" placeholder="Passwort..." value={pbPwdInput} onChange={e => setPbPwdInput(e.target.value)} onKeyDown={e => e.key==='Enter' && handlePbLogin()} className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-6 outline-none focus:border-blue-500 text-center" />
                            <button onClick={handlePbLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-3 rounded-xl transition">Entsperren</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen w-full flex flex-col bg-white overflow-hidden justify-between">
                    <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center">
                        <div className="max-w-lg w-full text-center flex flex-col items-center py-10">
                            <img src="icon.png" alt="Logo" className="w-40 h-40 md:w-48 md:h-48 object-contain mb-6 drop-shadow-md rounded-3xl" onError={(e) => { e.target.style.display='none'; }} />
                            <h1 className="text-4xl md:text-5xl font-black text-gray-900 mb-2 tracking-tight">Messdienerplan</h1>
                            <h2 className="text-2xl font-bold text-blue-600 mb-12">Thalau</h2>
                            <div className="w-full space-y-4 px-2 md:px-4">
                                <button onClick={() => { 
                                    if(vm.adminPassword && vm.adminPassword === vm.cloudAdminPassword && vm.cloudAdminPassword !== '') {
                                        vm.setRoute('admin');
                                        if(window.innerWidth < 768) vm.setActiveTab('menu');
                                    } else {
                                        setShowAdminLogin(true); 
                                    }

        function AbwesenheitenPortal() {
            const vm = useViewModel();
            const [step, setStep] = useState(1);
            const [name, setName] = useState("");
            const [neueEintraege, setNeueEintraege] = useState([{ id: crypto.randomUUID(), type: 'single', start: '', end: '' }]);
            const [showExisting, setShowExisting] = useState(false);
            const [showWarningModal, setShowWarningModal] = useState(false);

            const handleNameSubmit = () => { if(!vm.alleMinis.includes(name.trim())) { alert("Name nicht in der Datenbank gefunden! Bitte wähle deinen Namen aus der Vorschlagsliste aus."); return; } setStep(2); };

            const formatDate = (isoStr) => { if (!isoStr) return ""; const p = isoStr.split('-'); return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:isoStr; };
            const isLocked = (dateStr) => { if (!vm.planGeneriertBis || !dateStr) return false; return new Date(dateStr) <= new Date(vm.planGeneriertBis); };
            const existingEntries = (vm.abwesenheiten || []).filter(a => a.name === name.trim() && new Date(a.start) >= new Date(new Date().setHours(0,0,0,0))).sort((a, b) => new Date(a.start) - new Date(b.start));

            const saveAndFinish = () => {
                const valide = neueEintraege.filter(e => e.start !== "");
                const neueAbwesenheiten = valide.map(e => ({ 
                    id: crypto.randomUUID(), 
                    name: name.trim(), 
                    start: e.start, 
                    end: e.type === 'period' ? e.end : e.start, 
                    type: e.type 
                }));
                vm.setAbwesenheiten([...vm.abwesenheiten, ...neueAbwesenheiten]);
                setShowWarningModal(false);
                setStep(3);

            const handleSubmitFinal = () => { 
                const valide = neueEintraege.filter(e => e.start !== ""); 
                if (valide.length === 0) { alert("Bitte mindestens ein gültiges Datum eintragen!"); return; } 

                const hatUeberschneidung = valide.some(e => {
                    if (!vm.planGeneriertBis || !e.start) return false;
                    const planLimit = new Date(vm.planGeneriertBis);
                    planLimit.setHours(23, 59, 59, 999);
                    const startDate = new Date(e.start);
                    startDate.setHours(0, 0, 0, 0);
                    return startDate <= planLimit;
                });

                if (hatUeberschneidung) {
                    setShowWarningModal(true);
                } else {
                    saveAndFinish();
                }

            if (step === 3) {

            return (

                                <>
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-6"><label className="block text-lg font-medium text-gray-800 mb-6">Vor- und Nachname <span className="text-red-500">*</span></label><AutocompleteField value={name} onChange={setName} suggestions={vm.alleMinis} placeholder="Meine Antwort" className="w-full border-b border-gray-300 focus:border-red-500 pb-2 text-lg outline-none bg-transparent transition-colors" /></div>
                                    <div className="flex justify-between items-center mt-8"><button onClick={() => vm.setRoute('landing')} className="text-gray-500 font-bold hover:bg-gray-100 px-4 py-2 rounded-lg transition">Abbrechen</button><button onClick={handleNameSubmit} disabled={!name.trim()} className="bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white font-bold px-8 py-3 rounded-xl transition shadow-md">Weiter</button></div>
                                </>
                            )}
                            {step === 2 && (
                                <div className="space-y-6">
                                    {existingEntries.length > 0 && (
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden"><button onClick={() => setShowExisting(!showExisting)} className="w-full p-6 text-left flex justify-between items-center hover:bg-gray-50 transition"><span className="font-bold text-gray-800 text-lg">Aktuelle Abwesenheiten ansehen</span><i className={`fa-solid fa-chevron-${showExisting ? 'up' : 'down'} text-gray-400`}></i></button>{showExisting && (<div className="p-6 border-t border-gray-100 bg-gray-50 space-y-3">{existingEntries.map(a => (<div key={a.id} className="flex justify-between items-center bg-white p-4 rounded-xl border border-gray-200"><div><div className="font-bold text-gray-800">{a.type === 'single' ? formatDate(a.start) : `${formatDate(a.start)} - ${formatDate(a.end)}`}</div>{isLocked(a.start) && <div className="text-xs text-red-500 font-bold mt-1"><i className="fa-solid fa-lock mr-1"></i>Plan bereits erstellt</div>}</div>{!isLocked(a.start) && <button onClick={() => { if(confirm("Eintrag löschen?")) vm.setAbwesenheiten(vm.abwesenheiten.filter(x => x.id !== a.id)); }} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button>}</div>))}</div>)}</div>
                                    )}

                                        <div key={eintrag.id} className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 relative">{neueEintraege.length > 1 && <button onClick={() => setNeueEintraege(neueEintraege.filter(e=>e.id!==eintrag.id))} className="absolute top-6 right-6 text-gray-400 hover:text-red-500"><i className="fa-solid fa-xmark text-xl"></i></button>}<label className="block text-lg font-medium text-gray-800 mb-6">Start der Abwesenheit <span className="text-red-500">*</span></label><input type="date" value={eintrag.start} onChange={e => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,start:e.target.value}:x))} min={new Date().toISOString().split('T')[0]} className="w-full md:w-1/2 border-b border-gray-300 focus:border-red-500 pb-2 text-lg outline-none bg-transparent mb-8" /><label className="block text-lg font-medium text-gray-800 mb-4">Nur an diesem Tag oder längerer Zeitraum? <span className="text-red-500">*</span></label><div className="space-y-3 mb-8"><label className="flex items-center space-x-3 cursor-pointer p-2 rounded-lg hover:bg-gray-50"><input type="radio" checked={eintrag.type === 'single'} onChange={() => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,type:'single'}:x))} className="w-5 h-5 accent-red-500" /><span className="text-gray-800 text-lg">Nur dieser Tag</span></label><label className="flex items-center space-x-3 cursor-pointer p-2 rounded-lg hover:bg-gray-50"><input type="radio" checked={eintrag.type === 'period'} onChange={() => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,type:'period'}:x))} className="w-5 h-5 accent-red-500" /><span className="text-gray-800 text-lg">Mehrere Tage</span></label></div>{eintrag.type === 'period' && (<div className="bg-red-50 p-6 rounded-xl border border-red-100"><label className="block text-lg font-medium text-gray-800 mb-2">Bis wann?</label><input type="date" value={eintrag.end} onChange={e => setNeueEintraege(neueEintraege.map(x=>x.id===eintrag.id?{...x,end:e.target.value}:x))} min={eintrag.start || new Date().toISOString().split('T')[0]} className="w-full md:w-1/2 border-b border-gray-300 focus:border-red-500 pb-2 text-lg outline-none bg-transparent" /></div>)}</div>
                                    ))}
                                    <div className="flex justify-center mb-8"><button onClick={() => setNeueEintraege([...neueEintraege, { id: crypto.randomUUID(), type: 'single', start: '', end: '' }])} className="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold px-6 py-3 rounded-full shadow-sm flex items-center"><i className="fa-solid fa-plus mr-2"></i>Weiteres Datum</button></div>
                                    <div className="flex justify-between items-center mt-8 pb-10"><button onClick={() => setStep(1)} className="text-gray-500 font-bold hover:bg-gray-100 px-4 py-2 rounded-lg transition">Abbrechen</button><button onClick={handleSubmitFinal} className="bg-red-500 hover:bg-red-600 text-white font-bold px-8 py-3 rounded-xl transition shadow-md">Senden</button></div>
                                </div>
                            )}
                            <LegalFooter />
                        </div>
                    </div>

                    {showWarningModal && (

                                    Für den Zeitraum bis zum <strong>{formatDate(vm.planGeneriertBis)}</strong> wurde der Messdienerplan bereits fest eingeteilt.
                                    <br/><br/>

                            </div>
                        </div>

        function PfarrbueroView() {
            const vm = useViewModel();

                const formattedDate = parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : datum;
                vm.setVormerkungen([...(vm.vormerkungen||[]), { id: crypto.randomUUID(), datum: formattedDate, wochentag: wt, uhrzeit: uhrzeit, anlass: anlass || "Gottesdienst", minis: minis.filter(m => m.trim() !== "" && vm.alleMinis.includes(m.trim())), isFromPfarrbuero: true }]);

                        <h2 className="text-2xl font-bold mb-6 text-gray-900"><i className="fa-solid fa-pen-to-square text-blue-500 mr-3"></i>Gottesdienst bearbeiten</h2>
                        <div className="grid grid-cols-2 gap-4 mb-4"><div><label className="block text-sm text-gray-500 mb-1">Datum</label><input type="text" value={edit.datum} onChange={e=>setEdit({...edit, datum: e.target.value})} className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"/></div><div><label className="block text-sm text-gray-500 mb-1">Wochentag</label><input type="text" value={edit.wochentag} onChange={e=>setEdit({...edit, wochentag: e.target.value})} className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"/></div></div>
                        <div className="grid grid-cols-2 gap-4 mb-4"><div><label className="block text-sm text-gray-500 mb-1">Uhrzeit</label><input type="text" value={edit.uhrzeit} onChange={e=>setEdit({...edit, uhrzeit: e.target.value})} className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"/></div><div><label className="block text-sm text-gray-500 mb-1">Anlass</label><input type="text" value={edit.anlass} onChange={e=>setEdit({...edit, anlass: e.target.value})} className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"/></div></div>
                        <div className="grid grid-cols-2 gap-4 mb-6"><div><label className="block text-sm text-gray-500 mb-1">Bedarf (Zahl)</label><input type="number" value={edit.manuellerBedarf || ''} onChange={e=>setEdit({...edit, manuellerBedarf: e.target.value})} placeholder="Automatisch" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"/></div><div><label className="block text-sm text-gray-500 mb-1">Hinweis Text</label><input type="text" value={edit.manuellerText || ''} onChange={e=>setEdit({...edit, manuellerText: e.target.value})} placeholder="z.B. Fällt aus" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"/></div></div>
                        <hr className="my-4 border-gray-200" />
                        
                        <h3 className="font-bold text-gray-800 mb-4">Einteilung (Gruppe {edit.gruppe})</h3>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
                            {(assignedGroup.mitglieder || []).map(m => {
                                const isActive = edit.minis.includes(m);
                                return <button key={m} onClick={() => toggleMini(m)} className={`p-3 rounded-xl font-bold text-sm border-2 transition ${isActive ? 'bg-blue-500 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-200 hover:border-blue-300'}`}>{m}</button>;
                            })}
                        </div>
                        
                        <div className="mb-6"><label className="block text-sm text-gray-500 mb-2">Ersatz / Weitere Person hinzufügen:</label><AutocompleteField value="" onChange={(val) => { if(val && !edit.minis.includes(val)) setEdit({...edit, minis: [...edit.minis, val]}); }} suggestions={vm.alleMinis} placeholder="Name suchen..." /></div>
                        
                        <div className="flex justify-between items-center"><button onClick={() => { if(confirm("Diesen Gottesdienst komplett löschen?")) { vm.setDienste(vm.dienste.filter(d => d.id !== edit.id)); onClose(); } }} className="text-red-500 hover:text-red-700 font-bold"><i className="fa-solid fa-trash mr-2"></i>Löschen</button><div className="space-x-4"><button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition">Abbrechen</button><button onClick={handleSave} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md transition">Speichern</button></div></div>
                    </div>
                </div>
            );
        }

        function PlanerView() {
            const vm = useViewModel();
            const [editingDienst, setEditingDienst] = useState(null);

            const getWeekIdentifier = (dateStr) => { 
                const d = vm.parseDateStr(dateStr); if (!d) return crypto.randomUUID(); 
                const dCopy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const day = dCopy.getDay(); 
                dCopy.setDate(dCopy.getDate() - day); 
                return `${dCopy.getFullYear()}-${String(dCopy.getMonth()+1).padStart(2,'0')}-${String(dCopy.getDate()).padStart(2,'0')}`; 
            };

            const getChronologischeBloecke = () => {
                let bloecke = []; let currentWeek = null; let currentDienste = [];
                const sorted = [...(vm.dienste || [])].sort((a, b) => { 
                    const da = vm.parseDateStr(a.datum); const db = vm.parseDateStr(b.datum); 
                    const tA = da ? da.getTime() : 0; const tB = db ? db.getTime() : 0;
                    if (tA === tB) return vm.normalizeTime(a.uhrzeit).localeCompare(vm.normalizeTime(b.uhrzeit)); return tA - tB; 
                });
                for (let dienst of sorted) {
                    const w = getWeekIdentifier(dienst.datum);
                    if (w !== currentWeek) {
                        if (currentWeek !== null) { let counts = {}; currentDienste.forEach(d => { if (d.gruppe && d.gruppe !== "Z") counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; }); bloecke.push({ id: currentWeek, gruppe: Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : ((vm.gruppen||[])[0]?.name || "A"), dienste: currentDienste }); }
                        currentWeek = w; currentDienste = [dienst];
                    } else currentDienste.push(dienst);
                }
                if (currentWeek !== null) { let counts = {}; currentDienste.forEach(d => { if (d.gruppe && d.gruppe !== "Z") counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; }); bloecke.push({ id: currentWeek, gruppe: Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : ((vm.gruppen||[])[0]?.name || "A"), dienste: currentDienste }); }
                return bloecke;
            };

            const leseGottesdienste = async () => {
                if (!vm.apiKey) { vm.setFehlerMeldung("Bitte API-Key in den Einstellungen hinterlegen."); return; }
                if (!vm.pdfFile) { vm.setFehlerMeldung("Bitte PDF wählen."); return; }
                vm.setLaedt(true); vm.setFehlerMeldung(null); vm.setLadeStatusText("Lese Datei aus...");
                try {
                    const base64String = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(vm.pdfFile); });
                    vm.setLadeStatusText("KI analysiert Pfarrbrief...");
                    const body = {
                        systemInstruction: { parts: [{ text: "Du bist ein präziser Parser für Pfarrbrief-Daten. Extrahiere Gottesdienste in Thalau. Erlaube Hl. Messe, Taufe, Hochzeit, Beerdigung, Osternacht, Christmette. Gib JSON Array zurück mit datum, wochentag, uhrzeit, anlass, gruppe, minis." }] },
                        contents: [{ parts: [{ text: "Analysiere PDF." }, { inlineData: { mimeType: "application/pdf", data: base64String } }] }],
                        generationConfig: { responseMimeType: "application/json", responseSchema: { type: "ARRAY", items: { type: "OBJECT", properties: { datum: { type: "STRING" }, wochentag: { type: "STRING" }, uhrzeit: { type: "STRING" }, anlass: { type: "STRING" }, gruppe: { type: "STRING" }, minis: { type: "ARRAY", items: { type: "STRING" } } }, required: ["datum", "wochentag", "uhrzeit", "anlass", "minis"] } } }
                    };
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${vm.geminiModel}:generateContent?key=${vm.apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                    const json = await response.json(); if (json.error) throw new Error(json.error.message);
                    let rawDienste = JSON.parse(json.candidates[0].content.parts[0].text.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim());
                    
                    let wochenGruppen = {}; rawDienste.forEach(d => { if (d.gruppe) wochenGruppen[getWeekIdentifier(d.datum)] = d.gruppe.replace(/Gruppe/i, '').trim(); });
                    let alleWochen = [...new Set(rawDienste.map(d => getWeekIdentifier(d.datum)))].sort();
                    let aktuelleGruppe = (vm.gruppen||[])[0]?.name || "A"; if (alleWochen.length > 0 && wochenGruppen[alleWochen[0]]) aktuelleGruppe = wochenGruppen[alleWochen[0]];
                    const gruppenNamen = (vm.gruppen||[]).map(g => g.name);
                    alleWochen.forEach(woche => { if (wochenGruppen[woche]) aktuelleGruppe = wochenGruppen[woche]; wochenGruppen[woche] = aktuelleGruppe; aktuelleGruppe = gruppenNamen[(gruppenNamen.indexOf(aktuelleGruppe) + 1) % gruppenNamen.length]; });

                    let bereinigteDienste = [];
                    rawDienste.forEach(raw => {
                        let d = { ...raw, id: crypto.randomUUID(), minis: [], uhrzeit: vm.normalizeTime(raw.uhrzeit || ""), isFromPfarrbuero: false };
                        let currentAnlass = d.anlass || "Hl. Messe"; let isValid = false;
                        if (["Hl. Messe", "Taufe", "Hochzeit", "Beerdigung", "Osternacht", "Christmette"].includes(currentAnlass)) isValid = true;
                        else { let lower = currentAnlass.toLowerCase(); if (lower.includes("taufe")) { currentAnlass = "Taufe"; isValid = true; } else if (lower.includes("hochzeit") || lower.includes("trauung")) { currentAnlass = "Hochzeit"; isValid = true; } else if (lower.includes("beerdigung")) { currentAnlass = "Beerdigung"; isValid = true; } else if (lower.includes("messe") || lower.includes("eucharistie") || lower.includes("hochamt")) { currentAnlass = "Hl. Messe"; isValid = true; } else if (lower.includes("osternacht")) { currentAnlass = "Osternacht"; isValid = true; } else if (lower.includes("christmette")) { currentAnlass = "Christmette"; isValid = true; } else if (lower.includes("gottesdienst")) isValid = true; }
                        if (isValid) { d.anlass = currentAnlass; let wId = getWeekIdentifier(d.datum); if (wochenGruppen[wId]) d.gruppe = wochenGruppen[wId]; bereinigteDienste.push(d); }
                    });
                    vm.setDienste(bereinigteDienste); vm.setAppState('review');
                } catch (e) { vm.setFehlerMeldung("KI Fehler: " + e.message); } finally { vm.setLaedt(false); }
            };

            const teileEin = async () => {
                vm.setLaedt(true); vm.setLadeStatusText("Berechne Einteilung...");
                setTimeout(() => {
                    let neueDienste = [...(vm.dienste||[])]; let planMaxDate = null;
                    neueDienste.forEach(d => {
                        const parsedD = vm.parseDateStr(d.datum); if (parsedD && (!planMaxDate || parsedD > planMaxDate)) planMaxDate = parsedD;
                        if((d.minis||[]).length === 0 && !d.manuellerBedarf && !d.manuellerText) {
                            let woche = (d.wochentag||"").toLowerCase();
                            let count = (woche.includes('sonntag') || woche.includes('feiertag')) ? vm.anzahlSonntags : vm.anzahlWerktags;
                            
                            const matchV = (vm.vormerkungen||[]).find(v => v.datum === d.datum && (vm.normalizeTime(v.uhrzeit) === vm.normalizeTime(d.uhrzeit) || v.uhrzeit === "" || v.uhrzeit === "Ganztägig"));
                            if (matchV) { d.minis = [...(matchV.minis||[])]; d.isFromPfarrbuero = matchV.isFromPfarrbuero || false; } 
                            else {
                                let g = (vm.gruppen||[]).find(gr => gr.name === d.gruppe);
                                if (g && g.mitglieder && g.mitglieder.length > 0) {
                                    let verfuegbare = g.mitglieder.filter(m => {
                                        const regAbw = (vm.regelmaessigeAbwesenheiten||[]).find(ra => ra.name === m);
                                        if (regAbw && parsedD) { if (regAbw.wochentage.includes(parsedD.getDay() === 0 ? 1 : parsedD.getDay() + 1)) return false; } 
                                        if (parsedD) { const urlaub = (vm.abwesenheiten||[]).find(ab => { if (ab.name !== m) return false; const s = new Date(ab.start); const e = new Date(ab.end); s.setHours(0,0,0,0); e.setHours(23,59,59,999); return parsedD >= s && parsedD <= e; }); if (urlaub) return false; }
                                        return true;
                                    });
                                    d.minis = verfuegbare.sort(() => 0.5 - Math.random()).slice(0, count);
                                } else d.minis = [];
                            }
                        }
                    });
                    vm.setDienste(neueDienste);
                    if (planMaxDate) { const maxIso = planMaxDate.toISOString().split('T')[0]; if (!vm.planGeneriertBis || new Date(maxIso) > new Date(vm.planGeneriertBis)) vm.setPlanGeneriertBis(maxIso); }
                    vm.setAppState('assigned'); vm.setLaedt(false);
                    
                    const planForCloud = neueDienste.map(d => ({ art: 'gottesdienst', wochentag: d.wochentag, datum: d.datum, typ: d.anlass, uhrzeit: d.uhrzeit, messdiener: (d.minis||[]).join(', ') || "-" }));
                    if (vm.firebaseProjectId) vm.syncDoc('aktuellerPlan', { planDataJson: { stringValue: JSON.stringify(planForCloud) }, timestamp: { stringValue: Date.now().toString() } });
                }, 1500);
            };

            const exportierePDF = async () => {
                const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' }); let y = 12; const margin = 20;
                
                try {
                    const img = new Image(); img.crossOrigin = "Anonymous"; img.src = 'icon.png';
                    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
                    const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height; canvas.getContext('2d').drawImage(img, 0, 0);
                    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 88, y, 34, 34); 
                    y += 50;
                } catch (e) { console.log("Kein Logo gefunden."); y = 20; }

                doc.setFontSize(22); doc.setFont("helvetica", "bold"); doc.text("Einteilung der Messdiener/innen", 105, y, { align: "center" }); y += 16;
                
                const bloecke = getChronologischeBloecke();
                let firstGroup = ""; let secondGroup = "";
                if (bloecke.length > 0) firstGroup = bloecke[0].gruppe.replace(/Gruppe/i, '').trim();
                if (bloecke.length > 1) secondGroup = bloecke[1].gruppe.replace(/Gruppe/i, '').trim();
                
                for (const block of bloecke) {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.text(`Gruppe ${block.gruppe.replace(/Gruppe/i, '').trim()}`, 105, y, { align: "center" }); y += 10;
                    for (const dienst of block.dienste) {
                        let requiredHeight = 14 + (Math.max((dienst.minis||[]).length, 1) * 6);
                        if (y + requiredHeight > 277) { doc.addPage(); y = 20; }
                        doc.setFontSize(12); doc.setFont("helvetica", "bold"); let t = (dienst.uhrzeit||"").replace(/h/i, '').trim(); if(!t.toLowerCase().endsWith("uhr")) t+=" Uhr";
                        doc.text(`${dienst.wochentag} ${dienst.datum} ${dienst.anlass} ${t}`, margin, y); y += 8;
                        doc.setFont("helvetica", "normal");
                        if (dienst.manuellerText) { doc.text(dienst.manuellerText, margin, y); y += 6; }
                        else if (dienst.manuellerBedarf) { doc.text(`Es werden ${dienst.manuellerBedarf} benötigt.`, margin, y); y += 6; }
                        else if ((dienst.minis||[]).length === 0) { doc.text("-", margin, y); y += 6; }
                        else { for (const mini of dienst.minis) { doc.text(mini, margin, y); y += 6; } }
                        y += 4;
                    }
                }

                if (y > 250) { doc.addPage(); y = 20; } y += 10;
                doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(0, 0, 0); 
                doc.text("Wer eingeteilt ist und nicht dienen kann, sucht sich bitte selbstständig eine Vertretung!", 105, y, { align: "center" }); y += 15;

                if (vm.notizen && vm.notizen.length > 0) {
                    if (y > 240) { doc.addPage(); y = 20; }
                    doc.setFontSize(16); doc.text("News & Ankündigungen", 105, y, { align: "center" }); y += 12;
                    vm.notizen.forEach(note => {
                        if (y > 260) { doc.addPage(); y = 20; }
                        if (note.titel) { doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(note.titel, margin, y); y += 6; }
                        if (note.inhalt) { doc.setFont("helvetica", "normal"); doc.setFontSize(11); const splitNews = doc.splitTextToSize(note.inhalt, 170); doc.text(splitNews, margin, y); y += (splitNews.length * 5) + 4; }
                        y += 4; 
                    });
                }

                const gruppenText = (firstGroup && secondGroup) ? `In den kommenden zwei Wochen sind Gruppe ${firstGroup} und ${secondGroup} dran. ` : "";
                const formText = gruppenText + "Wenn Abwesenheiten jetzt schon bekannt sind, trage sie ganz einfach online ein, damit sie beim nächsten Plan automatisch berücksichtigt werden. Klicke dazu einfach auf den Button:";
                doc.setFont("helvetica", "normal"); doc.setFontSize(11); const splitFormText = doc.splitTextToSize(formText, 150);
                const boxHeight = 10 + 8 + (splitFormText.length * 5) + 4 + 10 + 10; 
                if (y + boxHeight > 280) { doc.addPage(); y = 20; }
                
                doc.setFillColor(245, 245, 245); doc.roundedRect(20, y, 170, boxHeight, 5, 5, 'F');
                let currentY = y + 14;
                doc.setTextColor(0, 0, 0); doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text("Abwesenheiten eintragen", 105, currentY, { align: "center" }); currentY += 8;
                doc.setFont("helvetica", "normal"); doc.setFontSize(11);
                splitFormText.forEach(line => { doc.text(line, 105, currentY, { align: "center" }); currentY += 5; });
                
                const buttonY = currentY + 3; 
                doc.setFillColor(0, 122, 255); doc.roundedRect(105 - 23, buttonY, 46, 10, 3, 3, 'F'); 
                doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
                doc.text("Zum Formular", 105, buttonY + 6.5, { align: "center" });
                const urlParams = new URLSearchParams(window.location.search); const pid = urlParams.get('id') || vm.firebaseProjectId;
                doc.link(105 - 23, buttonY, 46, 10, { url: window.location.origin + window.location.pathname + '?id=' + pid });
                doc.save("Messdienerplan.pdf");
            };

            const resetApp = () => { vm.setAppState('upload'); vm.setDienste([]); vm.setPdfFile(null); };
            const bloecke = getChronologischeBloecke();

            return (
                <div className="flex flex-col md:flex-row h-full w-full overflow-hidden relative">
                    <MobileTopBar title="Planer" />
                    
                    <div className={`w-full md:w-[320px] lg:w-[380px] bg-white p-6 md:p-8 border-b md:border-b-0 md:border-r border-gray-200 shadow-sm z-10 shrink-0 flex flex-col h-auto md:h-full transition-all duration-300`}>
                        {vm.appState === 'upload' && (
                            <div className="flex flex-col h-full justify-center">
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">1. Pfarrbrief hochladen</h2>
                                <p className="text-gray-500 text-sm mb-6">Wähle das PDF aus, um die Termine per KI auszulesen.</p>
                                <label className={`w-full py-12 border-4 border-dashed rounded-3xl flex flex-col items-center justify-center cursor-pointer transition ${vm.pdfFile ? 'border-blue-500 bg-blue-50' : 'border-gray-300 bg-gray-50 hover:bg-gray-100'}`}>
                                    <i className={`fa-solid ${vm.pdfFile ? 'fa-file-circle-check text-blue-500' : 'fa-file-pdf text-gray-400'} text-5xl mb-4`}></i>
                                    <span className={`text-sm font-bold text-center px-4 ${vm.pdfFile ? 'text-blue-600' : 'text-gray-500'}`}>{vm.pdfFile ? vm.pdfFile.name : 'PDF hierher ziehen'}</span>
                                    <input type="file" accept="application/pdf" className="hidden" onChange={e => vm.setPdfFile(e.target.files[0])} />
                                </label>
                                <button onClick={leseGottesdienste} disabled={vm.laedt || !vm.pdfFile} className="mt-6 w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold py-4 rounded-xl shadow-md transition flex justify-center items-center">
                                    {vm.laedt ? <i className="fa-solid fa-circle-notch fa-spin mr-2"></i> : <i className="fa-solid fa-wand-magic-sparkles mr-2"></i>}{vm.laedt ? vm.ladeStatusText : 'KI Analyse starten'}
                                </button>
                                {vm.fehlerMeldung && <div className="mt-4 p-4 bg-red-50 text-red-600 rounded-lg text-xs font-bold border border-red-200"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{vm.fehlerMeldung}</div>}
                            </div>
                        )}
                        {vm.appState === 'review' && (
                            <div className="flex flex-col h-full">
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">2. Abgleichen</h2>
                                <p className="text-gray-500 text-sm mb-4">Prüfe die erkannten Termine. Klicke auf eine Kachel, um sie zu bearbeiten.</p>
                                {vm.pdfFile && (
                                    <div className="w-full flex-1 mb-4 border border-gray-200 rounded-xl overflow-hidden bg-gray-100 hidden md:block">
                                        <iframe src={URL.createObjectURL(vm.pdfFile)} className="w-full h-full border-none" title="PDF Vorschau"></iframe>
                                    </div>
                                )}
                                <div className="flex-shrink-0 space-y-3">
                                    <button onClick={() => setEditingDienst({id: crypto.randomUUID(), datum: "", wochentag: "", uhrzeit: "", anlass: "Hl. Messe", minis: []})} className="w-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-3 rounded-xl transition shadow-sm"><i className="fa-solid fa-plus mr-2"></i>Termin hinzufügen</button>
                                    <button onClick={teileEin} disabled={vm.laedt} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition flex justify-center items-center">
                                        {vm.laedt ? <i className="fa-solid fa-circle-notch fa-spin mr-2"></i> : <i className="fa-solid fa-users mr-2"></i>}{vm.laedt ? vm.ladeStatusText : 'Jetzt automatisch Einteilen'}
                                    </button>
                                    <button onClick={resetApp} className="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl transition">Abbrechen & Neustart</button>
                                </div>
                            </div>
                        )}
                        {vm.appState === 'assigned' && (
                            <div className="flex flex-col h-full justify-center">
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">3. Fertig!</h2>
                                <p className="text-gray-500 text-sm mb-6">Der Plan ist erstellt. Du kannst manuell korrigieren (Klick auf Kachel) oder das PDF herunterladen.</p>
                                <button onClick={exportierePDF} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition mb-4"><i className="fa-solid fa-print mr-2"></i>Als PDF exportieren</button>
                                <button onClick={resetApp} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition">Neuen Plan erstellen</button>
                            </div>
                        )}
                    </div>
                    
                    <div className="flex-1 bg-gray-50/50 p-4 md:p-10 overflow-y-auto relative md:h-full">
                        {vm.laedt && vm.appState !== 'upload' && <div className="absolute inset-0 z-50 bg-white/60 backdrop-blur-sm flex items-center justify-center"><i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i></div>}
                        
                        <div className="max-w-6xl mx-auto pb-20">
                            <h1 className="text-2xl md:text-4xl font-extrabold text-gray-900 mb-6 hidden md:block">Gottesdienste</h1>
                            {bloecke.length === 0 ? (

        function WerkzeugeView() {
            const vm = useViewModel();
            const [kopiert, setKopiert] = useState(false);
            const [kiLoading, setKiLoading] = useState(false);

            const handleCopy = () => {
                const alle = (vm.gruppen || []).flatMap(g => g.mitglieder || []).sort().join("\n");
                navigator.clipboard.writeText(alle); setKopiert(true); setTimeout(() => setKopiert(false), 2000);
            };

            const handleKiImport = async () => {
                if(!vm.apiKey) { alert("Bitte erst den Gemini API Key hinterlegen!"); return; }
                try {
                    const text = await navigator.clipboard.readText();
                    if(!text) { alert("Zwischenablage ist leer!"); return; }
                    if(confirm("Deine aktuellen Gruppen werden durch die Daten aus der Zwischenablage überschrieben. Fortfahren?")) {
                        setKiLoading(true);
                        const body = { contents: [{ parts: [{ text: `Extrahiere Namen und weise sie Gruppen zu. TEXT: ${text}` }] }], generationConfig: { responseMimeType: "application/json", responseSchema: { type: "ARRAY", items: { type: "OBJECT", properties: { name: { type: "STRING" }, mitglieder: { type: "ARRAY", items: { type: "STRING" } } }, required: ["name", "mitglieder"] } } } };
                        const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){vm.geminiModel}:generateContent?key=${vm.apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                        const json = await response.json();
                        let cleanJsonString = json.candidates[0].content.parts[0].text.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
                        const importierteGruppen = JSON.parse(cleanJsonString);
                        const neueGruppen = importierteGruppen.map(g => ({ id: crypto.randomUUID(), name: g.name, mitglieder: g.mitglieder }));
                        vm.setGruppen(neueGruppen);
                        let newStat = {...vm.statistik}; neueGruppen.forEach(g => (g.mitglieder||[]).forEach(m => { if(newStat[m] === undefined) newStat[m] = 0; })); vm.setStatistik(newStat);
                        alert("Gruppen erfolgreich importiert!");
                    }
                } catch(e) { alert("Fehler: " + e.message); } finally { setKiLoading(false); }
            };

            const exportiereGruppenPDF = () => {
                const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' }); let currentY_mm = 20;
                doc.setFontSize(20); doc.setFont("helvetica", "bold"); doc.text("Übersicht: Alle Messdiener-Gruppen", 105, currentY_mm, { align: "center" }); currentY_mm += 15;
                for (const gruppe of vm.gruppen || []) {
                    if (currentY_mm + 15 > 280) { doc.addPage(); currentY_mm = 20; }
                    doc.setFontSize(16); doc.setFont("helvetica", "bold"); doc.text(`Gruppe ${gruppe.name}`, 20, currentY_mm); currentY_mm += 8;
                    doc.setFontSize(12); doc.setFont("helvetica", "normal");
                    for (const mini of gruppe.mitglieder || []) {
                        if (currentY_mm + 6 > 280) { doc.addPage(); currentY_mm = 20; }
                        const prefix = (vm.neueMessdiener || []).includes(mini) ? "* " : "• "; doc.text(`${prefix}${mini}`, 25, currentY_mm); currentY_mm += 6;
                    }
                    currentY_mm += 8;
                }
                doc.save("Gruppenliste.pdf");
            };

            const ToolBox = ({ icon, title, desc, btnText, onClick, colorClass, btnClass, loading }) => (
                <div className="bg-white rounded-xl border border-gray-200 p-5 md:p-6 shadow-sm mb-4 md:mb-6">
                    <div className="flex items-center space-x-3 mb-2"><i className={`${icon} ${colorClass} text-2xl w-8 text-center`}></i><h2 className="text-lg md:text-xl font-bold text-gray-800">{title}</h2></div>
                    <p className="text-sm md:text-base text-gray-500 mb-5 ml-11">{desc}</p>
                    <div className="ml-11"><button onClick={onClick} disabled={loading} className={`${btnClass} px-4 py-2 rounded-lg text-sm font-bold shadow-sm w-full md:w-auto disabled:opacity-50`}>{loading ? 'Verarbeite...' : btnText}</button></div>
                </div>
            );

            return (
                <div className="h-full flex flex-col">
                    <MobileTopBar title="Werkzeuge" />
                    <div className="flex-1 overflow-y-auto p-6 md:p-10 bg-gray-50/50">
                        <div className="max-w-3xl mx-auto md:mx-0">
                            <div className="hidden md:block mb-8"><h1 className="text-3xl font-bold text-gray-900">Werkzeuge</h1></div>
                            <ToolBox icon="fa-solid fa-copy" colorClass="text-blue-500" title="Namen kopieren" desc="Kopiert alle Messdiener in die Zwischenablage." btnText={kopiert ? "Kopiert!" : "Kopieren"} onClick={handleCopy} btnClass="bg-blue-600 text-white" />
                            <ToolBox icon="fa-solid fa-file-pdf" colorClass="text-orange-500" title="Gruppen-Liste (PDF)" desc="Erstellt ein druckfertiges PDF." btnText="Herunterladen" onClick={exportiereGruppenPDF} btnClass="bg-orange-500 text-white" />
                            <ToolBox icon="fa-solid fa-wand-magic-sparkles" colorClass="text-purple-500" title="KI Import" desc="Kopiere einen Text mit Gruppen und Namen. Die KI überschreibt deine aktuellen Gruppen." btnText="Aus Zwischenablage importieren" onClick={handleKiImport} loading={kiLoading} btnClass="bg-purple-600 text-white" />
                        </div>
                    </div>
                </div>
            );
        }
