<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messdiener Planer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { macBg: '#ececec', macSidebar: '#f5f5f5', macActive: '#007aff', macText: '#1d1d1f' },
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { overflow: hidden; margin: 0; background-color: #ececec; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
        input:focus, select:focus, textarea:focus, button:focus { outline: none; }
        .ios-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef } = React;

        // --- HILFSFUNKTIONEN (@AppStorage) ---
        function useAppStorage(key, initialValue) {
            const [state, setState] = useState(() => {
                try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; } 
                catch (error) { return initialValue; }
            });
            useEffect(() => { window.localStorage.setItem(key, JSON.stringify(state)); }, [key, state]);
            return [state, setState];
        }

        // --- AUTOCOMPLETE KOMPONENTE ---
        function AutocompleteField({ value, onChange, suggestions, placeholder, className }) {
            const [isOpen, setIsOpen] = useState(false);
            const wrapperRef = useRef(null);
            const filtered = suggestions.filter(s => s.toLowerCase().includes(value.toLowerCase()) && s.toLowerCase() !== value.toLowerCase());
            
            useEffect(() => {
                function handleClickOutside(event) { if (wrapperRef.current && !wrapperRef.current.contains(event.target)) setIsOpen(false); }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);
            
            return (
                <div ref={wrapperRef} className="relative w-full">
                    <input type="text" value={value} onChange={e => { onChange(e.target.value); setIsOpen(true); }} onFocus={() => setIsOpen(true)} placeholder={placeholder} className={className || "w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"} />
                    {isOpen && filtered.length > 0 && (
                        <ul className="absolute z-50 w-full bg-white border border-gray-200 shadow-lg rounded-lg mt-1 max-h-40 overflow-y-auto">
                            {filtered.map(s => <li key={s} onClick={() => { onChange(s); setIsOpen(false); }} className="px-4 py-2 hover:bg-blue-50 cursor-pointer text-gray-800 border-b border-gray-50 last:border-0">{s}</li>)}
                        </ul>
                    )}
                </div>
            );
        }

        // --- VIEWMODEL PROVIDER ---
        const ViewModelContext = createContext();

        function ViewModelProvider({ children }) {
            // App Routing
            const [route, setRoute] = useAppStorage('appRoute', 'landing'); // 'landing', 'admin', 'pfarrbuero'
            const [activeTab, setActiveTab] = useState('planer'); 
            const [isAppLoading, setIsAppLoading] = useState(false);
            const [appState, setAppState] = useAppStorage('appStateRaw', 'upload'); 
            const [laedt, setLaedt] = useState(false);
            const [ladeStatusText, setLadeStatusText] = useState("");
            const [fehlerMeldung, setFehlerMeldung] = useState(null);
            
            // Konfiguration
            const [apiKey, setApiKey] = useAppStorage('geminiApiKey', '');
            const [geminiModel, setGeminiModel] = useAppStorage('geminiModel', 'gemini-3.6-flash');
            const [firebaseProjectId, setFirebaseProjectId] = useAppStorage('firebaseProjectId', '');
            
            const [anzahlSonntags, setAnzahlSonntags] = useAppStorage('anzahlSonntags', 4);
            const [anzahlWerktags, setAnzahlWerktags] = useAppStorage('anzahlWerktags', 2);
            
            const [pdfGrauerText, setPdfGrauerText] = useAppStorage('pdfGrauerText', 'Wer eingeteilt ist und nicht dienen kann, sucht sich bitte selbstständig eine Vertretung!');
            const [pdfFooterUeberschrift, setPdfFooterUeberschrift] = useAppStorage('pdfFooterUeberschrift', 'Abwesenheiten eintragen');
            const [pdfFooterTextSuffix, setPdfFooterTextSuffix] = useAppStorage('pdfFooterTextV2', 'Wenn Abwesenheiten jetzt schon bekannt sind, trage sie ganz einfach online ein.');
            const [pdfLinkUrl, setPdfLinkUrl] = useAppStorage('pdfLinkUrl', 'https://forms.gle/nSzhoDgeAhUS4QG16');

            // Daten
            const [gruppen, setGruppen] = useAppStorage('gruppenDaten', [{ id: crypto.randomUUID(), name: "A", mitglieder: [] }]);
            const [neueMessdiener, setNeueMessdiener] = useAppStorage('neueMessdienerData', []);
            const [immerZusammen, setImmerZusammen] = useAppStorage('immerZusammenData', []);
            const [nieZusammen, setNieZusammen] = useAppStorage('nieZusammenData', []);
            const [statistik, setStatistik] = useAppStorage('statistikDaten', {});
            const [dienste, setDienste] = useAppStorage('diensteData', []);
            const [vormerkungen, setVormerkungen] = useAppStorage('vormerkungenData', []);
            const [regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten] = useAppStorage('regelmaessigeAbwesenheitenData', []);
            const [notizen, setNotizen] = useAppStorage('notizenData', []);
            const [events, setEvents] = useAppStorage('eventsData', []);
            const [prozessionen, setProzessionen] = useAppStorage('prozessionenData', []);
            
            const [customGroupDateRanges, setCustomGroupDateRanges] = useAppStorage('customGroupDateRangesData', {});
            const [nextGroup1, setNextGroup1] = useAppStorage('nextGroup1', '');
            const [nextGroup2, setNextGroup2] = useAppStorage('nextGroup2', '');

            const [pdfFile, setPdfFile] = useState(null);
            const [firebaseSyncErfolg, setFirebaseSyncErfolg] = useState(false);

            // ==========================================
            // MARK: - FIREBASE REST API INTEGRATION
            // ==========================================
            const getFbUrl = (docName) => `https://firestore.googleapis.com/v1/projects/${firebaseProjectId.trim()}/databases/(default)/documents/messdiener/${docName}`;

            const fetchAllData = async () => {
                if (!firebaseProjectId.trim()) return;
                setIsAppLoading(true);
                try {
                    const fetchDoc = async (docName, setter, parser) => {
                        try { const res = await fetch(getFbUrl(docName)); const data = await res.json(); if(data.fields) setter(parser(data.fields)); } catch(e){}
                    };
                    await fetchDoc('statistik', setStatistik, f => { let s={}; for(const [k,v] of Object.entries(f)) s[k]=parseInt(v.integerValue); return s; });
                    await fetchDoc('gruppen', f => { if(f.gruppenJson) setGruppen(JSON.parse(f.gruppenJson.stringValue)); if(f.neueMessdienerJson) setNeueMessdiener(JSON.parse(f.neueMessdienerJson.stringValue)); }, f=>f);
                    await fetchDoc('regeln', f => { if(f.immerZusammenJson) setImmerZusammen(JSON.parse(f.immerZusammenJson.stringValue)); if(f.nieZusammenJson) setNieZusammen(JSON.parse(f.nieZusammenJson.stringValue)); }, f=>f);
                    await fetchDoc('vormerkungen', f => { if(f.vormerkungenJson) setVormerkungen(JSON.parse(f.vormerkungenJson.stringValue)); }, f=>f);
                    await fetchDoc('wochenAbwesenheiten', f => { if(f.abwesenheitenJson) setRegelmaessigeAbwesenheiten(JSON.parse(f.abwesenheitenJson.stringValue)); }, f=>f);
                    await fetchDoc('events', f => { if(f.eventsJson) setEvents(JSON.parse(f.eventsJson.stringValue)); }, f=>f);
                    await fetchDoc('prozessionen', f => { if(f.prozessionenJson) setProzessionen(JSON.parse(f.prozessionenJson.stringValue)); }, f=>f);
                    await fetchDoc('notizen', f => { if(f.notizenJson) setNotizen(JSON.parse(f.notizenJson.stringValue)); }, f=>f);
                } catch(e) {}
                setIsAppLoading(false);
            };

            // Initiale Lade-Simulation & Fetch (nur wenn ProjektID gesetzt)
            useEffect(() => {
                if(firebaseProjectId) { fetchAllData(); } 
                else { setIsAppLoading(false); }
            }, [firebaseProjectId]);

            const syncDoc = async (docName, fields) => {
                if (!firebaseProjectId.trim()) return;
                await fetch(getFbUrl(docName), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) });
            };

            const syncStatistikToFirebase = async () => {
                let fields = {};
                for (const [key, val] of Object.entries(statistik)) fields[key] = { integerValue: String(val) };
                await syncDoc('statistik', fields);
                setFirebaseSyncErfolg(true); setTimeout(() => setFirebaseSyncErfolg(false), 3000);
            };

            useEffect(() => { const t = setTimeout(() => syncDoc('gruppen', { gruppenJson: { stringValue: JSON.stringify(gruppen) }, neueMessdienerJson: { stringValue: JSON.stringify(neueMessdiener) } }), 1000); return () => clearTimeout(t); }, [gruppen, neueMessdiener]);
            useEffect(() => { const t = setTimeout(() => syncDoc('regeln', { immerZusammenJson: { stringValue: JSON.stringify(immerZusammen) }, nieZusammenJson: { stringValue: JSON.stringify(nieZusammen) } }), 1000); return () => clearTimeout(t); }, [immerZusammen, nieZusammen]);
            useEffect(() => { const t = setTimeout(() => syncDoc('vormerkungen', { vormerkungenJson: { stringValue: JSON.stringify(vormerkungen) } }), 1000); return () => clearTimeout(t); }, [vormerkungen]);
            useEffect(() => { const t = setTimeout(() => syncDoc('wochenAbwesenheiten', { abwesenheitenJson: { stringValue: JSON.stringify(regelmaessigeAbwesenheiten) } }), 1000); return () => clearTimeout(t); }, [regelmaessigeAbwesenheiten]);
            useEffect(() => { const t = setTimeout(() => syncDoc('events', { eventsJson: { stringValue: JSON.stringify(events) } }), 1000); return () => clearTimeout(t); }, [events]);
            useEffect(() => { const t = setTimeout(() => syncDoc('prozessionen', { prozessionenJson: { stringValue: JSON.stringify(prozessionen) } }), 1000); return () => clearTimeout(t); }, [prozessionen]);
            useEffect(() => { const t = setTimeout(() => syncDoc('notizen', { notizenJson: { stringValue: JSON.stringify(notizen) } }), 1000); return () => clearTimeout(t); }, [notizen]);

            const alleMinis = gruppen.flatMap(g => g.mitglieder).sort();

            // ==========================================
            // MARK: - LOGIK & HELPER
            // ==========================================
            const toggleNeu = (name) => setNeueMessdiener(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const removeMitglied = (groupId, name) => { setGruppen(prev => prev.map(g => g.id === groupId ? { ...g, mitglieder: g.mitglieder.filter(m => m !== name) } : g)); setNeueMessdiener(prev => prev.filter(n => n !== name)); };
            const addMitglied = (groupId, name) => { const c = name.trim(); if (!c) return; setGruppen(prev => prev.map(g => (g.id === groupId && !g.mitglieder.includes(c)) ? { ...g, mitglieder: [...g.mitglieder, c] } : g)); if (statistik[c] === undefined) setStatistik(prev => ({ ...prev, [c]: 0 })); };

            const normalizeTime = (time) => {
                if(!time) return "";
                let clean = time.replace(/h/gi, '').replace(/uhr/gi, '').trim();
                let parts = clean.split(/[:.]/);
                if (parts.length === 2) { return `${parts[0].length === 1 ? `0${parts[0]}` : parts[0]}.${parts[1].length === 1 ? `${parts[1]}0` : (parts[1] === "" ? "00" : parts[1])}`; }
                else if (parts.length === 1 && parts[0] !== "") { return `${parts[0].length === 1 ? `0${parts[0]}` : parts[0]}.00`; }
                return time;
            };

            const parseDateStr = (str) => {
                if (!str) return null; const parts = str.match(/\d+/g); if (!parts || parts.length < 2) return null;
                return new Date(parts.length >= 3 ? parseInt(parts[2]) : new Date().getFullYear(), parseInt(parts[1]) - 1, parseInt(parts[0]));
            };

            const getWeekIdentifier = (dateStr) => {
                const d = parseDateStr(dateStr); if (!d) return crypto.randomUUID();
                const dCopy = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
                dCopy.setUTCDate(dCopy.getUTCDate() + 4 - (dCopy.getUTCDay() || 7));
                const yearStart = new Date(Date.UTC(dCopy.getUTCFullYear(),0,1));
                return `${dCopy.getUTCFullYear()}-${Math.ceil((((dCopy - yearStart) / 86400000) + 1)/7).toString().padStart(2, '0')}`;
            };

            const getChronologischeBloecke = () => {
                let bloecke = []; let currentWeek = null; let currentDienste = [];
                const sorted = [...dienste].sort((a, b) => {
                    const d1 = parseDateStr(a.datum) || new Date(0); const d2 = parseDateStr(b.datum) || new Date(0);
                    if (d1.getTime() === d2.getTime()) return normalizeTime(a.uhrzeit).localeCompare(normalizeTime(b.uhrzeit));
                    return d1 - d2;
                });
                for (let dienst of sorted) {
                    const w = getWeekIdentifier(dienst.datum);
                    if (w !== currentWeek) {
                        if (currentWeek !== null) {
                            let counts = {}; currentDienste.forEach(d => { if (d.gruppe) counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; });
                            bloecke.push({ id: currentWeek, gruppe: Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : "Ohne Gruppe", dienste: currentDienste });
                        }
                        currentWeek = w; currentDienste = [dienst];
                    } else currentDienste.push(dienst);
                }
                if (currentWeek !== null) {
                    let counts = {}; currentDienste.forEach(d => { if (d.gruppe) counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; });
                    bloecke.push({ id: currentWeek, gruppe: Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : "Ohne Gruppe", dienste: currentDienste });
                }
                return bloecke;
            };

            const leseGottesdienste = async () => {
                if (!apiKey) { setFehlerMeldung("Bitte API-Key in den Einstellungen hinterlegen."); return; }
                if (!pdfFile) { setFehlerMeldung("Bitte PDF wählen."); return; }
                setLaedt(true); setFehlerMeldung(null); setLadeStatusText("Lese Datei aus...");
                try {
                    const base64String = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(pdfFile); });
                    setLadeStatusText("KI analysiert Pfarrbrief...");
                    const body = {
                        systemInstruction: { parts: [{ text: "Du bist ein präziser Parser für Pfarrbrief-Daten. Extrahiere Gottesdienste in Thalau. Erlaube Hl. Messe, Taufe, Hochzeit, Beerdigung, Osternacht, Christmette. Gib JSON Array zurück mit datum, wochentag, uhrzeit, anlass, gruppe, minis." }] },
                        contents: [{ parts: [{ text: "Analysiere PDF." }, { inlineData: { mimeType: "application/pdf", data: base64String } }] }],
                        generationConfig: { responseMimeType: "application/json", responseSchema: { type: "ARRAY", items: { type: "OBJECT", properties: { datum: { type: "STRING" }, wochentag: { type: "STRING" }, uhrzeit: { type: "STRING" }, anlass: { type: "STRING" }, gruppe: { type: "STRING" }, minis: { type: "ARRAY", items: { type: "STRING" } } }, required: ["datum", "wochentag", "uhrzeit", "anlass", "minis"] } } }
                    };
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                    const json = await response.json();
                    if (json.error) throw new Error(json.error.message);
                    let rawDienste = JSON.parse(json.candidates[0].content.parts[0].text.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim());
                    
                    let wochenGruppen = {};
                    rawDienste.forEach(d => { if (d.gruppe) wochenGruppen[getWeekIdentifier(d.datum)] = d.gruppe.replace(/Gruppe/i, '').trim(); });
                    let alleWochen = [...new Set(rawDienste.map(d => getWeekIdentifier(d.datum)))].sort();
                    let aktuelleGruppe = nextGroup1 || (gruppen[0]?.name || "A");
                    if (alleWochen.length > 0 && wochenGruppen[alleWochen[0]]) aktuelleGruppe = wochenGruppen[alleWochen[0]];
                    const gruppenNamen = gruppen.map(g => g.name);
                    alleWochen.forEach(woche => {
                        if (wochenGruppen[woche]) aktuelleGruppe = wochenGruppen[woche];
                        wochenGruppen[woche] = aktuelleGruppe;
                        aktuelleGruppe = gruppenNamen[(gruppenNamen.indexOf(aktuelleGruppe) + 1) % gruppenNamen.length];
                    });

                    let bereinigteDienste = [];
                    rawDienste.forEach(raw => {
                        let d = { ...raw, id: crypto.randomUUID(), minis: [], uhrzeit: normalizeTime(raw.uhrzeit || "") };
                        let currentAnlass = d.anlass || "Hl. Messe";
                        let isValid = false;
                        if (["Hl. Messe", "Taufe", "Hochzeit", "Beerdigung", "Osternacht", "Christmette"].includes(currentAnlass)) isValid = true;
                        else {
                            let lower = currentAnlass.toLowerCase();
                            if (lower.includes("taufe")) { currentAnlass = "Taufe"; isValid = true; }
                            else if (lower.includes("hochzeit") || lower.includes("trauung")) { currentAnlass = "Hochzeit"; isValid = true; }
                            else if (lower.includes("beerdigung")) { currentAnlass = "Beerdigung"; isValid = true; }
                            else if (lower.includes("messe") || lower.includes("eucharistie") || lower.includes("hochamt")) { currentAnlass = "Hl. Messe"; isValid = true; }
                            else if (lower.includes("osternacht")) { currentAnlass = "Osternacht"; isValid = true; }
                            else if (lower.includes("christmette")) { currentAnlass = "Christmette"; isValid = true; }
                            else if (lower.includes("gottesdienst")) isValid = true;
                        }
                        if (isValid) {
                            d.anlass = currentAnlass;
                            let wId = getWeekIdentifier(d.datum);
                            if (wochenGruppen[wId]) d.gruppe = wochenGruppen[wId];
                            bereinigteDienste.push(d);
                        }
                    });
                    setDienste(bereinigteDienste); setAppState('review');
                } catch (e) { setFehlerMeldung("KI Fehler: " + e.message); } finally { setLaedt(false); }
            };

            const teileEin = async () => {
                setLaedt(true); setLadeStatusText("Berechne faire Einteilung...");
                setTimeout(() => {
                    let neueDienste = [...dienste];
                    neueDienste.forEach(d => {
                        if(d.minis.length === 0 && !d.manuellerBedarf && !d.manuellerText) {
                            let count = (d.wochentag.toLowerCase().includes('sonntag') || d.wochentag.toLowerCase().includes('feiertag')) ? anzahlSonntags : anzahlWerktags;
                            const match = vormerkungen.find(v => v.datum === d.datum && (normalizeTime(v.uhrzeit) === normalizeTime(d.uhrzeit) || v.uhrzeit === "" || v.uhrzeit === "Ganztägig"));
                            if (match) d.minis = [...match.minis];
                            else {
                                let g = gruppen.find(gr => gr.name === d.gruppe);
                                if (g && g.mitglieder.length > 0) d.minis = [...g.mitglieder].sort(() => 0.5 - Math.random()).slice(0, count);
                                else d.minis = [];
                            }
                        }
                    });
                    setDienste(neueDienste); setAppState('assigned'); setLaedt(false);
                }, 1500);
            };

            const exportierePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                let currentY_mm = 20;
                doc.setFontSize(22); doc.setFont("helvetica", "bold");
                doc.text("Einteilung der Messdiener/innen", 105, currentY_mm, { align: "center" });
                currentY_mm += 15;
                for (const block of getChronologischeBloecke()) {
                    if (currentY_mm + 20 > 280) { doc.addPage(); currentY_mm = 20; }
                    doc.setFontSize(14); doc.setFont("helvetica", "bold");
                    doc.text(`Gruppe ${block.gruppe.replace(/Gruppe/i, '').trim()}`, 105, currentY_mm, { align: "center" });
                    currentY_mm += 8;
                    for (const dienst of block.dienste) {
                        if (currentY_mm + 15 > 280) { doc.addPage(); currentY_mm = 20; }
                        doc.setFontSize(12); doc.setFont("helvetica", "bold");
                        let t = dienst.uhrzeit.replace(/h/i, '').trim(); if(!t.toLowerCase().endsWith("uhr")) t+=" Uhr";
                        doc.text(`${dienst.wochentag} ${dienst.datum} ${dienst.anlass} ${t}`, 20, currentY_mm);
                        currentY_mm += 6;
                        doc.setFont("helvetica", "normal");
                        if (dienst.manuellerText) { doc.text(dienst.manuellerText, 20, currentY_mm); currentY_mm += 6; }
                        else if (dienst.manuellerBedarf) { doc.text(`Es werden ${dienst.manuellerBedarf} benötigt.`, 20, currentY_mm); currentY_mm += 6; }
                        else if (dienst.minis.length === 0) { doc.text("-", 20, currentY_mm); currentY_mm += 6; }
                        else { for (const mini of dienst.minis) { doc.text(mini, 20, currentY_mm); currentY_mm += 6; } }
                        currentY_mm += 4;
                    }
                }
                doc.save("Messdienerplan.pdf");
            };

            const value = {
                route, setRoute, activeTab, setActiveTab, isAppLoading, laedt, setLaedt, ladeStatusText, setLadeStatusText, fehlerMeldung, setFehlerMeldung, appState, setAppState,
                apiKey, setApiKey, geminiModel, setGeminiModel, firebaseProjectId, setFirebaseProjectId,
                anzahlSonntags, setAnzahlSonntags, anzahlWerktags, setAnzahlWerktags,
                gruppen, setGruppen, neueMessdiener, setNeueMessdiener, immerZusammen, setImmerZusammen, nieZusammen, setNieZusammen, statistik, setStatistik,
                dienste, setDienste, vormerkungen, setVormerkungen, regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten, notizen, setNotizen, events, setEvents, prozessionen, setProzessionen,
                customGroupDateRanges, setCustomGroupDateRanges, nextGroup1, setNextGroup1, nextGroup2, setNextGroup2, pdfFile, setPdfFile,
                alleMinis, getChronologischeBloecke, leseGottesdienste, teileEin, resetApp: () => { setAppState('upload'); setDienste([]); setPdfFile(null); }, exportierePDF,
                toggleNeu, removeMitglied, addMitglied, parseDateStr, fetchAllData, syncStatistikToFirebase, firebaseSyncErfolg
            };
            return <ViewModelContext.Provider value={value}>{children}</ViewModelContext.Provider>;
        }

        const useViewModel = () => useContext(ViewModelContext);

        // ==========================================
        // MARK: - APP ROUTER & OVERLAYS
        // ==========================================

        function AdminSetupOverlay() {
            const vm = useViewModel();
            const [proj, setProj] = useState("");
            const [key, setKey] = useState("");

            return (
                <div className="fixed inset-0 z-[100] bg-[#ececec] flex items-center justify-center p-4">
                    <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center relative">
                        <button onClick={() => vm.setRoute('landing')} className="absolute top-6 left-6 text-gray-400 hover:text-gray-800"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                        <i className="fa-solid fa-database text-5xl text-blue-500 mb-6 mt-4"></i>
                        <h2 className="text-2xl font-bold text-gray-900 mb-2">Admin Einrichtung</h2>
                        <p className="text-gray-500 mb-6">Bitte gib die Zugangsdaten für die Datenbank ein.</p>
                        <input type="password" value={proj} onChange={e=>setProj(e.target.value)} placeholder="Firebase Projekt ID..." className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-4 outline-none focus:border-blue-500 text-center" />
                        <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="Gemini API Key..." className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-6 outline-none focus:border-blue-500 text-center" />
                        <button disabled={!proj.trim() || !key.trim()} onClick={() => { vm.setFirebaseProjectId(proj.trim()); vm.setApiKey(key.trim()); }} className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold text-lg py-3 rounded-xl transition">Speichern & Starten</button>
                    </div>
                </div>
            );
        }

        function PfarrbueroSetupOverlay() {
            const vm = useViewModel();
            const [pwd, setPwd] = useState("");

            return (
                <div className="fixed inset-0 z-[100] bg-[#ececec] flex items-center justify-center p-4">
                    <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center relative">
                        <button onClick={() => vm.setRoute('landing')} className="absolute top-6 left-6 text-gray-400 hover:text-gray-800"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                        <i className="fa-solid fa-lock text-5xl text-blue-500 mb-6 mt-4"></i>
                        <h2 className="text-2xl font-bold text-gray-900 mb-2">Zugang gesperrt</h2>
                        <p className="text-gray-500 mb-6">Bitte gib das Zugangspasswort für das Pfarrbüro ein.</p>
                        <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="Passwort..." className="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg mb-6 outline-none focus:border-blue-500 text-center" />
                        <button disabled={!pwd.trim()} onClick={() => vm.setFirebaseProjectId(pwd.trim())} className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold text-lg py-3 rounded-xl transition">Entsperren</button>
                    </div>
                </div>
            );
        }

        function LandingPage() {
            const vm = useViewModel();
            return (
                <div className="flex h-screen w-full items-center justify-center bg-white p-4">
                    <div className="max-w-lg w-full text-center flex flex-col items-center">
                        <img src="Messdiener.png" alt="Logo" className="w-48 h-48 object-contain mb-6 drop-shadow-md rounded-3xl" onError={(e) => { e.target.style.display='none'; }} />
                        <h1 className="text-4xl md:text-5xl font-black text-gray-900 mb-2 tracking-tight">Messdienerplan</h1>
                        <h2 className="text-2xl font-bold text-blue-600 mb-12">Thalau</h2>
                        <div className="w-full space-y-4 px-4">
                            <button onClick={() => vm.setRoute('admin')} className="w-full bg-gray-900 hover:bg-black text-white font-bold text-xl py-4 rounded-2xl shadow-lg transition flex items-center justify-center"><i className="fa-solid fa-desktop mr-3"></i>Planer öffnen</button>
                            <button onClick={() => vm.setRoute('pfarrbuero')} className="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold text-xl py-4 rounded-2xl transition flex items-center justify-center"><i className="fa-solid fa-calendar-check mr-3"></i>Messdiener Vormerken</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- PFARRBÜRO VIEW (Mobil optimiert) ---
        function PfarrbueroView() {
            const vm = useViewModel();
            const [datum, setDatum] = useState(''); const [anlass, setAnlass] = useState(''); const [uhrzeit, setUhrzeit] = useState(''); const [minis, setMinis] = useState([""]);

            const handleSave = () => {
                if(!datum) { alert("Bitte ein Datum eingeben!"); return; }
                const parts = datum.split('-'); let wt = "Sonntag";
                if(parts.length === 3) { const d = new Date(parts[0], parts[1]-1, parts[2]); const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag']; wt = days[d.getDay()]; }
                const formattedDate = parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : datum;
                vm.setVormerkungen([...vm.vormerkungen, { id: crypto.randomUUID(), datum: formattedDate, wochentag: wt, uhrzeit: uhrzeit, anlass: anlass || "Gottesdienst", minis: minis.filter(m => m.trim() !== "") }]);
                alert("Erfolgreich vorgemerkt!"); setDatum(''); setAnlass(''); setUhrzeit(''); setMinis([""]); vm.setRoute('landing');
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    <div className="bg-blue-600 text-white p-4 pt-10 flex items-center shadow-md sticky top-0 z-10">
                        <button onClick={() => vm.setRoute('landing')} className="text-white hover:text-blue-200 p-2"><i className="fa-solid fa-chevron-left text-xl"></i></button>
                        <h1 className="text-xl font-bold ml-4 flex-1">Vormerken (Pfarrbüro)</h1>
                    </div>
                    <div className="p-6 flex-1 max-w-2xl mx-auto w-full">
                        <div className="bg-blue-50 text-blue-800 p-4 rounded-xl mb-8 text-sm leading-relaxed border border-blue-100">
                            <i className="fa-solid fa-circle-info mr-2"></i>
                            Hier können Sie Messdiener eintragen, die sich bereits für einen bestimmten Gottesdienst gemeldet haben.
                        </div>
                        <div className="space-y-6">
                            <div className="ios-card p-5 border border-gray-100"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Datum *</label><input type="date" value={datum} onChange={e => setDatum(e.target.value)} className="w-full text-lg border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent" /></div>
                            <div className="ios-card p-5 border border-gray-100 flex space-x-4"><div className="flex-1"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Uhrzeit</label><input type="text" placeholder="z.B. 09.30" value={uhrzeit} onChange={e => setUhrzeit(e.target.value)} className="w-full text-lg border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent" /></div><div className="flex-1"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Anlass</label><input type="text" placeholder="z.B. Taufe" value={anlass} onChange={e => setAnlass(e.target.value)} className="w-full text-lg border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent" /></div></div>
                            <div className="ios-card p-5 border border-gray-100"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-4">Fest eingeteilte Personen</label>{minis.map((m, i) => <div key={i} className="flex items-center mb-3"><span className="text-gray-400 font-medium mr-3">{i+1}.</span><AutocompleteField value={m} onChange={val => { let nm = [...minis]; nm[i] = val; setMinis(nm); }} suggestions={vm.alleMinis} placeholder="Name suchen..." className="flex-1 border-b border-gray-200 py-2 outline-none focus:border-blue-500 bg-transparent text-lg" /></div>)}<button onClick={() => setMinis([...minis, ""])} className="mt-4 text-blue-600 font-bold flex items-center"><i className="fa-solid fa-circle-plus mr-2"></i>Weitere Person</button></div>
                            <button onClick={handleSave} className="w-full bg-blue-600 active:bg-blue-700 text-white font-bold text-xl py-4 rounded-xl shadow-lg mt-8 mb-10 transition">Vormerkung Speichern</button>
                        </div>
                    </div>
                </div>
            );
        }
        // --- DASHBOARD (MOBILE ONLY) ---
        function AdminDashboard() {
            const vm = useViewModel();
            const tiles = [
                { id: 'planer', label: 'Planer', icon: 'fa-regular fa-file-lines', color: 'bg-blue-500' },
                { id: 'prozessionen', label: 'Prozessionen', icon: 'fa-solid fa-person-walking', color: 'bg-purple-500' },
                { id: 'events', label: 'Events', icon: 'fa-solid fa-champagne-glasses', color: 'bg-pink-500' },
                { id: 'vormerken', label: 'Vormerken', icon: 'fa-regular fa-calendar-check', color: 'bg-green-500' },
                { id: 'statistik', label: 'Statistik', icon: 'fa-solid fa-chart-column', color: 'bg-orange-500' },
                { id: 'notizen', label: 'Notizen', icon: 'fa-regular fa-note-sticky', color: 'bg-yellow-500' },
                { id: 'messdiener', label: 'Gruppen', icon: 'fa-solid fa-user-group', color: 'bg-indigo-500' },
                { id: 'einstellungen', label: 'Optionen', icon: 'fa-solid fa-gear', color: 'bg-gray-500' },
                { id: 'werkzeuge', label: 'Tools', icon: 'fa-solid fa-screwdriver-wrench', color: 'bg-teal-500' }
            ];

            return (
                <div className="min-h-screen bg-[#f2f2f7] p-6 pb-12 flex flex-col antialiased">
                    <div className="flex justify-between items-end mb-8 pt-8">
                        <h1 className="text-4xl font-black text-gray-900 tracking-tight">Übersicht</h1>
                        {/* Abmelden-Button setzt die Route wieder auf Landing zurück, falls man das Gerät wechseln will */}
                        <button onClick={() => { vm.setRoute('landing'); vm.setAdminPassword(''); }} className="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-bold text-red-500 border border-gray-200">
                            <i className="fa-solid fa-power-off mr-2"></i>Abmelden
                        </button>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {tiles.map(t => (
                            <div key={t.id} onClick={() => vm.setActiveTab(t.id)} className="ios-card p-6 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform">
                                <div className={`w-14 h-14 ${t.color} text-white rounded-full flex items-center justify-center text-2xl mb-3 shadow-md`}>
                                    <i className={t.icon}></i>
                                </div>
                                <span className="font-bold text-gray-800 text-[15px]">{t.label}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- APP CONTROLLER (Admin) ---
        function AdminApp() {
            const vm = useViewModel();
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Mobile Ansicht: Zeigt das Dashboard, wenn "menu" aktiv ist
            if (isMobile && (!vm.activeTab || vm.activeTab === 'menu')) {
                return <AdminDashboard />;
            }

            return (
                <div className="flex h-screen w-full bg-macBg text-[#1d1d1f] antialiased">
                    {!isMobile && <Sidebar/>}
                    <div className="flex-1 flex flex-col bg-white overflow-hidden shadow-[-4px_0_15px_rgba(0,0,0,0.05)] z-10 relative">
                        {vm.activeTab === 'planer' && <PlanerView/>}
                        {vm.activeTab === 'prozessionen' && <ProzessionenView/>}
                        {vm.activeTab === 'events' && <EventsView/>}
                        {vm.activeTab === 'vormerken' && <VormerkenView/>}
                        {vm.activeTab === 'statistik' && <StatistikView/>}
                        {vm.activeTab === 'notizen' && <NotizenView/>}
                        {vm.activeTab === 'werkzeuge' && <WerkzeugeView/>}
                        {vm.activeTab === 'messdiener' && <MessdienerView/>}
                        {vm.activeTab === 'einstellungen' && <EinstellungenView/>}
                    </div>
                </div>
            );
        }

        // --- HAUPT-ROUTING ---
        function App() {
            const vm = useViewModel();

            if (vm.isAppLoading) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-white flex-col space-y-6">
                        <i className="fa-solid fa-cloud text-blue-500 text-7xl animate-bounce"></i>
                        <h2 className="text-3xl font-bold text-gray-800 mb-2">Lade Daten...</h2>
                    </div>
                );
            }

            // Wenn der Nutzer den "Admin"-Pfad gewählt hat (und eingeloggt ist)
            if (vm.route === 'admin') {
                // Das Setup-Overlay wird NUR im Admin-Bereich gezeigt und nur wenn die Daten noch fehlen
                if (!vm.apiKey || !vm.firebaseProjectId) return <AdminSetupOverlay />;
                return <AdminApp />;
            }

            // Wenn der Nutzer den "Pfarrbüro"-Pfad gewählt hat
            if (vm.route === 'pfarrbuero') return <PfarrbueroView />;
            
            // Standard: Startseite / Landing Page
            return <LandingPage />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ViewModelProvider><App/></ViewModelProvider>);
    </script>
</body>
</html>
