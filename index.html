<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messdiener Planer</title>
    
    <!-- Tailwind CSS für das Mac-Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macBg: '#ececec',
                        macSidebar: '#f5f5f5',
                        macActive: '#007aff',
                        macText: '#1d1d1f'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Icons (als Ersatz für SF Symbols) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (Übersetzt den JSX/React Code im Browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- jsPDF für PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { 
            overflow: hidden; 
            margin: 0; 
            background-color: #ececec; 
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
        input:focus, select:focus, textarea:focus, button:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- MARK: - React App Logic -->
    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useCallback } = React;

        // --- HILFSFUNKTIONEN (@AppStorage) ---
        function useAppStorage(key, initialValue) {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            useEffect(() => {
                window.localStorage.setItem(key, JSON.stringify(state));
            }, [key, state]);

            return [state, setState];
        }

        // --- VIEWMODEL PROVIDER ---
        const ViewModelContext = createContext();

        function ViewModelProvider({ children }) {
            const [activeTab, setActiveTab] = useState('planer');
            const [isAppLoading, setIsAppLoading] = useState(true);
            const [appState, setAppState] = useAppStorage('appStateRaw', 'upload'); 
            const [laedt, setLaedt] = useState(false);
            const [ladeStatusText, setLadeStatusText] = useState("");
            const [fehlerMeldung, setFehlerMeldung] = useState(null);
            
            // Konfiguration
            const [apiKey, setApiKey] = useAppStorage('geminiApiKey', '');
            const [geminiModel, setGeminiModel] = useAppStorage('geminiModel', 'gemini-3.6-flash');
            const [firebaseProjectId, setFirebaseProjectId] = useAppStorage('firebaseProjectId', '');
            const [csvTabelleUrl, setCsvTabelleUrl] = useAppStorage('csvTabelleUrl', '');
            const [iCalUrl, setICalUrl] = useAppStorage('iCalUrl', '');
            
            const [anzahlSonntags, setAnzahlSonntags] = useAppStorage('anzahlSonntags', 4);
            const [anzahlWerktags, setAnzahlWerktags] = useAppStorage('anzahlWerktags', 2);
            const [openWhatsAppOnExport, setOpenWhatsAppOnExport] = useAppStorage('openWhatsAppOnExport', false);
            
            const [pdfGrauerText, setPdfGrauerText] = useAppStorage('pdfGrauerText', 'Wer eingeteilt ist und nicht dienen kann, sucht sich bitte selbstständig eine Vertretung!');
            const [pdfFooterUeberschrift, setPdfFooterUeberschrift] = useAppStorage('pdfFooterUeberschrift', 'Abwesenheiten eintragen');
            const [pdfFooterTextSuffix, setPdfFooterTextSuffix] = useAppStorage('pdfFooterTextV2', 'Wenn Abwesenheiten jetzt schon bekannt sind, trage sie ganz einfach online ein.');
            const [pdfLinkUrl, setPdfLinkUrl] = useAppStorage('pdfLinkUrl', 'https://forms.gle/nSzhoDgeAhUS4QG16');

            // Daten
            const [gruppen, setGruppen] = useAppStorage('gruppenDaten', [
                { id: crypto.randomUUID(), name: "A", mitglieder: [] },
                { id: crypto.randomUUID(), name: "B", mitglieder: [] },
                { id: crypto.randomUUID(), name: "C", mitglieder: [] }
            ]);
            const [neueMessdiener, setNeueMessdiener] = useAppStorage('neueMessdienerData', []);
            const [immerZusammen, setImmerZusammen] = useAppStorage('immerZusammenData', []);
            const [nieZusammen, setNieZusammen] = useAppStorage('nieZusammenData', []);
            const [statistik, setStatistik] = useAppStorage('statistikDaten', {});
            
            const [dienste, setDienste] = useAppStorage('diensteData', []);
            const [vormerkungen, setVormerkungen] = useAppStorage('vormerkungenData', []);
            const [regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten] = useAppStorage('regelmaessigeAbwesenheitenData', []);
            const [newsItems, setNewsItems] = useAppStorage('newsItemsData', []);
            const [notizen, setNotizen] = useAppStorage('notizenData', []);
            const [events, setEvents] = useAppStorage('eventsData', []);
            const [deletedEvents, setDeletedEvents] = useAppStorage('deletedEventsData', []);
            const [prozessionen, setProzessionen] = useAppStorage('prozessionenData', []);
            
            const [customGroupDateRanges, setCustomGroupDateRanges] = useAppStorage('customGroupDateRangesData', {});
            const [nextGroup1, setNextGroup1] = useAppStorage('nextGroup1', '');
            const [nextGroup2, setNextGroup2] = useAppStorage('nextGroup2', '');

            const [pdfFile, setPdfFile] = useState(null);
            const [firebaseSyncErfolg, setFirebaseSyncErfolg] = useState(false);

            // ==========================================
            // MARK: - FIREBASE REST API INTEGRATION
            // ==========================================
            const getFbUrl = (docName) => `https://firestore.googleapis.com/v1/projects/${firebaseProjectId.trim()}/databases/(default)/documents/messdiener/${docName}`;

            // 1. STATISTIK
            const fetchStatistikFromFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const res = await fetch(getFbUrl('statistik'));
                    const data = await res.json();
                    if (data.fields) {
                        let newStat = {};
                        for (const [key, val] of Object.entries(data.fields)) newStat[key] = parseInt(val.integerValue);
                        setStatistik(newStat);
                    }
                } catch (e) {}
            };
            const syncStatistikToFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                let fields = {};
                for (const [key, val] of Object.entries(statistik)) fields[key] = { integerValue: String(val) };
                try {
                    const res = await fetch(getFbUrl('statistik'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) });
                    if (res.ok) { setFirebaseSyncErfolg(true); setTimeout(() => setFirebaseSyncErfolg(false), 3000); }
                } catch (e) {}
            };

            // 2. GRUPPEN & NEUE
            const fetchGruppenFromFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const res = await fetch(getFbUrl('gruppen'));
                    const data = await res.json();
                    if (data.fields) {
                        if (data.fields.gruppenJson) setGruppen(JSON.parse(data.fields.gruppenJson.stringValue));
                        if (data.fields.neueMessdienerJson) setNeueMessdiener(JSON.parse(data.fields.neueMessdienerJson.stringValue));
                    }
                } catch (e) {}
            };
            const syncGruppenToFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                const payload = { fields: { gruppenJson: { stringValue: JSON.stringify(gruppen) }, neueMessdienerJson: { stringValue: JSON.stringify(neueMessdiener) } } };
                await fetch(getFbUrl('gruppen'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            };

            // 3. REGELN
            const fetchRegelnFromFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const res = await fetch(getFbUrl('regeln'));
                    const data = await res.json();
                    if (data.fields) {
                        if (data.fields.immerZusammenJson) setImmerZusammen(JSON.parse(data.fields.immerZusammenJson.stringValue));
                        if (data.fields.nieZusammenJson) setNieZusammen(JSON.parse(data.fields.nieZusammenJson.stringValue));
                    }
                } catch (e) {}
            };
            const syncRegelnToFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                const payload = { fields: { immerZusammenJson: { stringValue: JSON.stringify(immerZusammen) }, nieZusammenJson: { stringValue: JSON.stringify(nieZusammen) } } };
                await fetch(getFbUrl('regeln'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            };

            // 4. VORMERKUNGEN & REGELMÄSSIGE ABWESENHEITEN
            const fetchVormerkungenFromFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const res = await fetch(getFbUrl('vormerkungen'));
                    const data = await res.json();
                    if (data.fields) {
                        if (data.fields.vormerkungenJson) setVormerkungen(JSON.parse(data.fields.vormerkungenJson.stringValue));
                        if (data.fields.regelmaessigeAbwesenheitenJson) setRegelmaessigeAbwesenheiten(JSON.parse(data.fields.regelmaessigeAbwesenheitenJson.stringValue));
                    }
                } catch (e) {}
            };
            const syncVormerkungenToFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                const payload = { fields: { vormerkungenJson: { stringValue: JSON.stringify(vormerkungen) }, regelmaessigeAbwesenheitenJson: { stringValue: JSON.stringify(regelmaessigeAbwesenheiten) } } };
                await fetch(getFbUrl('vormerkungen'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            };

            // 5. EVENTS
            const fetchEventsFromFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const res = await fetch(getFbUrl('events'));
                    const data = await res.json();
                    if (data.fields) {
                        if (data.fields.eventsJson) setEvents(JSON.parse(data.fields.eventsJson.stringValue));
                        if (data.fields.deletedEventsJson) setDeletedEvents(JSON.parse(data.fields.deletedEventsJson.stringValue));
                    }
                } catch (e) {}
            };
            const syncEventsToFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                const payload = { fields: { eventsJson: { stringValue: JSON.stringify(events) }, deletedEventsJson: { stringValue: JSON.stringify(deletedEvents) } } };
                await fetch(getFbUrl('events'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            };

            // 6. PROZESSIONEN
            const fetchProzessionenFromFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const res = await fetch(getFbUrl('prozessionen'));
                    const data = await res.json();
                    if (data.fields && data.fields.prozessionenJson) {
                        setProzessionen(JSON.parse(data.fields.prozessionenJson.stringValue));
                    }
                } catch (e) {}
            };
            const syncProzessionenToFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                const payload = { fields: { prozessionenJson: { stringValue: JSON.stringify(prozessionen) } } };
                await fetch(getFbUrl('prozessionen'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            };

            // 7. NOTIZEN
            const fetchNotizenFromFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                try {
                    const res = await fetch(getFbUrl('notizen'));
                    const data = await res.json();
                    if (data.fields && data.fields.notizenJson) {
                        setNotizen(JSON.parse(data.fields.notizenJson.stringValue));
                    }
                } catch (e) {}
            };
            const syncNotizenToFirebase = async () => {
                if (!firebaseProjectId.trim()) return;
                const payload = { fields: { notizenJson: { stringValue: JSON.stringify(notizen) } } };
                await fetch(getFbUrl('notizen'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            };

            // Auto-Sync Hooks (Debounced)
            useEffect(() => { const t = setTimeout(() => syncGruppenToFirebase(), 1000); return () => clearTimeout(t); }, [gruppen, neueMessdiener]);
            useEffect(() => { const t = setTimeout(() => syncRegelnToFirebase(), 1000); return () => clearTimeout(t); }, [immerZusammen, nieZusammen]);
            useEffect(() => { const t = setTimeout(() => syncVormerkungenToFirebase(), 1000); return () => clearTimeout(t); }, [vormerkungen, regelmaessigeAbwesenheiten]);
            useEffect(() => { const t = setTimeout(() => syncEventsToFirebase(), 1000); return () => clearTimeout(t); }, [events, deletedEvents]);
            useEffect(() => { const t = setTimeout(() => syncProzessionenToFirebase(), 1000); return () => clearTimeout(t); }, [prozessionen]);
            useEffect(() => { const t = setTimeout(() => syncNotizenToFirebase(), 1000); return () => clearTimeout(t); }, [notizen]);

            // Initiale Lade-Simulation & Fetch
            useEffect(() => {
                const loadAll = async () => {
                    await fetchStatistikFromFirebase();
                    await fetchGruppenFromFirebase();
                    await fetchRegelnFromFirebase();
                    await fetchVormerkungenFromFirebase();
                    await fetchEventsFromFirebase();
                    await fetchProzessionenFromFirebase();
                    await fetchNotizenFromFirebase();
                    setTimeout(() => setIsAppLoading(false), 500); 
                };
                if(firebaseProjectId) loadAll();
                else setTimeout(() => setIsAppLoading(false), 800); 
            }, [firebaseProjectId]);

            // ==========================================
            // MARK: - LOGIK & HELPER
            // ==========================================

            const toggleNeu = (name) => {
                setNeueMessdiener(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            };
            const removeMitglied = (groupId, name) => {
                setGruppen(prev => prev.map(g => g.id === groupId ? { ...g, mitglieder: g.mitglieder.filter(m => m !== name) } : g));
                setNeueMessdiener(prev => prev.filter(n => n !== name));
            };
            const addMitglied = (groupId, name) => {
                const clean = name.trim();
                if (!clean) return;
                setGruppen(prev => prev.map(g => (g.id === groupId && !g.mitglieder.includes(clean)) ? { ...g, mitglieder: [...g.mitglieder, clean] } : g));
                if (statistik[clean] === undefined) setStatistik(prev => ({ ...prev, [clean]: 0 }));
            };

            const normalizeTime = (time) => {
                if(!time) return "";
                let clean = time.replace(/h/gi, '').replace(/uhr/gi, '').trim();
                let parts = clean.split(/[:.]/);
                if (parts.length === 2) {
                    let h = parts[0].length === 1 ? `0${parts[0]}` : parts[0];
                    let m = parts[1].length === 1 ? `${parts[1]}0` : (parts[1] === "" ? "00" : parts[1]);
                    return `${h}.${m}`;
                } else if (parts.length === 1 && parts[0] !== "") {
                    let h = parts[0].length === 1 ? `0${parts[0]}` : parts[0];
                    return `${h}.00`;
                }
                return time;
            };

            const parseDateStr = (str) => {
                if (!str) return null;
                const parts = str.match(/\d+/g);
                if (!parts || parts.length < 2) return null;
                const d = parseInt(parts[0]);
                const m = parseInt(parts[1]) - 1;
                const y = parts.length >= 3 ? parseInt(parts[2]) : new Date().getFullYear();
                return new Date(y, m, d);
            };

            const getWeekIdentifier = (dateStr) => {
                const d = parseDateStr(dateStr);
                if (!d) return crypto.randomUUID();
                const dCopy = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
                const dayNum = dCopy.getUTCDay() || 7;
                dCopy.setUTCDate(dCopy.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(dCopy.getUTCFullYear(),0,1));
                const weekNo = Math.ceil((((dCopy - yearStart) / 86400000) + 1)/7);
                return `${dCopy.getUTCFullYear()}-${weekNo.toString().padStart(2, '0')}`;
            };

            const getChronologischeBloecke = () => {
                let bloecke = [];
                let currentWeek = null;
                let currentDienste = [];
                
                const sorted = [...dienste].sort((a, b) => {
                    const d1 = parseDateStr(a.datum) || new Date(0);
                    const d2 = parseDateStr(b.datum) || new Date(0);
                    if (d1.getTime() === d2.getTime()) return normalizeTime(a.uhrzeit).localeCompare(normalizeTime(b.uhrzeit));
                    return d1 - d2;
                });

                for (let dienst of sorted) {
                    const w = getWeekIdentifier(dienst.datum);
                    if (w !== currentWeek) {
                        if (currentWeek !== null) {
                            let counts = {};
                            currentDienste.forEach(d => { if (d.gruppe) counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; });
                            let domGroup = Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : "Ohne Gruppe";
                            bloecke.push({ id: currentWeek, gruppe: domGroup, dienste: currentDienste });
                        }
                        currentWeek = w;
                        currentDienste = [dienst];
                    } else {
                        currentDienste.push(dienst);
                    }
                }
                if (currentWeek !== null) {
                    let counts = {};
                    currentDienste.forEach(d => { if (d.gruppe) counts[d.gruppe] = (counts[d.gruppe] || 0) + 1; });
                    let domGroup = Object.keys(counts).length ? Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b) : "Ohne Gruppe";
                    bloecke.push({ id: currentWeek, gruppe: domGroup, dienste: currentDienste });
                }
                return bloecke;
            };

            const leseGottesdienste = async () => {
                if (!apiKey) { setFehlerMeldung("Bitte hinterlege deinen Gemini API-Key in den Einstellungen."); return; }
                if (!pdfFile) { setFehlerMeldung("Bitte wähle eine PDF aus."); return; }
                setLaedt(true); setFehlerMeldung(null); setLadeStatusText("Lese Datei aus...");
                try {
                    const base64String = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(pdfFile);
                    });
                    setLadeStatusText("KI analysiert Pfarrbrief...");
                    const systemInstruction = `Du bist ein präziser Parser für Pfarrbrief-Daten. WICHTIGE REGELN:
1. ORT: Extrahiere AUSSCHLIESSLICH Gottesdienste, die im Ort "Thalau" stattfinden! Ignoriere alles aus "Schmalnau" oder anderen Orten.
2. ANLASS: Akzeptiere "Hl. Messe", "Taufe", "Hochzeit", "Trauung", "Beerdigung", "Osternacht", "Christmette" sowie alle Termine, die das Wort "Gottesdienst" enthalten. Ignoriere strikt Dinge wie "Rosenkranz", "Andacht", "Krankenkommunion".
3. GRUPPEN: Suche im Text nach der Gruppeneinteilung für Thalau (z.B. "Thalau Gruppe C") und weise diesen Buchstaben dem Feld 'gruppe' zu.
4. Gib das Ergebnis strikt im geforderten JSON-Format zurück. Fasse lange Anlässe kurz zusammen.`;
                    const body = {
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        contents: [{
                            parts: [
                                { text: "Analysiere das angehängte Dokument und extrahiere Gottesdienste gemäß den Regeln." },
                                { inlineData: { mimeType: "application/pdf", data: base64String } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        datum: { type: "STRING" },
                                        wochentag: { type: "STRING" },
                                        uhrzeit: { type: "STRING" },
                                        anlass: { type: "STRING" },
                                        gruppe: { type: "STRING" },
                                        minis: { type: "ARRAY", items: { type: "STRING" } }
                                    },
                                    required: ["datum", "wochentag", "uhrzeit", "anlass", "minis"]
                                }
                            }
                        }
                    };
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`, {
                        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
                    });
                    const json = await response.json();
                    if (json.error) throw new Error(json.error.message);
                    const textResponse = json.candidates[0].content.parts[0].text;
                    let cleanJsonString = textResponse.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
                    let rawDienste = JSON.parse(cleanJsonString);
                    let wochenGruppen = {};
                    rawDienste.forEach(d => { if (d.gruppe) wochenGruppen[getWeekIdentifier(d.datum)] = d.gruppe.replace(/Gruppe/i, '').trim(); });
                    let alleWochen = [...new Set(rawDienste.map(d => getWeekIdentifier(d.datum)))].sort();
                    let aktuelleGruppe = nextGroup1 || (gruppen[0]?.name || "A");
                    if (alleWochen.length > 0 && wochenGruppen[alleWochen[0]]) aktuelleGruppe = wochenGruppen[alleWochen[0]];
                    const gruppenNamen = gruppen.map(g => g.name);
                    alleWochen.forEach(woche => {
                        if (wochenGruppen[woche]) aktuelleGruppe = wochenGruppen[woche];
                        wochenGruppen[woche] = aktuelleGruppe;
                        let nextIdx = (gruppenNamen.indexOf(aktuelleGruppe) + 1) % gruppenNamen.length;
                        aktuelleGruppe = gruppenNamen[nextIdx];
                    });
                    const erlaubteAnlaesse = ["Hl. Messe", "Taufe", "Hochzeit", "Beerdigung", "Osternacht", "Christmette"];
                    let bereinigteDienste = [];
                    rawDienste.forEach(raw => {
                        let d = { ...raw, id: crypto.randomUUID(), minis: [], uhrzeit: normalizeTime(raw.uhrzeit || "") };
                        let currentAnlass = d.anlass || "Hl. Messe";
                        let isValid = false;
                        if (erlaubteAnlaesse.includes(currentAnlass)) isValid = true;
                        else {
                            let lower = currentAnlass.toLowerCase();
                            if (lower.includes("taufe")) { currentAnlass = "Taufe"; isValid = true; }
                            else if (lower.includes("hochzeit") || lower.includes("trauung")) { currentAnlass = "Hochzeit"; isValid = true; }
                            else if (lower.includes("beerdigung")) { currentAnlass = "Beerdigung"; isValid = true; }
                            else if (lower.includes("messe") || lower.includes("eucharistie") || lower.includes("hochamt")) { currentAnlass = "Hl. Messe"; isValid = true; }
                            else if (lower.includes("osternacht")) { currentAnlass = "Osternacht"; isValid = true; }
                            else if (lower.includes("christmette")) { currentAnlass = "Christmette"; isValid = true; }
                            else if (lower.includes("gottesdienst")) isValid = true;
                        }
                        if (isValid) {
                            d.anlass = currentAnlass;
                            let wId = getWeekIdentifier(d.datum);
                            if (wochenGruppen[wId]) d.gruppe = wochenGruppen[wId];
                            bereinigteDienste.push(d);
                        }
                    });
                    setDienste(bereinigteDienste);
                    setAppState('review');
                } catch (e) { setFehlerMeldung("KI Fehler: " + e.message); } 
                finally { setLaedt(false); }
            };

            const teileEin = async () => {
                setLaedt(true); setLadeStatusText("Berechne faire Einteilung...");
                setTimeout(() => {
                    let neueDienste = [...dienste];
                    neueDienste.forEach(d => {
                        if(d.minis.length === 0 && !d.manuellerBedarf && !d.manuellerText) {
                            let woche = d.wochentag.toLowerCase();
                            let count = (woche.includes('sonntag') || woche.includes('feiertag')) ? anzahlSonntags : anzahlWerktags;
                            
                            // Check for Vormerkungen first
                            const match = vormerkungen.find(v => v.datum === d.datum && (normalizeTime(v.uhrzeit) === normalizeTime(d.uhrzeit) || v.uhrzeit === "" || v.uhrzeit === "Ganztägig"));
                            if (match) {
                                d.minis = [...match.minis];
                            } else {
                                let g = gruppen.find(gr => gr.name === d.gruppe);
                                if (g && g.mitglieder.length > 0) {
                                    d.minis = [...g.mitglieder].sort(() => 0.5 - Math.random()).slice(0, count);
                                } else {
                                    d.minis = [];
                                }
                            }
                        }
                    });
                    setDienste(neueDienste);
                    setAppState('assigned');
                    setLaedt(false);
                }, 1500);
            };

            const resetApp = () => {
                setAppState('upload');
                setDienste([]);
                setPdfFile(null);
            };

            // PDF EXPORT (jsPDF)
            const exportierePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                
                let currentY_mm = 15;
                const pageWidth = 210; // A4 width in mm
                
                const checkPageBreak = (required_mm) => {
                    if (currentY_mm + required_mm > 280) {
                        doc.addPage();
                        currentY_mm = 20;
                    }
                };

                // Title
                doc.setFontSize(22);
                doc.setFont("helvetica", "bold");
                doc.text("Einteilung der Messdiener/innen", pageWidth/2, currentY_mm, { align: "center" });
                currentY_mm += 15;

                const bloecke = getChronologischeBloecke();
                
                for (const block of bloecke) {
                    const timeRange = customGroupDateRanges[block.id] || "Woche " + block.id;
                    const cleanGruppe = block.gruppe.replace(/Gruppe/i, '').trim();
                    
                    checkPageBreak(20);
                    doc.setFontSize(14);
                    doc.setFont("helvetica", "bold");
                    doc.text(`Gruppe ${cleanGruppe}: ${timeRange}`, pageWidth/2, currentY_mm, { align: "center" });
                    currentY_mm += 8;
                    
                    for (const dienst of block.dienste) {
                        const requiredH = 8 + (Math.max(dienst.minis.length, 1) * 6) + 6;
                        checkPageBreak(requiredH);
                        
                        let cleanUhrzeit = dienst.uhrzeit.replace(/h/i, '').trim();
                        if (!cleanUhrzeit.toLowerCase().endsWith("uhr")) cleanUhrzeit += " Uhr";
                        
                        doc.setFontSize(12);
                        doc.setFont("helvetica", "bold");
                        doc.text(`${dienst.wochentag} ${dienst.datum} ${dienst.anlass} ${cleanUhrzeit}`, 20, currentY_mm);
                        currentY_mm += 6;
                        
                        doc.setFont("helvetica", "normal");
                        if (dienst.manuellerText) {
                            doc.text(dienst.manuellerText, 20, currentY_mm);
                            currentY_mm += 6;
                        } else if (dienst.manuellerBedarf) {
                            doc.text(`Es werden ${dienst.manuellerBedarf} Messdiener/innen benötigt.`, 20, currentY_mm);
                            currentY_mm += 6;
                        } else if (dienst.minis.length === 0) {
                            doc.text("-", 20, currentY_mm);
                            currentY_mm += 6;
                        } else {
                            for (const mini of dienst.minis) {
                                doc.text(mini, 20, currentY_mm);
                                currentY_mm += 6;
                            }
                        }
                        currentY_mm += 4;
                    }
                }
                
                // Footer
                currentY_mm += 10;
                checkPageBreak(40);
                
                doc.setFontSize(11);
                doc.setFont("helvetica", "bold");
                const splitGrau = doc.splitTextToSize(pdfGrauerText, 170);
                doc.text(splitGrau, 20, currentY_mm);
                currentY_mm += (splitGrau.length * 5) + 10;
                
                // Grau hinterlegte Box
                doc.setFillColor(245, 245, 245);
                doc.roundedRect(20, currentY_mm, 170, 30, 3, 3, "F");
                
                doc.setFontSize(12);
                doc.text(pdfFooterUeberschrift, pageWidth/2, currentY_mm + 8, { align: "center" });
                
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                const cleanG1 = nextGroup1.replace(/Gruppe/i, '').trim();
                const cleanG2 = nextGroup2.replace(/Gruppe/i, '').trim();
                const vollerDynText = `In den kommenden zwei Wochen sind Gruppe ${cleanG1} und ${cleanG2} dran. ${pdfFooterTextSuffix}`;
                const splitDyn = doc.splitTextToSize(vollerDynText, 150);
                doc.text(splitDyn, pageWidth/2, currentY_mm + 15, { align: "center" });
                
                doc.save("Messdienerplan.pdf");
            };

            const exportiereGruppenPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                let currentY_mm = 20;
                const pageWidth = 210;

                doc.setFontSize(20);
                doc.setFont("helvetica", "bold");
                doc.text("Übersicht: Alle Messdiener-Gruppen", pageWidth/2, currentY_mm, { align: "center" });
                currentY_mm += 15;

                for (const gruppe of gruppen) {
                    if (currentY_mm + 15 > 280) { doc.addPage(); currentY_mm = 20; }
                    doc.setFontSize(16);
                    doc.setFont("helvetica", "bold");
                    doc.text(`Gruppe ${gruppe.name}`, 20, currentY_mm);
                    currentY_mm += 8;
                    
                    doc.setFontSize(12);
                    doc.setFont("helvetica", "normal");
                    for (const mini of gruppe.mitglieder) {
                        if (currentY_mm + 6 > 280) { doc.addPage(); currentY_mm = 20; }
                        const prefix = neueMessdiener.includes(mini) ? "* " : "• ";
                        doc.text(`${prefix}${mini}`, 25, currentY_mm);
                        currentY_mm += 6;
                    }
                    currentY_mm += 8;
                }
                doc.save("Gruppenliste.pdf");
            };

            const value = {
                activeTab, setActiveTab,
                isAppLoading, laedt, ladeStatusText, fehlerMeldung, setFehlerMeldung,
                appState, setAppState,
                apiKey, setApiKey, geminiModel, setGeminiModel, firebaseProjectId, setFirebaseProjectId, csvTabelleUrl, setCsvTabelleUrl, iCalUrl, setICalUrl,
                anzahlSonntags, setAnzahlSonntags, anzahlWerktags, setAnzahlWerktags, openWhatsAppOnExport, setOpenWhatsAppOnExport,
                pdfGrauerText, setPdfGrauerText, pdfFooterUeberschrift, setPdfFooterUeberschrift, pdfFooterTextSuffix, setPdfFooterTextSuffix, pdfLinkUrl, setPdfLinkUrl,
                gruppen, setGruppen, toggleNeu, neueMessdiener, removeMitglied, addMitglied, immerZusammen, setImmerZusammen, nieZusammen, setNieZusammen, statistik, setStatistik,
                dienste, setDienste, vormerkungen, setVormerkungen, regelmaessigeAbwesenheiten, setRegelmaessigeAbwesenheiten, newsItems, setNewsItems, notizen, setNotizen,
                events, setEvents, prozessionen, setProzessionen,
                customGroupDateRanges, setCustomGroupDateRanges, nextGroup1, setNextGroup1, nextGroup2, setNextGroup2,
                pdfFile, setPdfFile, leseGottesdienste, teileEin, resetApp, getChronologischeBloecke,
                fetchStatistikFromFirebase, syncStatistikToFirebase, firebaseSyncErfolg,
                exportierePDF, exportiereGruppenPDF, normalizeTime, parseDateStr
            };

            return <ViewModelContext.Provider value={value}>{children}</ViewModelContext.Provider>;
        }

        // --- WERKZEUGE VIEW ---
        function WerkzeugeView() {
            const vm = useViewModel();
            const [kopiert, setKopiert] = useState(false);
            const [kiLoading, setKiLoading] = useState(false);
            
            const handleCopy = () => {
                const alle = vm.gruppen.flatMap(g => g.mitglieder).sort().join("\n");
                navigator.clipboard.writeText(alle);
                setKopiert(true); setTimeout(() => setKopiert(false), 2000);
            };

            const handleKiImport = async () => {
                if(!vm.apiKey) { alert("Bitte erst den Gemini API Key in den Einstellungen hinterlegen!"); return; }
                try {
                    const text = await navigator.clipboard.readText();
                    if(!text) { alert("Zwischenablage ist leer!"); return; }
                    if(confirm("Deine aktuellen Gruppen werden durch die Daten aus der Zwischenablage ersetzt. Statistik bleibt erhalten. Fortfahren?")) {
                        setKiLoading(true);
                        
                        const promptText = `Du bist ein Daten-Extraktor. Lies den folgenden Text und erstelle daraus Gruppen von Messdienern. TEXT: ${text}
                        REGELN: 1. Finde alle Gruppen-Namen. 2. Ordne die Vor- und Nachnamen der Gruppe zu. 3. Ignoriere unnötige Informationen. Extrahiere NUR "Vorname Nachname".`;
                        
                        const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){vm.geminiModel}:generateContent?key=${vm.apiKey}`, {
                            method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: promptText }] }],
                                generationConfig: {
                                    responseMimeType: "application/json",
                                    responseSchema: {
                                        type: "ARRAY", items: { type: "OBJECT", properties: { name: { type: "STRING" }, mitglieder: { type: "ARRAY", items: { type: "STRING" } } }, required: ["name", "mitglieder"] }
                                    }
                                }
                            })
                        });
                        const json = await response.json();
                        let cleanJsonString = json.candidates[0].content.parts[0].text.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
                        const importierteGruppen = JSON.parse(cleanJsonString);
                        
                        const neueGruppen = importierteGruppen.map(g => ({ id: crypto.randomUUID(), name: g.name, mitglieder: g.mitglieder }));
                        vm.setGruppen(neueGruppen);
                        
                        let newStat = {...vm.statistik};
                        neueGruppen.forEach(g => g.mitglieder.forEach(m => { if(newStat[m] === undefined) newStat[m] = 0; }));
                        vm.setStatistik(newStat);
                        alert("Gruppen erfolgreich per KI importiert!");
                    }
                } catch(e) { alert("Fehler beim KI Import: " + e.message); } finally { setKiLoading(false); }
            };

            const ToolBox = ({ icon, title, desc, btnText, btnIcon, onClick, colorClass, btnClass, loading }) => (
                <div className="bg-white rounded-xl border border-gray-200 p-6 shadow-sm mb-6 flex flex-col justify-between">
                    <div>
                        <div className="flex items-center space-x-3 mb-2"><i className={`${icon} ${colorClass} text-2xl w-8 text-center`}></i><h2 className="text-xl font-bold text-gray-800">{title}</h2></div>
                        <p className="text-gray-500 mb-5 ml-11">{desc}</p>
                    </div>
                    <div className="ml-11">
                        <button onClick={onClick} disabled={loading} className={`${btnClass} px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition flex items-center disabled:opacity-50`}>
                            {loading ? <i className="fa-solid fa-circle-notch fa-spin mr-2"></i> : <i className={`${btnIcon} mr-2`}></i>}{loading ? "Verarbeite..." : btnText}
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="h-full overflow-y-auto p-10 bg-gray-50/50">
                    <div className="max-w-3xl">
                        <div className="mb-8"><h1 className="text-3xl font-bold text-gray-900">Werkzeuge</h1><p className="text-gray-500 text-lg mt-1">Nützliche Tools für den Messdiener-Alltag.</p></div>
                        <hr className="mb-8 border-gray-200" />
                        <ToolBox icon="fa-solid fa-copy" colorClass="text-blue-500" title="Alle Messdiener als Text kopieren" desc="Kopiert alle angelegten Messdiener (ohne Gruppen-Zuordnung) als einfache Textliste in die Zwischenablage." btnText={kopiert ? "Erfolgreich kopiert!" : "Namen kopieren"} btnIcon={kopiert ? "fa-solid fa-check" : "fa-solid fa-clipboard"} onClick={handleCopy} btnClass={kopiert ? "bg-green-500 hover:bg-green-600 text-white" : "bg-blue-600 hover:bg-blue-700 text-white"} />
                        <ToolBox icon="fa-solid fa-file-pdf" colorClass="text-orange-500" title="Gruppen-Liste als PDF exportieren" desc="Erstellt ein druckfertiges PDF mit allen angelegten Gruppen und den zugeordneten Messdienern." btnText="PDF herunterladen" btnIcon="fa-solid fa-download" onClick={vm.exportiereGruppenPDF} btnClass="bg-orange-500 hover:bg-orange-600 text-white" />
                        <ToolBox icon="fa-solid fa-wand-magic-sparkles" colorClass="text-purple-500" title="Gruppen per KI aus Zwischenablage importieren" desc="Kopiere einen Text mit Gruppen und Namen in deine Zwischenablage. Die KI liest ihn aus und überschreibt deine aktuellen Gruppen." btnText="Aus Zwischenablage importieren" btnIcon="fa-solid fa-paste" onClick={handleKiImport} loading={kiLoading} btnClass="bg-purple-600 hover:bg-purple-700 text-white" />
                    </div>
                </div>
            );
        }

                        )}

                        <hr className="my-10 border-gray-200" />
                        <div className="flex justify-between items-end mb-6"><div><h2 className="text-2xl font-bold text-gray-900">Wöchentliche Abwesenheiten</h2><p className="text-gray-500 mt-1">Personen, die an bestimmten Wochentagen nie können.</p></div><button onClick={() => vm.setRegelmaessigeAbwesenheiten([...vm.regelmaessigeAbwesenheiten, { id: crypto.randomUUID(), name: '', wochentage: [] }])} className="bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition"><i className="fa-solid fa-plus mr-2"></i>Person hinzufügen</button></div>

                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 pb-10">
                            {vm.regelmaessigeAbwesenheiten.map(regel => (
                                <div key={regel.id} className="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <input type="text" placeholder="Name der Person..." value={regel.name} onChange={e => vm.setRegelmaessigeAbwesenheiten(vm.regelmaessigeAbwesenheiten.map(r => r.id === regel.id ? {...r, name: e.target.value} : r))} className="font-bold text-lg border-b border-gray-300 focus:border-blue-500 outline-none w-2/3 bg-transparent pb-1" />
                                        <button onClick={() => vm.setRegelmaessigeAbwesenheiten(vm.regelmaessigeAbwesenheiten.filter(r => r.id !== regel.id))} className="text-gray-400 hover:text-red-500 transition"><i className="fa-solid fa-trash"></i></button>
                                    </div>
                                    <div className="flex justify-between space-x-1">
                                        {wochentage.map(tag => {
                                            const isActive = regel.wochentage.includes(tag.id);
                                            return (
                                                <button key={tag.id} onClick={() => { const newTage = isActive ? regel.wochentage.filter(t => t !== tag.id) : [...regel.wochentage, tag.id]; vm.setRegelmaessigeAbwesenheiten(vm.regelmaessigeAbwesenheiten.map(r => r.id === regel.id ? {...r, wochentage: newTage} : r)); }} className={`w-10 h-10 rounded-lg font-bold text-sm transition-all duration-200 shadow-sm ${isActive ? 'bg-orange-500 text-white scale-105' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>{tag.n}</button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    {editVormerk && <VormerkungEditOverlay vormerkung={editVormerk} alleMinis={alleMinis} onCancel={() => setEditVormerk(null)} onSave={(v) => {
                        const exists = vm.vormerkungen.find(x => x.id === v.id);
                        if(exists) vm.setVormerkungen(vm.vormerkungen.map(x => x.id === v.id ? v : x));
                        else vm.setVormerkungen([...vm.vormerkungen, v]);
                        setEditVormerk(null);
                    }}/>}
                </div>
            );
        }

        // --- PROZESSIONEN VIEW ---
        function DropSlot({ title, value, onDrop }) {
            const handleDragOver = (e) => e.preventDefault();
            const handleDrop = (e) => { e.preventDefault(); onDrop(e.dataTransfer.getData("text")); };
            return (
                <div onDragOver={handleDragOver} onDrop={handleDrop} className="bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg p-3 text-center min-h-[60px] flex flex-col items-center justify-center">
                    <span className="text-xs text-gray-500 font-bold uppercase mb-1">{title}</span>
                    <span className="font-bold text-gray-800">{value || "-"}</span>
                </div>
            );
        }

        function DraggableMini({ name }) {
            return (
                <div draggable onDragStart={(e) => e.dataTransfer.setData("text", name)} className="bg-white border border-gray-200 shadow-sm rounded-md px-3 py-2 text-sm font-semibold cursor-grab active:cursor-grabbing hover:border-blue-400 transition">
                    {name}
                </div>
            );
        }

        function ProzessionenView() {
            const vm = useViewModel();
            const [selectedId, setSelectedId] = useState(null);
            const alleMinis = vm.gruppen.flatMap(g => g.mitglieder).sort();

            const sortedProzessionen = [...vm.prozessionen].sort((a, b) => {
                const d1 = vm.parseDateStr(a.datum) || new Date(0);
                const d2 = vm.parseDateStr(b.datum) || new Date(0);
                return d1 - d2;
            });

            return (
                <div className="flex h-full w-full">
                    <div className="w-[300px] bg-white border-r border-gray-200 flex flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10">
                        <div className="p-6">
                            <h2 className="text-2xl font-bold text-gray-900 mb-4">Prozessionen</h2>
                            <button onClick={() => {
                                const newId = crypto.randomUUID();
                                vm.setProzessionen([{id: newId, titel: "Neue Prozession", datum: "", gabenbereitung: ["",""], kollekte: ["",""], flambeaux: ["",""], weihrauch: "", schiffchen: "", kreuz: "", fahneGruenWeiss: ["",""], fahneGelbWeiss1: ["",""], kinderfahnen: ["",""], laternen: ["",""], fahneRotWeiss2: ["",""], hiddenMinis: []}, ...vm.prozessionen]);
                                setSelectedId(newId);
                            }} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 rounded-lg transition border border-gray-300">
                                <i className="fa-solid fa-plus mr-2"></i>Neu erstellen
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto px-3 space-y-1">
                            {sortedProzessionen.map(proz => (
                                <button key={proz.id} onClick={() => setSelectedId(proz.id)} className={`w-full text-left px-4 py-3 rounded-lg transition ${selectedId === proz.id ? 'bg-blue-600 text-white' : 'hover:bg-gray-100 text-gray-800'}`}>
                                    <div className="font-bold truncate">{proz.titel}</div>
                                    <div className={`text-sm ${selectedId === proz.id ? 'text-blue-200' : 'text-gray-500'}`}>{proz.datum || 'Kein Datum'}</div>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 bg-gray-50/50 p-10 overflow-y-auto flex space-x-8">
                        {!selectedId ? (
                            <div className="w-full h-full flex flex-col justify-center items-center text-gray-400"><i className="fa-solid fa-arrow-pointer text-7xl mb-4 opacity-50"></i><p className="text-xl font-medium">Wähle links eine Prozession aus</p></div>
                        ) : (
                            vm.prozessionen.filter(p => p.id === selectedId).map(proz => (
                                <React.Fragment key={proz.id}>
                                    {/* Sidebar für Drag & Drop Namen */}
                                    <div className="w-64 flex flex-col">
                                        <h3 className="font-bold text-gray-700 mb-4">Verfügbare Personen</h3>
                                        <div className="flex-1 overflow-y-auto space-y-2 pr-2">
                                            {alleMinis.map(m => <DraggableMini key={m} name={m} />)}
                                        </div>
                                    </div>
                                    {/* Editor Area */}
                                    <div className="flex-1 bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
                                        <div className="flex justify-between items-start mb-10">
                                            <div>
                                                <input type="text" value={proz.titel} onChange={e => vm.setProzessionen(vm.prozessionen.map(pr => pr.id === proz.id ? {...pr, titel: e.target.value} : pr))} className="text-4xl font-black text-gray-900 border-none outline-none focus:ring-0 p-0 mb-2 w-full bg-transparent" placeholder="Titel..." />
                                                <input type="text" value={proz.datum} onChange={e => vm.setProzessionen(vm.prozessionen.map(pr => pr.id === proz.id ? {...pr, datum: e.target.value} : pr))} className="text-xl font-bold text-blue-600 border-none outline-none focus:ring-0 p-0 bg-transparent" placeholder="DD.MM.YYYY" />
                                            </div>
                                            <button onClick={() => { vm.setProzessionen(vm.prozessionen.filter(p => p.id !== proz.id)); setSelectedId(null); }} className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg font-bold transition">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>

                                        <div className="bg-gray-100 p-6 rounded-xl space-y-6">
                                            <h3 className="text-center font-black text-2xl text-gray-800 uppercase tracking-widest mb-6">Aufstellung</h3>
                                            
                                            <div className="flex justify-center"><div className="w-1/2"><DropSlot title="Kreuz" value={proz.kreuz} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, kreuz: v}:pr))} /></div></div>
                                            
                                            <div className="flex space-x-4">
                                                <div className="flex-1"><DropSlot title="Fahne (Grün/Weiß) 1" value={proz.fahneGruenWeiss[0]} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, fahneGruenWeiss: [v, pr.fahneGruenWeiss[1]]}:pr))} /></div>
                                                <div className="flex-1"><DropSlot title="Fahne (Grün/Weiß) 2" value={proz.fahneGruenWeiss[1]} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, fahneGruenWeiss: [pr.fahneGruenWeiss[0], v]}:pr))} /></div>
                                            </div>

                                            <div className="text-center text-sm font-bold text-gray-400 tracking-widest my-4">— Männer —</div>

                                            <div className="flex space-x-4">
                                                <div className="flex-1"><DropSlot title="Fahne (Gelb/Weiß) 1" value={proz.fahneGelbWeiss1[0]} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, fahneGelbWeiss1: [v, pr.fahneGelbWeiss1[1]]}:pr))} /></div>
                                                <div className="flex-1"><DropSlot title="Fahne (Gelb/Weiß) 2" value={proz.fahneGelbWeiss1[1]} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, fahneGelbWeiss1: [pr.fahneGelbWeiss1[0], v]}:pr))} /></div>
                                            </div>

                                            <div className="text-center text-sm font-bold text-gray-400 tracking-widest my-4">— Musikverein —</div>

                                            <div className="flex space-x-4">
                                                <div className="flex-1"><DropSlot title="Flambeaux 1" value={proz.flambeaux[0]} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, flambeaux: [v, pr.flambeaux[1]]}:pr))} /></div>
                                                <div className="flex-1"><DropSlot title="Flambeaux 2" value={proz.flambeaux[1]} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, flambeaux: [pr.flambeaux[0], v]}:pr))} /></div>
                                            </div>

                                            <div className="flex justify-center"><div className="w-1/2"><DropSlot title="Weihrauch" value={proz.weihrauch} onDrop={v => vm.setProzessionen(vm.prozessionen.map(pr=>pr.id===proz.id?{...pr, weihrauch: v}:pr))} /></div></div>
                                        </div>
                                    </div>
                                </React.Fragment>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        function EventsView() {
            const vm = useViewModel();
            const [selectedEventId, setSelectedEventId] = useState(null);
            const sortedEvents = [...vm.events].sort((a, b) => { const d1 = vm.parseDateStr(a.datum) || new Date(0); const d2 = vm.parseDateStr(b.datum) || new Date(0); return d1 - d2; });

            return (
                <div className="flex h-full w-full">
                    <div className="w-[300px] bg-white border-r border-gray-200 flex flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10">
                        <div className="p-6"><h2 className="text-2xl font-bold text-gray-900 mb-4">Events</h2><button onClick={() => { const newId = crypto.randomUUID(); vm.setEvents([{id: newId, titel: "Neues Event", datum: "01.01.2026", beschreibung: "Details hier eintragen...", isICal: false, ablauf: [], teilnehmer: []}, ...vm.events]); setSelectedEventId(newId); }} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 rounded-lg transition border border-gray-300"><i className="fa-solid fa-plus mr-2"></i>Event erstellen</button></div>
                        <div className="flex-1 overflow-y-auto px-3 space-y-1">
                            {sortedEvents.map(event => (
                                <button key={event.id} onClick={() => setSelectedEventId(event.id)} className={`w-full text-left px-4 py-3 rounded-lg transition ${selectedEventId === event.id ? 'bg-blue-600 text-white' : 'hover:bg-gray-100 text-gray-800'}`}><div className="flex justify-between items-center"><span className="font-bold truncate">{event.titel}</span>{event.isICal && <i className="fa-solid fa-cloud text-xs"></i>}</div><span className={`text-sm ${selectedEventId === event.id ? 'text-blue-200' : 'text-gray-500'}`}>{event.datum}</span></button>
                            ))}
                        </div>
                    </div>
                    <div className="flex-1 bg-gray-50/50 p-10 overflow-y-auto">
                        {!selectedEventId ? (
                            <div className="h-full flex flex-col justify-center items-center text-gray-400"><i className="fa-solid fa-arrow-pointer text-7xl mb-4 opacity-50"></i><p className="text-xl font-medium">Wähle links ein Event aus</p></div>
                        ) : (
                            <div className="max-w-4xl bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
                                {vm.events.filter(e => e.id === selectedEventId).map(event => (
                                    <div key={event.id}>
                                        <div className="flex justify-between items-start mb-6"><div><input type="text" value={event.titel} onChange={e => vm.setEvents(vm.events.map(ev => ev.id === event.id ? {...ev, titel: e.target.value} : ev))} className="text-4xl font-black text-gray-900 border-none outline-none focus:ring-0 p-0 mb-2 w-full bg-transparent" /><input type="text" value={event.datum} onChange={e => vm.setEvents(vm.events.map(ev => ev.id === event.id ? {...ev, datum: e.target.value} : ev))} className="text-xl font-bold text-blue-600 border-none outline-none focus:ring-0 p-0 bg-transparent" /></div><button onClick={() => { vm.setEvents(vm.events.filter(e => e.id !== event.id)); setSelectedEventId(null); }} className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg font-bold transition"><i className="fa-solid fa-trash mr-2"></i>Löschen</button></div>
                                        <textarea value={event.beschreibung} onChange={e => vm.setEvents(vm.events.map(ev => ev.id === event.id ? {...ev, beschreibung: e.target.value} : ev))} className="w-full h-32 bg-gray-50 border border-gray-200 rounded-xl p-4 text-gray-700 outline-none focus:border-blue-500 mb-8" placeholder="Event Beschreibung..."></textarea>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const { activeTab, isAppLoading, apiKey } = useViewModel();

            if (isAppLoading) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-white flex-col space-y-6">
                        <i className="fa-solid fa-cloud text-blue-500 text-7xl animate-bounce"></i>
                        <div className="text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Lade Arbeitsbereich...</h2>
                            <p className="text-gray-500 text-lg">Initialisiere App-Daten und UI</p>
                        </div>
                    </div>
                );
            }

            if (!apiKey) return <LoginOverlay />;

            return (
                <div className="flex h-screen w-full bg-macBg text-[#1d1d1f] antialiased">
                    <Sidebar/>
                    <div className="flex-1 flex flex-col bg-white overflow-hidden shadow-[-4px_0_15px_rgba(0,0,0,0.05)] z-10 relative">
                        {(!activeTab || activeTab === 'planer') && <PlanerView/>}
                        {activeTab === 'prozessionen' && <ProzessionenView/>}
                        {activeTab === 'events' && <EventsView/>}
                        {activeTab === 'vormerken' && <VormerkenView/>}
                        {activeTab === 'statistik' && <StatistikView/>}
                        {activeTab === 'notizen' && <NotizenView/>}
                        {activeTab === 'werkzeuge' && <WerkzeugeView/>}
                        {activeTab === 'messdiener' && <MessdienerView/>}
                        {activeTab === 'einstellungen' && <EinstellungenView/>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ViewModelProvider><App/></ViewModelProvider>);
    </script>
</body>
</html>
